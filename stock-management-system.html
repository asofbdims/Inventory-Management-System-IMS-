/* =========================================================================
   Stock register page
   ========================================================================= */
function renderStockPage(user, routeParams) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  const state = { centers: [], items: [], stock: {}, units: {}, entries: [] };
  let anchorId = null;
  let selectedCenter = null;
  let diffFilter = 'clean';
  /* NOTE (2026-09-29): 98 'difference' entries (A != B) are dummy/test stock.
     Hidden by default: diffFilter starts as 'clean' so only the 2,336 clean
     entries show. Data is NOT deleted - the DB is intact. To bring the 98
     rows back into default view, change the line above to:
       let diffFilter = null;  */
  let skipCurrentCentre = null;
  let page = 0;
  let pageSize = 50;
  const canDeleteReg = function () { return isAdmin(); }();
  const SCROLL_KEY = 'stock-register-scroll';
  const paramC = routeParams.get('c');
  const fullScope = isAdmin() || isViewer();

  function scopeCenters() {
    if (fullScope) return state.centers;
    const me = state.centers.find((c) => String(c.id) === String(user.id));
    if (!me) return [];
    const byParent = {};
    state.centers.forEach((c) => { (byParent[c.parentId || ''] = byParent[c.parentId || ''] || []).push(c); });
    const out = [];
    const walk = (node) => { out.push(node); (byParent[node.id] || []).forEach(walk); };
    walk(me);
    return out;
  }

  function typeBadge(t) {
    if (t === 'CENTRE') return '<span class="badge navy">CENTRE</span>';
    if (t === 'SUB CENTRE') return '<span class="badge azure">SUB CENTRE</span>';
    if (t === 'POINT') return '<span class="badge sky">POINT</span>';
    return '<span class="badge green">ASO ADMIN</span>';
  }

  function conditionOf(stock, items) {
    const cells = items.map((it) => Number(stock[it] || 0));
    const total = cells.reduce((a, b) => a + b, 0);
    const filled = cells.filter((v) => v > 0).length;
    let label = 'No Stock', cls = 'red';
    if (total > 0) {
      const ratio = filled / items.length;
      if (ratio >= 0.9 && total > 150) { label = 'Good'; cls = 'green'; }
      else if (ratio >= 0.5) { label = 'Moderate'; cls = 'amber'; }
      else { label = 'Low'; cls = 'red'; }
    }
    return { label, cls, total };
  }

  const diffTxt = (d) => (d > 0 ? '+' : '') + d;
  const diffCls = (d) => d < 0 ? 'neg' : (d > 0 ? 'pos' : 'zero');

  async function load() {
    const [centers, stockData, entries] = await Promise.all([fetchCenters(), fetchStock(), fetchStockRegister()]);
    state.centers = centers;
    state.items = stockData.items;
    state.stock = stockData.stock;
    state.units = stockData.unit;
    state.entries = entries;
    render();
  }

  function scopeIds() {
    if (fullScope) return new Set(state.centers.map((c) => String(c.id)));
    const byP = {};
    state.centers.forEach((c) => { (byP[c.parentId || ''] = byP[c.parentId || ''] || []).push(c); });
    const me = state.centers.find((c) => String(c.id) === String(user.id));
    const out = [];
    const w = (n) => { out.push(n); (byP[n.id] || []).forEach(w); };
    if (me) w(me);
    return new Set(out.map((c) => String(c.id)));
  }

  function summary(ids) {
    let totalQty = 0, noStock = 0;
    state.centers.forEach((c) => {
      if (!ids.has(String(c.id))) return;
      const s = state.stock[c.id] || {};
      const t = Object.keys(s).reduce((a, k) => a + (Number(s[k]) || 0), 0);
      totalQty += t;
      if (t === 0) noStock++;
    });
    const scoped = state.entries.filter((en) => ids.has(String(en.centreId)));
    return { items: state.items.length, qty: totalQty, noStock, entries: scoped.length, diff: scoped.filter((en) => Number(en.difference) !== 0).length };
  }

  function render() {
    const ids = scopeIds();
    const scopedEntries = state.entries.filter((en) => ids.has(String(en.centreId)));
    const centreScope = skipCurrentCentre ? scopedEntries.filter((en) => String(en.centreId) === String(skipCurrentCentre)) : scopedEntries;
    const diffMode = diffFilter === 'diff' ? true : (diffFilter === 'clean' ? false : null);
    const shown = diffMode == null ? centreScope : centreScope.filter((en) => diffMode ? Number(en.difference) !== 0 : Number(en.difference) === 0);
    const totalPages = Math.max(1, Math.ceil(shown.length / pageSize));
    if (page >= totalPages) page = totalPages - 1;
    const pageRows = [...shown].reverse().slice(page * pageSize, (page + 1) * pageSize);
    const centreSel = skipCurrentCentre ? scopeCenters().find((x) => String(x.id) === String(skipCurrentCentre)) : null;

    function pgNumbers() {
      const win = [];
      for (let p = 0; p < totalPages; p++) {
        if (totalPages <= 7 || p === 0 || p === totalPages - 1 || Math.abs(p - page) <= 1) win.push(p);
        else if (win[win.length - 1] !== -1) win.push(-1);
      }
      return win;
    }
    const pgLinks = pgNumbers();
    let pgHtml = '';
    if (shown.length) {
      pgHtml = `
        <div class="reg-pagination">
          <span class="pg-info">${page * pageSize + 1}–${Math.min(shown.length, (page + 1) * pageSize)} of ${shown.length}</span>
          <button class="pg-btn" data-pg="prev"${page === 0 ? ' disabled' : ''}>‹ Prev</button>
          ${pgLinks.map((n) => n === -1 ? '<span class="pg-btn" style="border:none;background:none;cursor:default">…</span>' : `<button class="pg-btn${n === page ? ' active' : ''}" data-pg="${n}">${n + 1}</button>`).join('')}
          <button class="pg-btn" data-pg="next"${page >= totalPages - 1 ? ' disabled' : ''}>Next ›</button>
        </div>`;
    }

    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>Stock Register</h2>
          <p>${isAdmin() ? 'Physical-stock verification ledger for every centre — log each verified count, spot any difference from the book figure, and adjust stock when needed.' : 'Verification ledger for your centre + allocated sub centres & points — log each verified count and spot differences from the book figure.'}</p>
        </div>
        <div class="sr-actions">
          <button class="btn sm" id="btnManage" title="Add, edit or delete stock items">Manage Items</button>
          <button class="btn primary" id="btnNew" title="Enter a new physical verification entry">＋ New Verification Entry</button>
        </div>
      </div>
      <div class="reg-toolbar">
        <div class="rt-row">
          <select id="regCentre" title="Filter the register to one centre"></select>
          <button class="btn sm" id="btnClear" title="Clear all filters">Clear All</button>
          <div class="rt-right">
            <span class="rt-size"><span>Show</span><select id="pgSize" title="Rows per page"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select><span>Entries</span></span>
            <span class="rt-count">${shown.length} records</span>
            <button class="btn sm" id="btnPrint" title="Print the register">Print</button>
            <button class="btn sm" id="btnExport" title="Download the verification register as CSV">Export</button>
          </div>
        </div>
      </div>
      ${(centreSel) ? `<div class="reg-pills">
        ${`<span class="reg-pill">Centre : ${esc(centreSel.name)}<button data-clearf="centre" title="Remove filter">✕</button></span>`}
      </div>` : ''}
      <!-- DIFF PILL COMMENTED OUT: filter locked to "No difference" (see code note near diffFilter default). 
           ${diffFilter != null ? `<span class="reg-pill">Filter : No difference</span>` : ''} -->
      <div class="table-wrap">
        <table class="stock-table reg-table">
          <thead><tr>
            <th>S. No.</th>
            <th class="stick-1">Satsang Place</th>
            <th>Name of Item</th>
            <th>Stock Register Page No.</th>
            <th>Approval Number</th>
            <th>Approval Date</th>
            <th>Quantity as per Stock Register (A)</th>
            <th>Physically Available Quantity (B)</th>
            <th>Difference (if any) (A−B)</th>
            <th>Reason for Difference</th>
            <th>Remarks</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>${pageRows.map((en, i) => renderRegRow(en, page * pageSize + i + 1)).join('') || '<tr><td class="empty" colspan="12">No verification entries yet — click "＋ New Verification Entry" to log the first physical count.</td></tr>'}</tbody>
        </table>
      </div>
      ${pgHtml}
      <p style="margin-top:12px;color:var(--muted);font-size:12px">${shown.length} of ${centreScope.length} entries in scope${skipCurrentCentre ? ' · filtered to one centre' : ''}${diffFilter ? ' · filtered by difference' : ''}. The Difference column is computed automatically as (A − B); use <b>Apply</b> to write the physically counted quantity back into the book figure.</p>
    `;

    bindSearch();
    content.querySelector('#btnNew').addEventListener('click', () => openRegisterModal(null));
    const btnManage = content.querySelector('#btnManage');
    if (btnManage) btnManage.addEventListener('click', () => openItemsManager('list'));
    const btnExport = content.querySelector('#btnExport');
    if (btnExport) btnExport.addEventListener('click', exportStock);
    const btnPrint = content.querySelector('#btnPrint');
    if (btnPrint) btnPrint.addEventListener('click', printStock);
    content.querySelectorAll('.reg-filter').forEach((b) => b.addEventListener('click', () => {
      diffFilter = 'clean';
      page = 0;
      render();
    }));
    content.querySelectorAll('[data-clearf]').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.clearf === 'centre') skipCurrentCentre = null;
      page = 0;
      render();
    }));
    const btnClear = content.querySelector('#btnClear');
    if (btnClear) btnClear.addEventListener('click', () => { skipCurrentCentre = null; page = 0; render(); });
    const pgSize = content.querySelector('#pgSize');
    if (pgSize) pgSize.addEventListener('change', () => { pageSize = Number(pgSize.value) || 50; page = 0; render(); });
    content.querySelectorAll('.pg-btn').forEach((b) => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.pg === 'prev') page = Math.max(0, page - 1);
      else if (b.dataset.pg === 'next') page = Math.min(totalPages - 1, page + 1);
      else page = Number(b.dataset.pg);
      render();
    }));
    const wrap = content.querySelector('.table-wrap');
    const saved = sessionStorage.getItem(SCROLL_KEY);
    if (wrap && saved) {
      try { const p = JSON.parse(saved); wrap.scrollLeft = p.left || 0; wrap.scrollTop = p.top || 0; } catch (e) {}
    }
  }

  function bindSearch() {
    const sel = content.querySelector('#regCentre');
    if (!sel) return;
    const counts = {};
    state.entries.forEach((en) => { counts[String(en.centreId)] = (counts[String(en.centreId)] || 0) + 1; });
    const sorted = scopeCenters().slice().sort((a, b) => a.name.localeCompare(b.name));
    const opts = ['<option value="">All Centres (all entries)</option>'].concat(sorted.map((c) => {
      const cnt = counts[String(c.id)] || 0;
      return `<option value="${esc(c.id)}">${esc(c.name)}${cnt ? ` (${cnt})` : ''}</option>`;
    }));
    sel.innerHTML = opts.join('');
    if (skipCurrentCentre) sel.value = String(skipCurrentCentre);
    sel.addEventListener('change', () => {
      skipCurrentCentre = sel.value ? sel.value : null;
      page = 0;
      render();
    });
  }

  content.addEventListener('scroll', () => {
    const wrap = content.querySelector('.table-wrap');
    if (!wrap) return;
    sessionStorage.setItem(SCROLL_KEY, JSON.stringify({ top: wrap.scrollTop, left: wrap.scrollLeft }));
  }, true);

  function unitOf(cid, item) {
    return (state.units[cid] && state.units[cid][item]) || '';
  }

  function renderRegRow(en, sno) {
    const d = Number(en.difference);
    const fmtDate = (s) => { if (!s) return '—'; const dt = new Date(s + (s.length === 10 ? 'T00:00:00' : '')); if (isNaN(dt)) return s; return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const centre = centerName(en.centreId);
    const unit = esc(en.unit || unitOf(en.centreId, en.item));
    return `<tr data-id="${en.id}">
      <td class="sno">${sno}</td>
      <td class="centre stick-1"><b>${esc(centre)}</b></td>
      <td>${esc(en.item)}</td>
      <td>${esc(en.pageNo || '—')}</td>
      <td>${esc(en.approvalNo || '—')}</td>
      <td>${fmtDate(en.approvalDate)}</td>
      <td>${Number(en.qtyA)}${unit ? ' ' + unit : ''}</td>
      <td>${Number(en.qtyB)}${unit ? ' ' + unit : ''}</td>
      <td class="diff ${diffCls(d)}">${diffTxt(d)}</td>
      <td class="wrap">${esc(en.reason || '—')}</td>
      <td class="wrap">${esc(en.remarks || '—')}</td>
      <td>
        <div class="row-actions">
          <button class="btn sm" data-reg="edit" data-id="${en.id}" title="Edit this entry">Edit</button>
          ${d !== 0 ? `<button class="btn sm" data-reg="apply" data-id="${en.id}" title="Write the physically counted quantity (B) into the book">Apply</button>` : ''}
          ${canDeleteReg ? `<button class="btn red sm" data-reg="del" data-id="${en.id}" title="Delete this entry">×</button>` : ''}
        </div>
      </td>
    </tr>`;
  }

  function centerName(id) {
    const c = state.centers.find((x) => x.id === id);
    return c ? c.name : id;
  }

  function openRegisterModal(entry) {
    const scoped = scopeCenters();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(680px,94vw)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">${entry ? 'Edit Verification Entry' : 'New Verification Entry'}</h3>
          <button class="btn sm" id="rmCancel">Close</button>
        </div>
        <p class="hint" style="margin:8px 0 0">Rows are appended to the paper-style register. Quantity (A) is filled from the book figure; enter the counted quantity as (B) and the Difference is computed automatically. When an Approval Number <b>and</b> Approval Date are recorded, the centre's book figure for this item is automatically updated to (B).</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
          <div class="field">
            <label>Satsang Place (Centre) *</label>
            <select id="rm_centre">${scoped.map((c) => `<option value="${c.id}"${entry && Number(entry.centreId) === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label>Name of Item *</label>
            <select id="rm_item">${state.items.map((it) => `<option value="${esc(it)}"${entry && entry.item === it ? ' selected' : ''}>${esc(it)}</option>`).join('') || '<option value="">(no items yet)</option>'}</select>
          </div>
          <div class="field"><label>Stock Register Page No.</label><input id="rm_page" placeholder="e.g. 12" value="${esc(entry ? entry.pageNo || '' : '')}"></div>
          <div class="field"><label>Approval Number</label><input id="rm_appr" placeholder="e.g. ARD/2026/001" value="${esc(entry ? entry.approvalNo || '' : '')}"></div>
          <div class="field"><label>Approval Date</label><input type="date" id="rm_adate" value="${esc(entry && entry.approvalDate ? entry.approvalDate.slice(0, 10) : new Date().toISOString().slice(0, 10))}"></div>
          <div class="field"><label>Quantity as per Stock Register (A)</label><input type="number" id="rm_qtyA" min="0" value="${entry ? Number(entry.qtyA) : 0}" readonly></div>
          <div class="field"><label>Physically Available Quantity (B)</label><input type="number" id="rm_qtyB" min="0" value="${entry ? Number(entry.qtyB) : 0}"></div>
          <div class="field"><label>Unit</label><input id="rm_unit" placeholder="e.g. mtr, nos, KG" value="${esc(entry ? entry.unit || unitOf(entry.centreId, entry.item) : '')}"></div>
          <div class="field"><label>Difference (if any) (A − B)</label><input type="text" id="rm_diff" readonly value="${entry ? diffTxt(Number(entry.difference)) : 0}"></div>
          <div class="field" style="grid-column:1/-1"><label>Reason for Difference</label><input id="rm_reason" placeholder="Only if there is any difference" value="${esc(entry ? entry.reason || '' : '')}"></div>
          <div class="field" style="grid-column:1/-1"><label>Remarks</label><input id="rm_remarks" placeholder="Any remarks" value="${esc(entry ? entry.remarks || '' : '')}"></div>
        </div>
        <div class="m-actions">
          <button class="btn" id="rmCancel2">Cancel</button>
          <button class="btn primary" id="rmSave">${entry ? 'Save Changes' : 'Add Entry'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const n = (id) => overlay.querySelector('#' + id);
    const escTe = (id) => () => { try { return n(id).value.trim(); } catch (e) { return ''; } };
    const close = () => { document.body.removeChild(overlay); document.removeEventListener('keydown', escClose, true); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escClose, true);

    const syncA = () => {
      const cid = n('rm_centre').value; const it = n('rm_item').value;
      const cur = Number(state.stock[cid] ? state.stock[cid][it] || 0 : 0);
      n('rm_qtyA').value = entry ? Number(entry.qtyA) : cur;
      n('rm_unit').value = entry ? (entry.unit || unitOf(entry.centreId, entry.item)) : unitOf(cid, it);
      syncDiff();
    };
    const syncDiff = () => {
      const a = Number(n('rm_qtyA').value) || 0; const b = Number(n('rm_qtyB').value) || 0;
      n('rm_diff').value = diffTxt(a - b);
    };
    n('rm_centre').addEventListener('change', () => { if (!entry) syncA(); });
    n('rm_item').addEventListener('change', () => { if (!entry) syncA(); });
    n('rm_qtyB').addEventListener('input', syncDiff);

    const close2 = () => { const b = n('rmCancel2'); if (b) b.addEventListener('click', close); };
    n('rmCancel').addEventListener('click', close);
    n('rmCancel2').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
    void close2;

    n('rmSave').addEventListener('click', async () => {
      const cid = n('rm_centre').value;
      const it = n('rm_item').value;
      if (!cid || !it) return toast('Select a centre and an item', true);
      const qtyB = Math.max(0, Number(n('rm_qtyB').value) || 0);
      const qtyA = entry ? Number(entry.qtyA) : (Number(state.stock[cid] ? state.stock[cid][it] || 0 : 0));
      const fields = {
        centreId: cid,
        item: it,
        pageNo: escTe('rm_page')(),
        approvalNo: escTe('rm_appr')(),
        approvalDate: n('rm_adate').value || null,
        qtyA,
        qtyB,
        unit: escTe('rm_unit')(),
        reason: escTe('rm_reason')(),
        remarks: escTe('rm_remarks')()
      };
      n('rmSave').disabled = true;
      try {
        if (entry) await updateStockRegisterEntry(entry.id, fields);
        else await createStockRegisterEntry(fields);
        let applied = false;
        if (fields.approvalNo && fields.approvalDate) {
          try {
            await updateStock(cid, { [it]: qtyB }, { [it]: fields.unit });
            applied = true;
          } catch (err) { toast('Book figure update failed: ' + err.message, true); }
        }
        toast(applied ? 'Entry saved and centre book figure updated to ' + qtyB : (entry ? 'Entry updated' : 'Verification entry added'));
        close();
        load();
      } catch (err) { n('rmSave').disabled = false; toast(err.message, true); }
    });
    setTimeout(() => { try { (entry ? n('rm_qtyB') : n('rm_centre')).focus(); } catch (e) {} }, 80);
    syncA();
  }

  content.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-reg]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const en = state.entries.find((x) => Number(x.id) === id);
    if (!en) return;
    if (btn.dataset.reg === 'edit') { openRegisterModal(en); return; }
    if (btn.dataset.reg === 'del' && canDeleteReg) {
      if (!confirm('Delete this verification entry for ' + centerName(en.centreId) + ' — ' + en.item + '?')) return;
      deleteStockRegisterEntry(id).then(() => { toast('Entry deleted'); load(); }).catch((err) => toast(err.message, true));
      return;
    }
    if (btn.dataset.reg === 'apply') {
      if (!confirm('Set the book figure for ' + centerName(en.centreId) + ' — ' + en.item + ' to the physically counted quantity ' + en.qtyB + '?')) return;
      btn.disabled = true;
      updateStock(en.centreId, { [en.item]: Number(en.qtyB) }, { [en.item]: en.unit || unitOf(en.centreId, en.item) }).then(() => { toast('Book figure updated to ' + en.qtyB); load(); }).catch((err) => { btn.disabled = false; toast(err.message, true); });
    }
  });

  function exportStock() {
    try {
      const csvCell = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const ids = scopeIds();
      const rows = state.entries
        .filter((en) => ids.has(String(en.centreId)))
        .filter((en) => (skipCurrentCentre ? String(en.centreId) === String(skipCurrentCentre) : true))
        .filter((en) => (diffFilter === 'diff' ? Number(en.difference) !== 0 : (diffFilter === 'clean' ? Number(en.difference) === 0 : true)))
        .map((en) => {
          const fmtDate = (s) => { if (!s) return ''; const dt = new Date(s + (s.length === 10 ? 'T00:00:00' : '')); return isNaN(dt) ? s : dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
          return [centerName(en.centreId), en.item, en.pageNo || '', en.approvalNo || '', fmtDate(en.approvalDate), Number(en.qtyA), Number(en.qtyB), en.unit || unitOf(en.centreId, en.item), Number(en.difference), en.reason || '', en.remarks || ''];
        });
      const header = ['S.No', 'Satsang Place', 'Name of Item', 'Stock Register Page No.', 'Approval Number', 'Approval Date', 'Quantity as per Stock Register (A)', 'Physically Available Quantity (B)', 'Unit', 'Difference (if any) (A−B)', 'Reason for Difference', 'Remarks'];
      const csv = [header.map((h) => csvCell(h)).join(',')].concat(rows.map((r, i) => [i + 1].concat(r).map(csvCell).join(','))).join('\r\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'stock-verification-register.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Register exported as CSV');
    } catch (err) {
      toast('Export failed: ' + (err.message || err), true);
    }
  }

  function printStock() {
    try {
      const ids = scopeIds();
      const allShown = state.entries
        .filter((en) => ids.has(String(en.centreId)))
        .filter((en) => (skipCurrentCentre ? String(en.centreId) === String(skipCurrentCentre) : true))
        .filter((en) => (diffFilter === 'diff' ? Number(en.difference) !== 0 : (diffFilter === 'clean' ? Number(en.difference) === 0 : true)));
      const tbody = content.querySelector('.reg-table tbody');
      if (tbody && allShown.length) {
        const rows = [...allShown].reverse().map((en, i) => renderRegRow(en, i + 1)).join('');
        tbody.innerHTML = rows;
      }
      window.print();
    } catch (err) {
      toast('Print failed: ' + (err.message || err), true);
    }
  }

  function openItemsManager(focus) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(720px,94vw)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">Manage Stock Items</h3>
          <button class="btn sm" id="imClose">Close</button>
        </div>
        <div class="items-add" style="margin-top:14px">
          <input id="im_name" placeholder="Item name" maxlength="200">
          <input id="im_desc" placeholder="Description (optional)">
          <input id="im_cat" placeholder="Category (optional)">
          <button class="btn primary sm" id="im_add">Add Item</button>
        </div>
        <p class="hint" style="margin:8px 0 4px">Renaming an item updates it in every centre's stock register; deleting removes its stock rows from all centres.</p>
        <div id="imList" style="margin-top:10px;max-height:52vh;overflow:auto"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    if (focus === 'add') setTimeout(() => { try { overlay.querySelector('#im_name').focus(); } catch (e) {} }, 80);

    let rows = [];
    const listEl = overlay.querySelector('#imList');
    const n = (id) => overlay.querySelector('#' + id);
    const close = () => { document.body.removeChild(overlay); document.removeEventListener('keydown', escClose, true); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escClose, true);
    n('imClose').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

    function render() {
      if (!rows.length) {
        listEl.innerHTML = '<div class="card hint" style="padding:16px;text-align:center">No items yet — add the first one above.</div>';
        return;
      }
      listEl.innerHTML = rows.map((r, i) => r.editing ? `
        <div class="item-row">
          <div class="item-edit">
            <input id="row_name_${r.id}" value="${esc(r.name)}" maxlength="200" placeholder="Item name">
            <input id="row_desc_${r.id}" value="${esc(r.description || '')}" placeholder="Description (optional)">
            <input id="row_cat_${r.id}" value="${esc(r.category || '')}" placeholder="Category (optional)">
          </div>
          <div class="item-actions">
            <button class="btn primary sm" data-act="save" data-id="${r.id}">Save</button>
            <button class="btn sm" data-act="cancel">Cancel</button>
          </div>
        </div>` : `
        <div class="item-row">
          <div style="flex:1">
            <b>${esc(r.name)}</b>
            <div class="meta">${esc(r.description || '')}${(r.category ? ' · ' + esc(r.category) : (r.description ? '' : 'No description'))}</div>
          </div>
          <div class="item-actions">
            <button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button>
            <button class="btn red sm" data-act="del" data-id="${r.id}" data-name="${esc(r.name)}">Delete</button>
          </div>
        </div>`).join('');
    }

    async function loadRows() {
      try {
        rows = await fetchItemsFull();
        render();
      } catch (err) { toast(err.message, true); }
    }

    n('im_add').addEventListener('click', async () => {
      const name = n('im_name').value.trim();
      if (!name) return toast('Item name is required', true);
      try {
        await createStockItem({ name, description: n('im_desc').value, category: n('im_cat').value });
        n('im_name').value = ''; n('im_desc').value = ''; n('im_cat').value = '';
        toast('Item added: ' + name);
        load();
        await loadRows();
      } catch (err) { toast(err.message, true); }
    });

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      const row = rows.find((r) => Number(r.id) === Number(btn.dataset.id));
    if (act === 'edit') {
        rows.forEach((r) => { r.editing = false; });
        if (row) row.editing = true;
        render();
      } else if (act === 'cancel') {
        rows.forEach((r) => { r.editing = false; });
        render();
      } else if (act === 'save' && row) {
        const nameEl = overlay.querySelector('#row_name_' + row.id);
        const name = (nameEl ? nameEl.value : '').trim();
        if (!name) return toast('Item name is required', true);
        btn.disabled = true;
        try {
          await updateItemRecord(row.id, {
            name,
            description: overlay.querySelector('#row_desc_' + row.id).value,
            category: overlay.querySelector('#row_cat_' + row.id).value
          }, row.name);
          toast('Item updated: ' + name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      } else if (act === 'del' && row) {
        if (!confirm('Delete item "' + row.name + '" and remove its stock from every centre? This cannot be undone.')) return;
        btn.disabled = true;
        try {
          await deleteStockItem(row.id, row.name);
          toast('Item deleted: ' + row.name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      }
    });

    loadRows().catch((err) => toast(err.message, true));
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Masters page — item master (auto codes) + document master (GRN, uploads)
   ========================================================================= */
function renderMastersPage(user, focus) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="logo-banner">
      <div>
        <h2>Inventory Masters</h2>
        <p>Item catalogue with auto-generated codes, and document master for GRN &amp; SCI form PDFs.</p>
      </div>
      <div class="sr-actions">
        <button class="btn sm" id="maExport" title="Download the item catalogue as CSV">Export</button>
        <button class="btn primary" id="maAddItem" title="Add a new stock item">＋ Add Item</button>
      </div>
    </div>
    <div class="masters-grid single" id="maGrid">
      <div id="maPanel-item">
        <div class="reg-toolbar">
          <div class="rt-row">
            <input id="maSearch" type="text" placeholder="Search items by name, code or description…" autocomplete="off">
            <select id="maLetter" class="ma-letter" title="Filter items by the first letter of their name"><option value="">All letters</option></select>
            <button class="btn sm" id="maClear" title="Clear all filters">Clear All</button>
            <div class="rt-right">
              <span class="rt-size"><span>Show</span><select id="maPgSize" title="Rows per page"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select><span>Entries</span></span>
              <span class="rt-count" id="maCount"></span>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="ma-tbl">
            <thead><tr><th>Code</th><th>Name</th><th>Description</th><th>Category</th><th></th></tr></thead>
            <tbody id="maItemList"></tbody>
          </table>
        </div>
        <div class="reg-pagination" id="maPagination"></div>
      </div>
      <div id="maPanel-doc" style="display:none">
        <div class="reg-toolbar">
          <div class="rt-row">
            <span class="ma-badge doc">Document Master</span>
            <span class="ma-sub">Upload SCI form PDFs &amp; manage GRN number</span>
            <div class="rt-right"><span class="rt-count" id="maDocCount"></span>${isAdmin() ? '<button class="btn primary sm" id="maAddDoc" title="Add a new document type">＋ Add Document</button>' : ''}</div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="ma-tbl">
            <thead><tr><th>Document</th><th>Doc No.</th><th>PDF</th>${isAdmin() ? '<th></th>' : ''}</tr></thead>
            <tbody id="maDocList"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  const panelItem = document.getElementById('maPanel-item');
  const panelDoc = document.getElementById('maPanel-doc');
  const showItem = focus !== 'doc';
  panelItem.style.display = showItem ? '' : 'none';
  panelDoc.style.display = showItem ? 'none' : '';

  /* -------- Item master -------- */
  const itemList = document.getElementById('maItemList');
  let items = [];
  let newEntry = null;
  let itemSearch = '';
  let itemLetter = '';
  let itemPage = 0;
  let itemPageSize = 50;

  const q = (id) => document.getElementById(id);

  function populateLetterOptions() {
    const sel = q('maLetter');
    if (!sel) return;
    const cur = itemLetter;
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    sel.innerHTML = '<option value="">All letters</option>' + letters.map((L) => `<option value="${L}">${L}</option>`).join('');
    sel.value = cur;
  }

  function filteredItems() {
    const term = itemSearch.trim().toLowerCase();
    return items.filter((r) => {
      if (itemLetter) {
        const first = (r.name || '').trim().charAt(0).toUpperCase();
        if (first !== itemLetter) return false;
      }
      if (!term) return true;
      return (r.name || '').toLowerCase().includes(term) || (r.code || '').toLowerCase().includes(term) || (r.description || '').toLowerCase().includes(term);
    });
  }

  function renderItemPagination(totalPages, n) {
    const pg = q('maPagination');
    if (!pg) return;
    if (!n) { pg.innerHTML = ''; return; }
    const win = [];
    for (let p = 0; p < totalPages; p++) {
      if (totalPages <= 7 || p === 0 || p === totalPages - 1 || Math.abs(p - itemPage) <= 1) win.push(p);
      else if (win[win.length - 1] !== -1) win.push(-1);
    }
    pg.innerHTML = `
      <span class="pg-info">${itemPage * itemPageSize + 1}–${Math.min(n, (itemPage + 1) * itemPageSize)} of ${n}</span>
      <button class="pg-btn" data-mpg="prev"${itemPage === 0 ? ' disabled' : ''}>‹ Prev</button>
      ${win.map((p) => p === -1 ? '<span class="pg-btn" style="border:none;background:none;cursor:default">…</span>' : `<button class="pg-btn${p === itemPage ? ' active' : ''}" data-mpg="${p}">${p + 1}</button>`).join('')}
      <button class="pg-btn" data-mpg="next"${itemPage >= totalPages - 1 ? ' disabled' : ''}>Next ›</button>`;
    pg.querySelectorAll('.pg-btn').forEach((b) => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.mpg === 'prev') itemPage = Math.max(0, itemPage - 1);
      else if (b.dataset.mpg === 'next') itemPage = Math.min(totalPages - 1, itemPage + 1);
      else itemPage = Number(b.dataset.mpg);
      renderItemRows();
    }));
  }

  function renderItemRows() {
    const list = filteredItems();
    const totalPages = Math.max(1, Math.ceil(list.length / itemPageSize));
    if (newEntry) itemPage = 0;
    if (itemPage >= totalPages) itemPage = totalPages - 1;
    const cnt = q('maCount');
    if (cnt) cnt.textContent = items.length ? `${list.length} of ${items.length} items` : '';
    const newRow = newEntry ? `
      <tr class="row-flash">
        <td><span class="item-code" style="background:var(--bg);color:var(--muted);font-weight:600">AUTO</span></td>
        <td><input id="maRowName_new" placeholder="Item name" maxlength="200" style="width:140px"></td>
        <td><input id="maRowDesc_new" placeholder="Description" style="width:160px"></td>
        <td><input id="maRowCat_new" placeholder="Category" style="width:110px"></td>
        <td><div class="doc-row-actions"><button class="btn green sm" data-act="savenew">Save</button><button class="btn sm" data-act="cancelnew">Cancel</button></div></td>
      </tr>` : '';
    if (!items.length && !newEntry) {
      itemList.innerHTML = '<tr><td colspan="5" class="empty">No items yet — click Add Item.</td></tr>';
      renderItemPagination(totalPages, 0);
      return;
    }
    if (!list.length && !newEntry) {
      itemList.innerHTML = '<tr><td colspan="5" class="empty">No items match your search.</td></tr>';
      renderItemPagination(totalPages, 0);
      return;
    }
    const pageRows = list.slice(itemPage * itemPageSize, (itemPage + 1) * itemPageSize);
    itemList.innerHTML = newRow + pageRows.map((r) => r.editing ? `
      <tr>
        <td><span class="item-code" style="background:var(--bg);color:var(--muted)">${esc(r.code || 'AUTO')}</span></td>
        <td><input id="maRowName_${r.id}" value="${esc(r.name)}" maxlength="200" style="width:140px"></td>
        <td><input id="maRowDesc_${r.id}" value="${esc(r.description || '')}" placeholder="Description" style="width:160px"></td>
        <td><input id="maRowCat_${r.id}" value="${esc(r.category || '')}" placeholder="Category" style="width:110px"></td>
        <td><div class="doc-row-actions"><button class="btn green sm" data-act="save" data-id="${r.id}">Save</button><button class="btn sm" data-act="cancel">Cancel</button></div></td>
      </tr>` : `
      <tr>
        <td><span class="item-code">${esc(r.code || 'ITM-###')}</span></td>
        <td><span class="item-name">${esc(r.name)}</span></td>
        <td>${esc(r.description || '—')}</td>
        <td>${esc(r.category || '—')}</td>
        <td><div class="doc-row-actions"><button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button><button class="btn red sm" data-act="del" data-id="${r.id}">Delete</button></div></td>
      </tr>`).join('');
    renderItemPagination(totalPages, list.length);
  }

  function exportItems() {
    try {
      const csvCell = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const rows = filteredItems().map((r) => [r.code || 'ITM-###', r.name || '', r.description || '', r.category || '']);
      const header = ['Code', 'Name', 'Description', 'Category'];
      const csv = [header.map(csvCell).join(',')].concat(rows.map((r) => r.map(csvCell).join(','))).join('\r\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'items-master.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Items exported as CSV');
    } catch (err) {
      toast('Export failed: ' + (err.message || err), true);
    }
  }

  function loadItems() {
    return fetchItemsFull().then((rows) => { items = rows; populateLetterOptions(); renderItemRows(); });
  }

  const maSearch = q('maSearch');
  const maLetter = q('maLetter');
  const maClear = q('maClear');
  const maPgSize = q('maPgSize');
  const maAddItem = q('maAddItem');
  const maExport = q('maExport');
  if (maSearch) maSearch.addEventListener('input', () => { itemSearch = maSearch.value; itemPage = 0; renderItemRows(); });
  if (maLetter) maLetter.addEventListener('change', () => { itemLetter = maLetter.value; itemPage = 0; renderItemRows(); });
  if (maClear) maClear.addEventListener('click', () => {
    itemSearch = ''; itemLetter = ''; itemPage = 0;
    if (maSearch) maSearch.value = '';
    if (maLetter) maLetter.value = '';
    renderItemRows();
  });
  if (maPgSize) maPgSize.addEventListener('change', () => { itemPageSize = Number(maPgSize.value) || 50; itemPage = 0; renderItemRows(); });
  if (maAddItem) maAddItem.addEventListener('click', () => {
    itemPage = 0;
    newEntry = { name: '', description: '', category: '' };
    renderItemRows();
    setTimeout(() => { const el = document.getElementById('maRowName_new'); if (el) el.focus(); }, 60);
  });
  if (maExport) maExport.addEventListener('click', exportItems);

  itemList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if (act === 'savenew') {
      const name = document.getElementById('maRowName_new').value;
      if (!name.trim()) return toast('Item name is required', true);
      createStockItem({
        name,
        description: document.getElementById('maRowDesc_new').value,
        category: document.getElementById('maRowCat_new').value
      })
        .then(() => { newEntry = null; toast('Item added with auto-generated code'); loadItems(); })
        .catch((err) => toast(err.message, true));
    } else if (act === 'cancelnew') {
      newEntry = null; renderItemRows();
    } else if (act === 'edit') {
      const r = items.find((x) => String(x.id) === id);
      if (r) { r.editing = true; renderItemRows(); }
    } else if (act === 'cancel') {
      const r = items.find((x) => String(x.id) === id);
      if (r) { delete r.editing; renderItemRows(); }
    } else if (act === 'save') {
      const r = items.find((x) => String(x.id) === id);
      if (!r) return;
      const fields = {
        name: document.getElementById('maRowName_' + id).value,
        description: document.getElementById('maRowDesc_' + id).value,
        category: document.getElementById('maRowCat_' + id).value
      };
      if (!fields.name.trim()) return toast('Item name is required', true);
      updateItemRecord(id, fields, r.name)
        .then(() => { toast('Item updated'); loadItems(); })
        .catch((err) => toast(err.message, true));
    } else if (act === 'del') {
      const r = items.find((x) => String(x.id) === id);
      if (!r || !confirm('Delete "' + r.name + '" and remove its stock rows from every centre?')) return;
      deleteStockItem(id, r.name)
        .then(() => { toast('Item deleted'); loadItems(); })
        .catch((err) => toast(err.message, true));
    }
  });

  loadItems().catch((err) => toast(err.message, true));

  /* -------- Document master -------- */
  const docList = document.getElementById('maDocList');
  let docs = [];

  function renderDocRows() {
    const cnt = q('maDocCount');
    if (cnt) cnt.textContent = docs.length ? `${docs.length} documents` : '';
    if (!docs.length) {
      docList.innerHTML = `<tr><td colspan="${isAdmin() ? 5 : 4}" class="empty">No documents yet.</td></tr>`;
      return;
    }
    docList.innerHTML = docs.map((d) => `
      <tr>
        <td><span class="item-name">${esc(d.name)}</span><div class="doc-desc">${esc(d.description || '')}</div></td>
        <td style="min-width:200px"><input class="doc-no" id="docNo_${d.id}" value="${esc(d.docNo || '')}" placeholder="Enter number"><button class="btn sm" data-act="savedoc" data-id="${d.id}" style="margin-left:6px">Save</button></td>
        <td>
          <div class="doc-row-actions">
            <label class="btn sm" style="margin:0">${d.document ? 'Replace' : 'Upload PDF'}
              <input type="file" accept="application/pdf,.pdf" data-act="upload" data-id="${d.id}" style="display:none">
            </label>
            ${d.document ? `<a class="file-link" href="${storageFileUrl(d.document)}" target="_blank" title="${esc(d.documentName || '')}">View PDF</a>` : ''}
          </div>
        </td>
        ${isAdmin() ? `<td><button class="btn red sm" data-act="deldoc" data-id="${d.id}">Delete</button></td>` : ''}
      </tr>`).join('');
  }

  function loadDocs() {
    return fetchDocuments().then((rows) => { docs = rows; renderDocRows(); });
  }

  const maAddDoc = q('maAddDoc');
  if (maAddDoc) maAddDoc.addEventListener('click', () => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(440px,94vw)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">Add Document</h3>
          <button class="btn sm" id="adClose">Close</button>
        </div>
        <div style="margin-top:14px;display:grid;gap:10px">
          <input id="adName" placeholder="Document name (e.g. SCI55)" maxlength="100" autocomplete="off">
          <input id="adDesc" placeholder="Description (optional)" maxlength="255" autocomplete="off">
          <button class="btn primary" id="adSave">＋ Create Document</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('#adClose').addEventListener('click', close);
    overlay.querySelector('#adSave').addEventListener('click', () => {
      const name = overlay.querySelector('#adName').value.trim();
      if (!name) return toast('Document name is required', true);
      const btn = overlay.querySelector('#adSave');
      btn.disabled = true;
      createDocumentRecord({ name, description: overlay.querySelector('#adDesc').value })
        .then(() => { toast('Document added'); close(); loadDocs(); })
        .catch((err) => { btn.disabled = false; toast(err.message, true); });
    });
    setTimeout(() => { const el = overlay.querySelector('#adName'); if (el) el.focus(); }, 60);
  });

  docList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act="savedoc"], [data-act="deldoc"]');
    if (!btn) return;
    const id = btn.dataset.id;
    const d = docs.find((x) => String(x.id) === id);
    if (!d) return;
    if (btn.dataset.act === 'savedoc') {
      const val = document.getElementById('docNo_' + id).value.trim();
      updateDocumentRecord(id, { docNo: val })
        .then(() => { toast('Document number saved'); d.docNo = val; })
        .catch((err) => toast(err.message, true));
    } else if (btn.dataset.act === 'deldoc') {
      if (!confirm('Delete document "' + d.name + '"?')) return;
      deleteDocumentRecord(id)
        .then(() => { toast('Document deleted'); loadDocs(); })
        .catch((err) => toast(err.message, true));
    }
  });

  docList.addEventListener('change', (e) => {
    const input = e.target;
    if (!input.matches('[data-act="upload"]')) return;
    const file = input.files[0];
    if (!file) return;
    if (file.size > 200 * 1024 || !/\.pdf$/i.test(file.name)) return toast('Choose a PDF no larger than 200 KB', true);
    const id = input.dataset.id;
    const path = 'docs/' + Date.now() + '_' + file.name;
    sb.storage.from('uploads').upload(path, file, { contentType: 'application/pdf', cacheControl: '3600', upsert: false })
      .then(async ({ error: upErr }) => {
        if (upErr) throw new Error('PDF upload failed: ' + upErr.message);
        const old = (docs.find((x) => String(x.id) === id) || {}).document;
        await updateDocumentRecord(id, { document: path, documentName: file.name });
        if (old) { try { await sb.storage.from('uploads').remove([old]); } catch (e) {} }
        toast('PDF uploaded');
        loadDocs();
      })
      .catch((err) => toast(err.message, true));
  });

  loadDocs().catch((err) => toast(err.message, true));
}

/* =========================================================================
   SCI forms page
   ========================================================================= */
function renderSCIFormsPage(user, focus) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  const state = { forms: [], destinations: [], stock: null };
  let selectedCode = SCI_FORM_META.some((m) => m.code === focus) ? focus : SCI_FORM_META[0].code;

  function badge(status) {
    if (status === 'approved') return '<span class="badge green">Approved</span>';
    if (status === 'rejected') return '<span class="badge red">Rejected</span>';
    return '<span class="badge amber">Pending</span>';
  }

  function documentLink(form) {
    return form.document
      ? `<a class="file-link" href="${storageFileUrl(form.document)}" target="_blank">${esc(form.documentName || 'View PDF')}</a>`
      : '—';
  }

  function tableTitle(code) {
    return {
      SCI34: 'Items disposed of / sold',
      SCI43: 'Items to be transferred',
      SCI53: 'Requirement of Items / Material',
      SCI15: 'Offer of Items / Material in Donation',
      SCI76: 'Items issued — Book Debit Adjustment',
      SCI45: 'Articles examined for Condemnation'
    }[code] || 'Items / Material';
  }

  function initItemsGrid(containerId, cols, hasRegister, registerItems, itemOptions) {
    const items = document.getElementById(containerId);
    const addBtn = document.getElementById(containerId === 'sciItemsRepl' ? 'sciAddItemRepl' : 'sciAddItem');
    if (!items || !addBtn) return;
    const updateCalc = (row) => {
      const qty = row.querySelector('.sci-num[data-col="qty"]');
      const rate = row.querySelector('.sci-num[data-col="rate"]');
      const tot = row.querySelector('.sci-calc');
      if (!qty || !rate || !tot) return;
      const v = (Number(qty.value) || 0) * (Number(rate.value) || 0);
      tot.value = v ? Number(v.toFixed(2)) : '';
    };
    const syncUnit = (row) => {
      if (!hasRegister) return;
      const sel = row.querySelector('.sci-item-name');
      const unit = row.querySelector('.sci-unit');
      const reg = registerItems.find((r) => r.item === sel.value);
      unit.textContent = reg && reg.unit ? reg.unit : '';
    };
    const addRow = () => {
      const wrap = document.createElement('div');
      wrap.innerHTML = itemRowHtml(cols, hasRegister, itemOptions);
      const row = wrap.firstElementChild;
      items.appendChild(row);
      syncUnit(row);
    };
    addRow();
    items.addEventListener('click', (e) => {
      const del = e.target.closest('.btn-del');
      const rows = items.querySelectorAll('.sci-item-row');
      if (del && rows.length > 1) del.closest('.sci-item-row').remove();
    });
    items.addEventListener('input', (e) => {
      const row = e.target.closest('.sci-item-row');
      if (!row) return;
      if (hasRegister && e.target.classList.contains('sci-item-name')) syncUnit(row);
      if (e.target.matches('.sci-num[data-col="qty"], .sci-num[data-col="rate"]')) updateCalc(row);
    });
    addBtn.addEventListener('click', addRow);
  }

  function collectGrid(containerId, cols) {
    const rows = Array.from(document.getElementById(containerId).querySelectorAll('.sci-item-row'));
    return rows.map((row) => {
      const out = {};
      cols.forEach((c) => {
        if (c.type === 'name') { const el = row.querySelector('.sci-item-name'); out.name = (el.value || el.textContent || '').trim(); return; }
        if (c.type === 'unit') { const el = row.querySelector('.sci-unit'); out.unit = (el.value || el.textContent || '').trim(); return; }
        if (c.type === 'calc') { const el = row.querySelector('.sci-calc'); out.totalCost = Number(el.value) || null; return; }
        const el = row.querySelector('[data-col="' + c.key + '"]');
        if (!el) return;
        const v = (el.value || '').trim();
        out[c.key] = c.type === 'number' ? (v === '' ? null : Number(v)) : v;
      });
      return out;
    }).filter((r) => (r.name || '').trim() && (r.qty == null || Number(r.qty) > 0));
  }

  async function load() {
    [state.forms, state.destinations, state.stock] = await Promise.all([fetchSCIForms(), fetchDestinations(), fetchStock()]);
    render();
  }

  function render() {
    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>SCI Forms</h2>
          <p>Submit and manage SCI form submissions with document attachments.</p>
        </div>
        <span class="badge ${isAdmin() ? 'green' : 'navy'}" style="font-size:13px;padding:6px 14px">${esc(isAdmin() ? 'ADMIN REVIEW' : 'FORM SUBMISSION')}</span>
      </div>
      <div class="sci-editor" id="sciEditor"></div>
      <div class="card" id="sciRecentCard" style="padding:0">
        <div class="reg-toolbar" style="margin:0;border:none;border-bottom:1px solid var(--line);box-shadow:none;border-radius:0">
          <div class="rt-row">
            <div><h3 style="margin:0 0 2px">Recent Submissions</h3><span class="hint">Your submitted SCI forms${isAdmin() ? ' and forms awaiting review' : ''}.</span></div>
            <div class="rt-right">
              <span class="rt-count" id="sciRecentCount"></span>
              <button class="btn sm" id="sci_export_recent" type="button">Export Excel</button>
              <a class="btn sm" href="#/log">Open Forms Log</a>
            </div>
          </div>
        </div>
        <div class="table-wrap" style="box-shadow:none;border:none" id="sciMyTable"></div>
      </div>
    `;
    document.getElementById('sci_export_recent').addEventListener('click', async (event) => {
      event.target.disabled = true;
      try { await downloadSCIForms(); toast('SCI forms exported to Excel'); }
      catch (err) { toast(err.message, true); }
      event.target.disabled = false;
    });
    renderEditor();
    renderSubmissions();
  }

  function renderEditor() {
    const form = SCI_FORM_META.find((item) => item.code === selectedCode) || SCI_FORM_META[0];
    const me = getUser();
    const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    const userCentreId = typeof me.id === 'number' ? me.id : null;
    const centreStock = userCentreId && state.stock ? (state.stock.stock[userCentreId] || null) : null;
    const registerItems = centreStock ? Object.keys(centreStock).sort((a, b) => a.localeCompare(b)).map((item) => ({ item, qty: Number(centreStock[item]) || 0, unit: (state.stock.unit[userCentreId] || {})[item] || '' })) : [];
    const hasRegister = registerItems.length > 0;
    const itemOptions = registerItems.map((r) => `<option value="${esc(r.item)}">${esc(r.item)} (in register: ${r.qty}${r.unit ? ' ' + esc(r.unit) : ''})</option>`).join('');
    const cols = form.code === 'SCI45' ? ITEM_COLS.SCI45c : (ITEM_COLS[form.code] || ITEM_COLS.SCI43);
    const destOptions = state.destinations.map((centre) => `<option value="${esc(centre.id)}">${esc(centre.name)} (${esc(centre.type)})</option>`).join('');
    const oreq = { me, today, centres: state.destinations };

    document.getElementById('sciEditor').innerHTML = `
      <div class="sci-meta-bar reg-toolbar" style="margin-bottom:14px">
        <div class="sci-meta"><span>Date: <b>${today}</b></span><span>Satsang Place / Centre: <b>${esc(me.centreName || '—')}</b></span><span>Form No.: <b>${form.code}</b></span></div>
        <span class="rt-right"><span class="badge navy">Fill exactly like the paper ${form.code}, then upload the signed hardcopy</span></span>
      </div>
      <div class="card" style="padding:0">
        <div class="sci-section-head">
          <div>
            <h3>${form.code} — ${esc(form.title)}</h3>
            <p>${esc(form.hint)}</p>
          </div>
        </div>
        <form id="sciSubmitForm" class="sci-form-body">
          ${officialSections(form.code, oreq)}
          <div class="sci-section">
            <div class="sci-sec-title">Sewadar Details</div>
            <div class="sci-grid">
              <div class="field"><label>1. Sewadar Name (in block letters)</label><input id="sci_sewadar" type="text" maxlength="200" required placeholder="Full name"></div>
              <div class="field"><label>2. Sewadar Badge No.</label><input id="sci_badge" type="text" maxlength="12" minlength="12" pattern="[A-Za-z0-9]{12}" required placeholder="e.g. AB12CD34EF56" autocomplete="off"></div>
              <div class="field"><label>Approval No.</label><input id="sci_approval" type="text" maxlength="40" placeholder="Approval number for this form" title="Approval number printed on the approved form"></div>
              ${form.code === 'SCI43' ? `<div class="field"><label>3. Destination Centre</label><select id="sci_destination" required><option value="">— select destination centre —</option>${destOptions}</select></div>` : ''}
            </div>
          </div>
          <div class="sci-section">
            <div class="sci-sec-title">${tableTitle(form.code)} ${hasRegister ? "(from this centre's stock register)" : ''}</div>
            <datalist id="sciManualItems">${state.stock && state.stock.items ? state.stock.items.map((i) => `<option value="${esc(i)}"></option>`).join('') : ''}</datalist>
            ${tableHead(cols)}
            <div class="sci-items" id="sciItems"></div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px">
              <button type="button" class="btn sm" id="sciAddItem">＋ Add another row</button>
              <span class="hint">${hasRegister ? 'Pick the items from the stock register above and enter the quantity.' : 'Enter the item / material, quantity and other details as on the paper form.'}</span>
            </div>
            <div class="field full" style="margin-top:16px"><label>Description / serial numbers</label><textarea id="sci_details" placeholder="Serial numbers, condition, or notes if the items above are not enough"></textarea></div>
          </div>
          ${form.code === 'SCI45' ? `
          <div class="sci-section">
            <div class="sci-sec-title">Replacement Items Against Condemnation</div>
            ${tableHead(ITEM_COLS.SCI45r)}
            <div class="sci-items" id="sciItemsRepl"></div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px">
              <button type="button" class="btn sm" id="sciAddItemRepl">＋ Add replacement item</button>
              <span class="hint">Leave empty when no replacement is required.</span>
            </div>
          </div>` : ''}
          <div class="sci-section">
            <div class="sci-sec-title">Remarks</div>
            <textarea id="sci_remarks" placeholder="Additional information"></textarea>
          </div>
          <div class="sci-section">
            <div class="sci-sec-title">Upload the filled hardcopy (${form.code} PDF)</div>
            <input id="sci_document" type="file" accept="application/pdf,.pdf" required>
            <span class="hint">SCAN the hardcopy you filled in the paper format and upload it here — PDF only, maximum 200 KB.</span>
          </div>
          <div class="sci-submit-bar">
            <button type="submit" class="btn primary">Submit ${form.code}</button>
            <span class="hint">The submission will be marked Pending for administrator review.</span>
            <div class="sci-paper-sign">
              <span>Prepared by: <span class="sig"></span></span>
              <span>Verified by: <span class="sig"></span></span>
              <span>Approved by / Administrator: <span class="sig"></span></span>
            </div>
          </div>
        </form>
      </div>
    `;
    document.querySelectorAll('#sciSubmitForm [data-official]').forEach((el) => {
      if (el.dataset.official === 'date' && !el.value) el.value = today;
      if (el.dataset.official === 'placeName' && !el.value && me.centreName) el.value = me.centreName;
    });
    const badgeInput = document.getElementById('sci_badge');
    badgeInput.addEventListener('input', () => { badgeInput.value = badgeInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 12); });

    initItemsGrid('sciItems', cols, hasRegister, registerItems, itemOptions);
    if (form.code === 'SCI45') initItemsGrid('sciItemsRepl', ITEM_COLS.SCI45r, hasRegister, registerItems, itemOptions);

    const destSel = document.getElementById('sci_destination');
    if (destSel) destSel.addEventListener('change', () => {
      const name = (state.destinations.find((c) => Number(c.id) === Number(destSel.value)) || {}).name || '';
      ['reqPlace', 'reqPlace2', 'toPlace'].forEach((k) => {
        const el = document.querySelector('[data-official="' + k + '"]');
        if (el && !el.value && name) el.value = name;
      });
    });
    document.getElementById('sciSubmitForm').addEventListener('submit', submitForm);
  }

  async function submitForm(event) {
    event.preventDefault();
    const file = document.getElementById('sci_document').files[0];
    const badgeInput = document.getElementById('sci_badge').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{12}$/.test(badgeInput)) return toast('Badge number must contain exactly 12 letters and numbers', true);
    if (!file || file.size > 200 * 1024 || !/\.pdf$/i.test(file.name)) return toast('Choose a PDF no larger than 200 KB', true);
    const button = event.target.querySelector('button[type="submit"]');
    button.disabled = true;
    const formMeta = SCI_FORM_META.find((m) => m.code === selectedCode) || SCI_FORM_META[0];
    const me = getUser();
    const centreId = typeof me.id === 'number' ? me.id : null;
    const centreName = me.centreName || '';
    const destEl = document.getElementById('sci_destination');
    const destId = destEl && destEl.value ? Number(destEl.value) : null;
    const destName = destId ? (state.destinations.find((c) => Number(c.id) === destId) || {}).name || '' : '';
    const cols = selectedCode === 'SCI45' ? ITEM_COLS.SCI45c : (ITEM_COLS[selectedCode] || ITEM_COLS.SCI43);
    const official = {};
    document.querySelectorAll('#sciSubmitForm [data-official]').forEach((el) => {
      const k = el.dataset.official;
      if (el.type === 'radio') { if (el.checked) official[k] = el.value; return; }
      if (/amount|Rcpt/.test(k)) official[k] = (el.value || '') === '' ? null : Number(el.value);
      else official[k] = el.value.trim();
    });
    const items = collectGrid('sciItems', cols);
    if (!items.length) { button.disabled = false; return toast('Enter at least one item and its quantity', true); }
    const quantity = items.reduce((a, r) => a + (Number(r.qty) || 0), 0);
    const replacement = selectedCode === 'SCI45' ? collectGrid('sciItemsRepl', ITEM_COLS.SCI45r) : [];
    const details = {
      items,
      replacement,
      description: document.getElementById('sci_details').value.trim(),
      approvalNo: (document.getElementById('sci_approval').value || '').trim(),
      form: official
    };
    const amount = official.amount == null ? (official.amountCc == null ? null : Number(official.amountCc)) : Number(official.amount);
    const storagePath = Date.now() + '_' + file.name;
    try {
      const { error: upErr } = await sb.storage.from('uploads').upload(storagePath, file, { contentType: 'application/pdf', cacheControl: '3600', upsert: false });
      if (upErr) throw new Error('PDF upload failed: ' + upErr.message);
      const { error: insErr } = await sb.from('sci_forms').insert({
        formType: selectedCode,
        formTitle: formMeta.title,
        centreId,
        centreName,
        sewadarName: document.getElementById('sci_sewadar').value.trim(),
        sewadarBadge: badgeInput,
        details: details,
        remarks: document.getElementById('sci_remarks').value.trim(),
        quantity: quantity,
        amount: amount,
        destinationCentreId: destId,
        destinationCentreName: destName,
        document: storagePath,
        documentName: file.name,
        status: 'pending'
      });
      if (insErr) throw new Error('Submission failed: ' + insErr.message);
      toast(selectedCode + ' submitted for review');
      await load();
    } catch (err) { button.disabled = false; toast(err.message, true); }
  }

  function renderSubmissions() {
    const table = document.getElementById('sciMyTable');
    const count = document.getElementById('sciRecentCount');
    if (count) count.textContent = state.forms.length ? state.forms.length + ' submission' + (state.forms.length === 1 ? '' : 's') : '';
    table.innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Form</th><th>Centre</th><th>Sewadar</th><th>Badge</th><th>Approval No.</th><th>PDF</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${state.forms.length ? state.forms.slice(0, 20).map((form) => `<tr title="Click to open the full form" data-form-id="${esc(form.id)}">
          <td>${esc((form.submittedAt || '').slice(0, 10))}</td>
          <td><b>${esc(form.formType)}</b><br><small>${esc(form.formTitle)}</small></td>
          <td>${esc(form.centreName)}</td>
          <td>${esc(form.sewadarName)}</td>
          <td class="mono">${esc(form.sewadarBadge)}</td>
          <td>${esc((form.details && form.details.approvalNo) || '—')}</td>
          <td>${documentLink(form)}</td>
          <td>${badge(form.status)}</td>
          <td>${isAdmin() && form.status === 'pending' ? `<button class="btn green sm" data-form-action="approve" data-id="${esc(form.id)}">Approve</button> <button class="btn red sm" data-form-action="reject" data-id="${esc(form.id)}">Reject</button>` : '—'}</td>
        </tr>`).join('') : '<tr><td colspan="9" class="empty">No SCI forms submitted yet</td></tr>'}</tbody>
      </table>
      ${state.forms.length > 20 ? '<div style="padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px"><b>Showing the 20 most recent submissions.</b> Open the Forms Log for the full list.</div>' : ''}
    `;
    table.onclick = (e) => {
      if (e.target.closest('[data-form-action], a, button')) return;
      const tr = e.target.closest('tr[data-form-id]');
      if (!tr) return;
      const form = state.forms.find((f) => String(f.id) === String(tr.dataset.formId));
      if (form) openSCIFormDetail(form, load);
    };
    table.querySelectorAll('[data-form-action]').forEach((button) => button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await updateFormStatus(button.dataset.id, button.dataset.formAction);
        toast(button.dataset.formAction === 'approve' ? 'SCI form approved' : 'SCI form rejected');
        load();
      } catch (err) { button.disabled = false; toast(err.message, true); }
    }));
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Pass Reset page (superadmin only)
   ========================================================================= */
function renderResetPage() {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="logo-banner">
      <div>
        <h2>Pass Reset</h2>
        <p>Reset the password of a centre or ASO admin account.</p>
      </div>
      <span class="badge navy" style="font-size:13px;padding:6px 14px">SUPERADMIN</span>
    </div>
    <div class="card" style="max-width:560px">
      <div class="sci-section-head">
        <div><h3 style="margin:0">Reset user password</h3><p class="hint">Select the account, enter a new password and save.</p></div>
      </div>
      <div style="padding:18px">
        <div class="sci-grid">
          <div class="field"><label style="margin-bottom:5px">Center / ASO Admin</label><select id="rp_user"></select></div>
          <div class="field"><label style="margin-bottom:5px">New Password</label><input type="password" id="rp_pass" placeholder="At least 4 characters" autocomplete="new-password"></div>
          <div class="field"><label style="margin-bottom:5px">Confirm New Password</label><input type="password" id="rp_confirm" placeholder="Repeat new password" autocomplete="new-password"></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap">
          <button type="button" class="btn primary" id="rp_btn">Reset Password</button>
          <span class="hint" id="rp_note">Password must be at least 4 characters.</span>
        </div>
        <div class="login-err" id="rp_msg" style="margin-top:12px"></div>
      </div>
    </div>
  `;

  const loadUsers = () => sb.from('org_users').select('username, name, type').order('name', { ascending: true }).then(({ data, error }) => {
    if (error) throw new Error(error.message);
    document.getElementById('rp_user').innerHTML = data.map((c) => `<option value="${esc(c.username)}">${esc(c.name)} — ${esc(c.type)}</option>`).join('');
  });
  loadUsers().catch((err) => showResetMsg(err.message, true));

  const msg = document.getElementById('rp_msg');
  const showResetMsg = (text, isErr) => {
    msg.textContent = text;
    msg.style.display = 'block';
    msg.style.color = isErr ? '' : 'var(--green)';
    msg.style.background = isErr ? '' : 'var(--green-bg)';
  };

  document.getElementById('rp_btn').addEventListener('click', async () => {
    const user = document.getElementById('rp_user').value;
    const p1 = document.getElementById('rp_pass').value;
    const p2 = document.getElementById('rp_confirm').value;
    msg.style.display = 'none';
    if (!user) return showResetMsg('Select a center', true);
    if (!p1 || p1.length < 4) return showResetMsg('Password must be at least 4 characters', true);
    if (p1 !== p2) return showResetMsg('Passwords do not match', true);
    const btn = document.getElementById('rp_btn');
    btn.disabled = true;
    try {
      const { data: u, error: uErr } = await sb.from('org_users').select('authId, name').eq('username', user).single();
      if (uErr || !u) throw new Error('User not found');
      if (SUPABASE_SECRET_KEY) {
        const { error: resetErr } = await sbAdmin.auth.admin.updateUserById(u.authId, { password: p1 });
        if (resetErr) throw new Error(resetErr.message || 'Reset failed');
      } else {
        const { error: rpcErr } = await sb.rpc('admin_reset_password', { target_username: user, new_password: p1 });
        if (rpcErr) {
          if (/function.*not exist|Could not find|rpc/i.test(String(rpcErr.message || ''))) throw new Error('Password reset is not available on this build yet. Contact the developer to apply the database function.');
          throw new Error(rpcErr.message || 'Reset failed');
        }
      }
      showResetMsg('Password reset for ' + u.name, false);
      document.getElementById('rp_pass').value = '';
      document.getElementById('rp_confirm').value = '';
      toast('Password reset');
    } catch (err) {
      showResetMsg(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
}
</script>
