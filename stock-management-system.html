   Dashboard page
   ========================================================================= */
function renderDashboardPage(user, routeParams) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  let selectedId = routeParams.get('c') || null;

  function typeBadge(t) {
    if (t === 'CENTRE') return '<span class="badge navy">CENTRE</span>';
    if (t === 'SUB CENTRE') return '<span class="badge azure">SUB CENTRE</span>';
    if (t === 'POINT') return '<span class="badge sky">POINT</span>';
    return '<span class="badge green">ASO ADMIN</span>';
  }

  function groupByParent(centers) {
    const byParent = {};
    centers.forEach((c) => {
      const key = c.parentId || '';
      (byParent[key] = byParent[key] || []).push(c);
    });
    Object.keys(byParent).forEach((k) => {
      byParent[k].sort((a, b) => {
        const prio = (t) => (t === 'SUB CENTRE' ? 0 : t === 'POINT' ? 1 : 2);
        return (prio(a.type) - prio(b.type)) || a.name.localeCompare(b.name);
      });
    });
    return byParent;
  }

  function walkNode(c, depth, byParent) {
    const children = byParent[c.id] || [];
    const indented = depth ? ` style="margin-left:${Math.min(depth, 6) * 14}px"` : '';
    const cardCls = 'card card-link card-compact ' + (c.type === 'CENTRE' ? 't-centre' : c.type === 'SUB CENTRE' ? 't-sub' : c.type === 'POINT' ? 't-point' : 't-admin');
    return `
      <div class="${cardCls}"${indented} data-id="${c.id}" data-name="${esc(c.name)}" title="Click to open stock of ${esc(c.name)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <div class="center-name">${esc(c.name)}</div>
          ${typeBadge(c.type)}
        </div>
        ${children.length ? `<div style="margin-top:6px"><span class="mini-meta">${children.length} children</span></div>` : ''}
        ${children.map((ch) => walkNode(ch, depth + 1, byParent)).join('')}
      </div>`;
  }

  function renderTree(centers, startId) {
    const byParent = groupByParent(centers);
    if (startId) {
      const me = centers.find((c) => c.id === startId);
      return me ? walkNode(me, 0, byParent) : '';
    }
    const roots = (byParent[''] || []).filter((c) => c.type === 'CENTRE');
    const singles = roots.filter((r) => (byParent[r.id] || []).length === 0);
    const fathers = roots.filter((r) => (byParent[r.id] || []).length > 0);
    return {
      singles: singles.map((r) => walkNode(r, 0, byParent)).join(''),
      fathers: fathers.map((r) => walkNode(r, 0, byParent)).join('')
    };
  }

  function bindClicks() {
    content.addEventListener('click', (e) => {
      const card = e.target.closest('.card-link');
      if (card && card.dataset.id) {
        location.hash = '/stock?c=' + encodeURIComponent(card.dataset.id);
      }
    });
  }

  const searchBox = createCenterSearch({
    placeholder: 'Search center name…',
    onSelect: (c) => { selectedId = c ? c.id : null; load(); }
  });

  function bindSearch(centers) {
    searchBox.setItems(centers);
    const box = content.querySelector('#csBox');
    box.innerHTML = '';
    box.appendChild(searchBox.el);
    const sel = selectedId ? centers.find((x) => x.id === selectedId) : null;
    searchBox.setValue(sel ? sel.name : '');
  }

  function highlightSel() {
    if (!selectedId) return;
    const card = content.querySelector('.card[data-id="' + selectedId.replace(/["\\]/g, '\\$&') + '"]');
    if (card) {
      card.classList.add('card-found');
      card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  async function load() {
    const [centers, forms] = await Promise.all([fetchCenters(), fetchSCIForms()]);
    const pending = forms.filter((f) => f.status === 'pending').length;
    const approved = forms.filter((f) => f.status === 'approved').length;

    if (isAdmin() || isViewer()) {
      const tree = renderTree(centers);
      const selected = selectedId ? centers.find((c) => c.id === selectedId) : null;
      content.innerHTML = `
        <div class="logo-banner">
          <div>
            <h2>${isAdmin() ? 'Main ASO Admin Dashboard' : 'ASO Viewer Dashboard'}</h2>
            <p></p>
          </div>
          <div class="stat" style="background:rgba(255,255,255,.12);color:#fff;min-width:180px">
            <b>${centers.length}</b>
            <span style="color:rgba(255,255,255,.8)">Centres + ASO Admin</span>
          </div>
        </div>
        <div class="grid cols-3" style="margin-bottom:22px">
          <a href="#/log" class="stat-link"><div class="card"><h3>Total SCI Forms → Log</h3><div class="big-num">${forms.length}</div><small style="color:var(--muted)">Click to open the Forms Log</small></div></a>
          <div class="card"><h3>Pending Forms</h3><div class="big-num" style="color:var(--amber)">${pending}</div></div>
          <div class="card"><h3>Approved Forms</h3><div class="big-num" style="color:var(--green)">${approved}</div></div>
        </div>
        <div class="center-search"><div id="csBox"></div></div>
        ${selected
          ? `<div class="grid cols-4">${walkNode(selected, 0, groupByParent(centers))}</div>`
          : `<h3 style="margin:4px 0 12px">Single Centres (no sub centre / point)</h3>
        <div id="tree-singles" class="grid cols-4">${tree.singles}</div>
        <h3 style="margin:26px 0 12px">Centres with Sub Centres &amp; Points</h3>
        <div id="tree-fathers" class="grid cols-4">${tree.fathers}</div>`}
      `;
      bindClicks();
      bindSearch(centers);
      highlightSel();
    } else {
      const me = centers.find((c) => c.id === user.id);
      const myForms = forms.filter((f) => f.centreId === user.id);
      const myPending = myForms.filter((f) => f.status === 'pending').length;
      const myApproved = myForms.filter((f) => f.status === 'approved').length;
      const myTree = (() => {
        const byP = {};
        centers.forEach((c) => { (byP[c.parentId || ''] = byP[c.parentId || ''] || []).push(c); });
        const out = [];
        const w = (n) => { out.push(n); (byP[n.id] || []).forEach(w); };
        if (me) w(me);
        return out;
      })();
      const selected = selectedId ? centers.find((c) => c.id === selectedId) : null;
      content.innerHTML = `
        <div class="logo-banner">
          <div>
            <h2>${esc(user.name)}</h2>
          </div>
        </div>
        <div class="grid cols-3" style="margin-bottom:22px">
          <a href="#/log" class="stat-link"><div class="card"><h3>My SCI Forms → Log</h3><div class="big-num">${myForms.length}</div><small style="color:var(--muted)">Click to open the Forms Log</small></div></a>
          <div class="card"><h3>Pending Forms</h3><div class="big-num" style="color:var(--primary)">${myPending}</div></div>
          <div class="card"><h3>Approved Forms</h3><div class="big-num" style="color:var(--green)">${myApproved}</div></div>
        </div>
        <div class="center-search"><div id="csBox"></div></div>
        ${selected
          ? `<div class="grid cols-4">${walkNode(selected, 0, groupByParent(centers))}</div>`
          : `<h3 style="margin-bottom:14px">My Area — ${esc(user.name)} + allocated sub centres &amp; points</h3>
        <div id="tree" class="grid cols-4">${renderTree(centers, user.id)}</div>`}
      `;
      bindClicks();
      bindSearch((isAdmin() || isViewer()) ? centers : myTree);
      highlightSel();
    }
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Log page
   ========================================================================= */
function renderSCIFormsLogPage(user) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  let centers = [];
  let currentForms = [];

  function badge(status) {
    if (status === 'approved') return '<span class="badge green">Approved</span>';
    if (status === 'rejected') return '<span class="badge red">Rejected</span>';
    return '<span class="badge amber">Pending</span>';
  }

  function documentLink(form) {
    return form.document
      ? `<a class="file-link" href="${storageFileUrl(form.document)}" target="_blank">${esc(form.documentName || 'View PDF')}</a>`
      : '—';
  }

  async function load() {
    [centers] = await Promise.all([fetchCenters(), fetchSCIForms()]);
    render();
  }

  function render() {
    const today = new Date().toISOString().slice(0, 10);
    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>SCI Forms Log</h2>
          <p>Search, filter, and review all submitted SCI forms across centres.</p>
        </div>
        <div class="stat" style="background:rgba(255,255,255,.12);color:#fff;min-width:150px">
          <b id="formLogCount">0</b>
          <span style="color:rgba(255,255,255,.8)">Forms shown</span>
        </div>
      </div>

      <div class="card" style="margin-bottom:18px">
        <div class="search-bar">
          <div class="field wide">
            <label>SCI Form</label>
            <select id="sci_log_type"><option value="">All forms</option>${SCI_FORM_META.map((f) => `<option value="${f.code}">${f.code}</option>`).join('')}</select>
          </div>
          <div class="field wide">
            <label>Search</label>
            <input type="text" id="sci_log_q" placeholder="sewadar / badge / centre">
          </div>
          <div class="field">
            <label>Status</label>
            <select id="sci_log_status"><option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
          </div>
          <div class="field">
            <label>Centre</label>
            <select id="sci_log_center"><option value="">All</option>${centers.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          </div>
          <button class="btn primary" id="sci_log_go">Search Forms</button>
          <button class="btn" id="sci_log_export">Export Excel</button>
          <button class="btn" id="sci_log_reset">Reset</button>
        </div>
      </div>
      <div class="table-wrap" id="sciLogTable"></div>
    `;
    document.getElementById('sci_log_go').addEventListener('click', applyFilter);
    document.getElementById('sci_log_export').addEventListener('click', exportCurrent);
    document.getElementById('sci_log_reset').addEventListener('click', resetFilter);
    applyFilter();
  }

  function currentParams() {
    const params = new URLSearchParams();
    const type = document.getElementById('sci_log_type').value;
    const q = document.getElementById('sci_log_q').value.trim();
    const status = document.getElementById('sci_log_status').value;
    const center = document.getElementById('sci_log_center').value;
    if (type) params.set('formType', type);
    if (q) params.set('q', q);
    if (status) params.set('status', status);
    if (center) params.set('centreId', center);
    return params;
  }

  async function exportCurrent() {
    const button = document.getElementById('sci_log_export');
    button.disabled = true;
    try {
      await downloadSCIForms(currentParams().toString());
      toast('SCI forms exported to Excel');
    } catch (err) { toast(err.message, true); }
    button.disabled = false;
  }

  async function applyFilter() {
    const params = currentParams();
    let forms;
    try { forms = await fetchSCIForms(params.toString()); }
    catch (err) { toast(err.message, true); return; }
    currentForms = forms;
    document.getElementById('formLogCount').textContent = forms.length;
    const table = document.getElementById('sciLogTable');
    table.innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Form</th><th>Centre</th><th>Sewadar</th><th>Badge No.</th><th>Details</th><th>Destination</th><th>Amount</th><th>PDF</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${forms.length ? forms.map((f) => {
          const detail = f.details ? Object.values(f.details).filter((v) => v !== null && v !== '').join(' · ') : '';
          return `<tr title="Click to open the full form" data-form-id="${esc(f.id)}">
            <td>${esc((f.submittedAt || '').slice(0, 10))}</td>
            <td><b>${esc(f.formType)}</b><br><small>${esc(f.formTitle)}</small></td>
            <td>${esc(f.centreName)}</td>
            <td>${esc(f.sewadarName)}</td>
            <td class="mono">${esc(f.sewadarBadge)}</td>
            <td class="sci-detail">${esc(detail || '—')}</td>
            <td>${esc(f.destinationCentreName || '—')}</td>
            <td>${esc(f.amount || '—')}</td>
            <td>${documentLink(f)}</td>
            <td>${badge(f.status)}</td>
            <td>${isAdmin() && f.status === 'pending' ? `<button class="btn green sm" data-form-action="approve" data-id="${esc(f.id)}">Approve</button> <button class="btn red sm" data-form-action="reject" data-id="${esc(f.id)}">Reject</button>` : '—'}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="11" class="empty">No SCI forms found</td></tr>'}</tbody>
      </table>
      <div style="padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px"><b>${forms.length}</b> forms shown</div>
    `;
    table.onclick = (e) => {
      if (e.target.closest('[data-form-action], a, button')) return;
      const tr = e.target.closest('tr[data-form-id]');
      if (!tr) return;
      const form = currentForms.find((f) => String(f.id) === String(tr.dataset.formId));
      if (form) openSCIFormDetail(form, applyFilter);
    };
    table.querySelectorAll('[data-form-action]').forEach((button) => button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await updateFormStatus(button.dataset.id, button.dataset.formAction);
        toast(button.dataset.formAction === 'approve' ? 'SCI form approved' : 'SCI form rejected');
        applyFilter();
      } catch (err) { button.disabled = false; toast(err.message, true); }
    }));
  }

  function resetFilter() {
    document.getElementById('sci_log_type').value = '';
    document.getElementById('sci_log_q').value = '';
    document.getElementById('sci_log_status').value = '';
    document.getElementById('sci_log_center').value = '';
    applyFilter();
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Stock register page
   ========================================================================= */
function renderStockPage(user, routeParams) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  const state = { centers: [], items: [], stock: {} };
  let anchorId = null;
  let selectedCenter = null;
  const SCROLL_KEY = 'stock-register-scroll';
  const paramC = routeParams.get('c');
  const fullScope = isAdmin() || isViewer();

  function scopeCenters() {
    if (fullScope) return state.centers;
    const me = state.centers.find((c) => String(c.id) === String(user.id));
    if (!me) return [];
    const byParent = {};
    state.centers.forEach((c) => { (byParent[c.parentId || ''] = byParent[c.parentId || ''] || []).push(c); });
    const out = [];
    const walk = (node) => { out.push(node); (byParent[node.id] || []).forEach(walk); };
    walk(me);
    return out;
  }

  function typeBadge(t) {
    if (t === 'CENTRE') return '<span class="badge navy">CENTRE</span>';
    if (t === 'SUB CENTRE') return '<span class="badge azure">SUB CENTRE</span>';
    if (t === 'POINT') return '<span class="badge sky">POINT</span>';
    return '<span class="badge green">ASO ADMIN</span>';
  }

  function conditionOf(stock, items) {
    const cells = items.map((it) => Number(stock[it] || 0));
    const total = cells.reduce((a, b) => a + b, 0);
    const filled = cells.filter((v) => v > 0).length;
    let label = 'No Stock', cls = 'red';
    if (total > 0) {
      const ratio = filled / items.length;
      if (ratio >= 0.9 && total > 150) { label = 'Good'; cls = 'green'; }
      else if (ratio >= 0.5) { label = 'Moderate'; cls = 'amber'; }
      else { label = 'Low'; cls = 'red'; }
    }
    return { label, cls, total };
  }

  async function load() {
    const [centers, stockData] = await Promise.all([fetchCenters(), fetchStock()]);
    state.centers = centers;
    state.items = stockData.items;
    state.stock = stockData.stock;
    render();
  }

  function buildTreeRows() {
    const byParent = {};
    state.centers.forEach((c) => { (byParent[c.parentId || ''] = byParent[c.parentId || ''] || []).push(c); });
    Object.values(byParent).forEach((arr) => arr.sort((a, b) => a.name.localeCompare(b.name)));
    const rows = [];
    const walk = (node, depth) => {
      rows.push({ c: node, depth });
      (byParent[node.id] || []).forEach((ch) => walk(ch, depth + 1));
    };
    let roots;
    if (fullScope) {
      roots = (byParent[''] || []).filter((c) => c.type === 'CENTRE' || c.type === 'ASO ADMIN' || c.id === 'superadmin');
    } else {
      const me = state.centers.find((c) => String(c.id) === String(user.id));
      roots = me ? [me] : [];
    }
    roots.forEach((r) => walk(r, 0));
    return rows;
  }

  function render() {
    const wrap = content.querySelector('.table-wrap');
    let anchor = null;
    if (anchorId && wrap) {
      const row = wrap.querySelector('tr[data-id="' + anchorId.replace(/["\\]/g, '\\$&') + '"]');
      if (row) {
        const wr = wrap.getBoundingClientRect();
        anchor = { top: row.getBoundingClientRect().top - wr.top, scrollTop: wrap.scrollTop };
      }
    }
    const rows = buildTreeRows();
    const visible = selectedCenter ? rows.filter((r) => r.c.id === selectedCenter) : rows;

    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>Stock Register</h2>
          <p>${isAdmin() ? 'Live stock of every centre — tap ＋ / － on any figure to update it, or use the buttons above to add, edit, or delete items and export the register' : 'Your centre + allocated sub centres & points — tap ＋ / － on any figure to update it, or use the buttons above to manage items and export'}</p>
        </div>
        <div class="sr-actions">
          <button class="btn primary" id="btnAddItem" title="Add a new stock item">＋ Add Item</button>
          <button class="btn" id="btnEditItem" title="Edit an item name, description or category">Edit Item</button>
          <button class="btn" id="btnDelItem" title="Delete an item and its stock from every centre">Delete Item</button>
          <button class="btn" id="btnExportStock" title="Download the stock register as an Excel-compatible file">Export Stock</button>
        </div>
      </div>
      <div class="center-search"><div id="csBox"></div></div>
      <div class="table-wrap">
        <table class="stock-table">
          <thead><tr><th class="stick-1">Center</th><th class="stick-2">Type</th>${state.items.map((it) => `<th>${esc(it)}</th>`).join('')}<th>Total</th><th>Condition</th></tr></thead>
        <tbody>${visible.map((r) => renderRow(r, state.stock[r.c.id] || {}, selectedCenter === r.c.id)).join('')}</tbody>
      </table>
      </div>
      <p style="margin-top:12px;color:var(--muted);font-size:12px">${selectedCenter ? `<b style="color:var(--green)">Showing only the selected center — ${esc(centerName(selectedCenter))}.</b> ` : ''}Use ＋ / － on any quantity to add or update stock.${paramC ? '<b style="color:var(--green)"> ▼ Highlighted row = the center you clicked on the Dashboard.</b>' : ''}</p>
    `;

    bindSearch();
    const btnAdd = document.getElementById('btnAddItem');
    const btnEdit = document.getElementById('btnEditItem');
    const btnDel = document.getElementById('btnDelItem');
    const btnExport = document.getElementById('btnExportStock');
    if (btnAdd) btnAdd.addEventListener('click', () => openItemsManager('add'));
    if (btnEdit) btnEdit.addEventListener('click', () => openItemsManager('list'));
    if (btnDel) btnDel.addEventListener('click', () => openItemsManager('list'));
    if (btnExport) btnExport.addEventListener('click', exportStock);

    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    const isReload = !!(nav && nav.type === 'reload');
    const targetRow = paramC ? content.querySelector('tr[data-id="' + paramC.replace(/["\\]/g, '\\$&') + '"]') : null;
    if (targetRow) targetRow.classList.add('row-highlight', 'row-flash');
    const point = !!(targetRow && !anchorId && !isReload);
    const wrap2 = content.querySelector('.table-wrap');
    if (point && wrap2) {
      const wr = wrap2.getBoundingClientRect();
      const rr = targetRow.getBoundingClientRect();
      const saved = sessionStorage.getItem(SCROLL_KEY);
      try { wrap2.scrollLeft = saved ? (JSON.parse(saved).left || 0) : wrap2.scrollLeft; } catch (e) {}
      wrap2.scrollTop += (rr.top - wr.top) - (wr.height / 2) + (rr.height / 2);
    } else {
      restoreScroll();
      if (anchor) {
        const row = content.querySelector('tr[data-id="' + anchorId.replace(/["\\]/g, '\\$&') + '"]');
        if (row && wrap2) {
          const wr = wrap2.getBoundingClientRect();
          wrap2.scrollTop += (row.getBoundingClientRect().top - wr.top) - anchor.top;
        }
        anchorId = null;
        saveScroll();
      }
    }
  }

  const searchBox = createCenterSearch({
    placeholder: 'Search center name…',
    onSelect: (c) => { selectedCenter = c ? c.id : null; render(); }
  });

  function bindSearch() {
    searchBox.setItems(scopeCenters());
    const box = content.querySelector('#csBox');
    box.innerHTML = '';
    box.appendChild(searchBox.el);
    const sel = selectedCenter ? scopeCenters().find((x) => x.id === selectedCenter) : null;
    searchBox.setValue(sel ? sel.name : '');
  }

  function saveScroll() {
    const wrap = content.querySelector('.table-wrap');
    if (!wrap) return;
    sessionStorage.setItem(SCROLL_KEY, JSON.stringify({ top: wrap.scrollTop, left: wrap.scrollLeft }));
  }
  function restoreScroll() {
    const wrap = content.querySelector('.table-wrap');
    if (!wrap) return;
    const saved = sessionStorage.getItem(SCROLL_KEY);
    if (!saved) return;
    try {
      const pos = JSON.parse(saved);
      wrap.scrollLeft = pos.left || 0;
      wrap.scrollTop = pos.top || 0;
    } catch (e) {}
  }
  content.addEventListener('scroll', saveScroll, true);

  function renderRow(r, stock, highlight) {
    const cells = state.items.map((it) => {
      const v = Number(stock[it] || 0);
      return `<td class="qty-cell">
        <button class="qty-btn" data-item="${esc(it)}" data-c="${r.c.id}" data-delta="-10">−</button>
        <span class="qty-val">${v}</span>
        <button class="qty-btn" data-item="${esc(it)}" data-c="${r.c.id}" data-delta="10">+</button>
      </td>`;
    }).join('');
    const cond = conditionOf(stock, state.items);
    const indent = r.depth ? ` style="padding-left:${28 + r.depth * 22}px"` : '';
    return `<tr data-id="${r.c.id}"${highlight ? ' class="row-highlight"' : ''}>
      <td${indent} class="stick-1"><b>${esc(r.c.name)}</b></td>
      <td class="stick-2">${typeBadge(r.c.type)}</td>
      ${cells}
      <td><b>${cond.total}</b></td>
      <td><span class="badge ${cond.cls}">${cond.label}</span></td>
    </tr>`;
  }

  function centerName(id) {
    const c = state.centers.find((x) => x.id === id);
    return c ? c.name : id;
  }

  function openStockModal(centerId, item, delta) {
    anchorId = centerId;
    const cur = Number(state.stock[centerId] ? state.stock[centerId][item] || 0 : 0);
    let value = Math.max(0, cur + delta);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Update Stock — ${esc(centerName(centerId))}</h3>
        <div class="m-sub">Item: <b>${esc(item)}</b> · Center: <b>${esc(centerName(centerId))}</b></div>
        <div class="m-cur"><span>Current stock</span><b id="mCur">${cur}</b></div>
        <label style="font-weight:600;font-size:13px;display:block;margin-bottom:5px">New stock quantity</label>
        <input type="number" id="mVal" class="m-input" min="0" value="${value}">
        <div class="m-step">
          <button data-d="-100">−100</button>
          <button data-d="-10">−10</button>
          <button data-d="-1">−1</button>
          <button data-d="1">+1</button>
          <button data-d="10">+10</button>
          <button data-d="100">+100</button>
        </div>
        <div class="m-actions">
          <button class="btn" id="mCancel">Cancel</button>
          <button class="btn primary" id="mSave">Save Stock</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const input = overlay.querySelector('#mVal');
    const sync = () => { const v = Math.max(0, Number(input.value) || 0); input.value = v; overlay.querySelector('#mCur').textContent = v; };
    input.addEventListener('input', () => { overlay.querySelector('#mCur').textContent = Math.max(0, Number(input.value) || 0); });
    overlay.querySelectorAll('.m-step button').forEach((b) => b.addEventListener('click', () => {
      input.value = Math.max(0, (Number(input.value) || 0) + Number(b.dataset.d));
      sync();
    }));
    const close = () => { document.body.removeChild(overlay); };
    overlay.querySelector('#mCancel').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); }, { once: true });
    overlay.querySelector('#mSave').addEventListener('click', async () => {
      const qty = Number(input.value);
      if (isNaN(qty) || qty < 0) return toast('Enter a valid quantity', true);
      overlay.querySelector('#mSave').disabled = true;
      try {
        await updateStock(centerId, { [item]: qty });
        toast('Stock updated: ' + item + ' = ' + qty);
        close();
        load();
      } catch (err) { overlay.querySelector('#mSave').disabled = false; toast(err.message, true); }
    });
    input.focus();
    input.select();
  }

  content.addEventListener('click', (e) => {
    const btn = e.target.closest('.qty-btn');
    if (btn) { openStockModal(btn.dataset.c, btn.dataset.item, Number(btn.dataset.delta)); return; }
    const row = e.target.closest('tr[data-id]');
    if (row && row.classList.contains('row-highlight')) { row.classList.remove('row-highlight'); return; }
    if (row) {
      content.querySelectorAll('tr.row-highlight').forEach((r) => r.classList.remove('row-highlight'));
      row.classList.add('row-highlight');
    }
  });

  function exportStock() {
    try {
      const csvCell = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const header = ['Center', 'Type'].concat(state.items).concat(['Total', 'Condition']);
      const rows = buildTreeRows().map((r) => {
        const stock = state.stock[r.c.id] || {};
        const cells = state.items.map((it) => Number(stock[it] || 0));
        const total = cells.reduce((a, b) => a + b, 0);
        const indent = r.depth ? '    '.repeat(Math.min(r.depth, 5)) : '';
        return [csvCell(indent + r.c.name), csvCell(r.c.type)]
          .concat(cells.map((v) => csvCell(v)))
          .concat(csvCell(total), csvCell(conditionOf(stock, state.items).label));
      });
      const csv = [header.map((h) => csvCell(h)).join(',')].concat(rows.map((r) => r.join(','))).join('\r\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'stock-register.xlsx';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Stock register exported to Excel');
    } catch (err) {
      toast('Export failed: ' + (err.message || err), true);
    }
  }

  function openItemsManager(focus) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(720px,94vw)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">Manage Stock Items</h3>
          <button class="btn sm" id="imClose">Close</button>
        </div>
        <div class="items-add" style="margin-top:14px">
          <input id="im_name" placeholder="Item name" maxlength="200">
          <input id="im_desc" placeholder="Description (optional)">
          <input id="im_cat" placeholder="Category (optional)">
          <button class="btn primary sm" id="im_add">Add Item</button>
        </div>
        <p class="hint" style="margin:8px 0 4px">Renaming an item updates it in every centre's stock register; deleting removes its stock rows from all centres.</p>
        <div id="imList" style="margin-top:10px;max-height:52vh;overflow:auto"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    if (focus === 'add') setTimeout(() => { try { overlay.querySelector('#im_name').focus(); } catch (e) {} }, 80);

    let rows = [];
    const listEl = overlay.querySelector('#imList');
    const n = (id) => overlay.querySelector('#' + id);
    const close = () => { document.body.removeChild(overlay); document.removeEventListener('keydown', escClose, true); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escClose, true);
    n('imClose').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

    function render() {
      if (!rows.length) {
        listEl.innerHTML = '<div class="card hint" style="padding:16px;text-align:center">No items yet — add the first one above.</div>';
        return;
      }
      listEl.innerHTML = rows.map((r, i) => r.editing ? `
        <div class="item-row">
          <div class="item-edit">
            <input id="row_name_${r.id}" value="${esc(r.name)}" maxlength="200" placeholder="Item name">
            <input id="row_desc_${r.id}" value="${esc(r.description || '')}" placeholder="Description (optional)">
            <input id="row_cat_${r.id}" value="${esc(r.category || '')}" placeholder="Category (optional)">
          </div>
          <div class="item-actions">
            <button class="btn primary sm" data-act="save" data-id="${r.id}">Save</button>
            <button class="btn sm" data-act="cancel">Cancel</button>
          </div>
        </div>` : `
        <div class="item-row">
          <div style="flex:1">
            <b>${esc(r.name)}</b>
            <div class="meta">${esc(r.description || '')}${(r.category ? ' · ' + esc(r.category) : (r.description ? '' : 'No description'))}</div>
          </div>
          <div class="item-actions">
            <button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button>
            <button class="btn red sm" data-act="del" data-id="${r.id}" data-name="${esc(r.name)}">Delete</button>
          </div>
        </div>`).join('');
    }

    async function loadRows() {
      try {
        rows = await fetchItemsFull();
        render();
      } catch (err) { toast(err.message, true); }
    }

    n('im_add').addEventListener('click', async () => {
      const name = n('im_name').value.trim();
      if (!name) return toast('Item name is required', true);
      try {
        await createStockItem({ name, description: n('im_desc').value, category: n('im_cat').value });
        n('im_name').value = ''; n('im_desc').value = ''; n('im_cat').value = '';
        toast('Item added: ' + name);
        load();
        await loadRows();
      } catch (err) { toast(err.message, true); }
    });

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      const row = rows.find((r) => Number(r.id) === Number(btn.dataset.id));
    if (act === 'edit') {
        rows.forEach((r) => { r.editing = false; });
        if (row) row.editing = true;
        render();
      } else if (act === 'cancel') {
        rows.forEach((r) => { r.editing = false; });
        render();
      } else if (act === 'save' && row) {
        const nameEl = overlay.querySelector('#row_name_' + row.id);
        const name = (nameEl ? nameEl.value : '').trim();
        if (!name) return toast('Item name is required', true);
        btn.disabled = true;
        try {
          await updateItemRecord(row.id, {
            name,
            description: overlay.querySelector('#row_desc_' + row.id).value,
            category: overlay.querySelector('#row_cat_' + row.id).value
          }, row.name);
          toast('Item updated: ' + name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      } else if (act === 'del' && row) {
        if (!confirm('Delete item "' + row.name + '" and remove its stock from every centre? This cannot be undone.')) return;
        btn.disabled = true;
        try {
          await deleteStockItem(row.id, row.name);
          toast('Item deleted: ' + row.name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      }
    });

    loadRows().catch((err) => toast(err.message, true));
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Masters page — item master (auto codes) + document master (GRN, uploads)
   ========================================================================= */
function renderMastersPage(user) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="logo-banner">
      <div class="mark">M</div>
      <div>
        <h2>Inventory Masters</h2>
        <p style="margin:4px 0 0;color:rgba(255,255,255,.82);font-size:13px">Item catalogue with auto-generated codes, and document master for GRN &amp; SCI form PDFs.</p>
      </div>
    </div>
    <div class="masters-grid">
      <div class="card">
        <div class="ma-toolbar">
          <div><span class="ma-badge item">Item Master</span><p class="ma-sub">Codes auto-generated as ITM-001, ITM-002, ...</p></div>
          <button class="btn primary sm ma-add" id="maAddItem"><span class="icon">+</span> Add Item</button>
        </div>
        <div style="overflow:auto;max-height:56vh"><table class="ma-tbl">
          <thead><tr><th>Code</th><th>Name</th><th>Description</th><th>Category</th><th></th></tr></thead>
          <tbody id="maItemList"></tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="ma-toolbar">
          <div><span class="ma-badge doc">Document Master</span><p class="ma-sub">Upload SCI form PDFs &amp; manage GRN number</p></div>
        </div>
        <div style="overflow:auto;max-height:56vh"><table class="ma-tbl">
          <thead><tr><th>Document</th><th>Doc No.</th><th>PDF</th>${isAdmin() ? '<th></th>' : ''}</tr></thead>
          <tbody id="maDocList"></tbody>
        </table></div>
      </div>
    </div>
  `;

  /* -------- Item master -------- */
  const itemList = document.getElementById('maItemList');
  let items = [];
  let newEntry = null;

  function renderItemRows() {
    const newRow = newEntry ? `
      <tr class="row-flash">
        <td><span class="item-code" style="background:var(--bg);color:var(--muted);font-weight:600">AUTO</span></td>
        <td><input id="maRowName_new" placeholder="Item name" maxlength="200" style="width:140px"></td>
        <td><input id="maRowDesc_new" placeholder="Description" style="width:160px"></td>
        <td><input id="maRowCat_new" placeholder="Category" style="width:110px"></td>
        <td><div class="doc-row-actions"><button class="btn green sm" data-act="savenew">Save</button><button class="btn sm" data-act="cancelnew">Cancel</button></div></td>
      </tr>` : '';
    if (!items.length && !newEntry) {
      itemList.innerHTML = '<tr><td colspan="5" class="empty">No items yet — click Add Item.</td></tr>';
      return;
    }
    itemList.innerHTML = newRow + items.map((r) => r.editing ? `
      <tr>
        <td><span class="item-code" style="background:var(--bg);color:var(--muted)">${esc(r.code || 'AUTO')}</span></td>
        <td><input id="maRowName_${r.id}" value="${esc(r.name)}" maxlength="200" style="width:140px"></td>
        <td><input id="maRowDesc_${r.id}" value="${esc(r.description || '')}" placeholder="Description" style="width:160px"></td>
        <td><input id="maRowCat_${r.id}" value="${esc(r.category || '')}" placeholder="Category" style="width:110px"></td>
        <td><div class="doc-row-actions"><button class="btn green sm" data-act="save" data-id="${r.id}">Save</button><button class="btn sm" data-act="cancel">Cancel</button></div></td>
      </tr>` : `
      <tr>
        <td><span class="item-code">${esc(r.code || 'ITM-###')}</span></td>
        <td><span class="item-name">${esc(r.name)}</span></td>
        <td>${esc(r.description || '—')}</td>
        <td>${esc(r.category || '—')}</td>
        <td><div class="doc-row-actions"><button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button><button class="btn red sm" data-act="del" data-id="${r.id}">Delete</button></div></td>
      </tr>`).join('');
  }

  function loadItems() {
    return fetchItemsFull().then((rows) => { items = rows; renderItemRows(); });
  }

  document.getElementById('maAddItem').addEventListener('click', () => {
    newEntry = { name: '', description: '', category: '' };
    renderItemRows();
    setTimeout(() => { const el = document.getElementById('maRowName_new'); if (el) el.focus(); }, 60);
  });

  itemList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if (act === 'savenew') {
      const name = document.getElementById('maRowName_new').value;
      if (!name.trim()) return toast('Item name is required', true);
      createStockItem({
        name,
        description: document.getElementById('maRowDesc_new').value,
        category: document.getElementById('maRowCat_new').value
      })
        .then(() => { newEntry = null; toast('Item added with auto-generated code'); loadItems(); })
        .catch((err) => toast(err.message, true));
    } else if (act === 'cancelnew') {
      newEntry = null; renderItemRows();
    } else if (act === 'edit') {
      const r = items.find((x) => String(x.id) === id);
      if (r) { r.editing = true; renderItemRows(); }
    } else if (act === 'cancel') {
      const r = items.find((x) => String(x.id) === id);
      if (r) { delete r.editing; renderItemRows(); }
    } else if (act === 'save') {
      const r = items.find((x) => String(x.id) === id);
      if (!r) return;
      const fields = {
        name: document.getElementById('maRowName_' + id).value,
        description: document.getElementById('maRowDesc_' + id).value,
        category: document.getElementById('maRowCat_' + id).value
      };
      if (!fields.name.trim()) return toast('Item name is required', true);
      updateItemRecord(id, fields, r.name)
        .then(() => { toast('Item updated'); loadItems(); })
        .catch((err) => toast(err.message, true));
    } else if (act === 'del') {
      const r = items.find((x) => String(x.id) === id);
      if (!r || !confirm('Delete "' + r.name + '" and remove its stock rows from every centre?')) return;
      deleteStockItem(id, r.name)
        .then(() => { toast('Item deleted'); loadItems(); })
        .catch((err) => toast(err.message, true));
    }
  });

  loadItems().catch((err) => toast(err.message, true));

  /* -------- Document master -------- */
  const docList = document.getElementById('maDocList');
  let docs = [];

  function renderDocRows() {
    if (!docs.length) {
      docList.innerHTML = '<tr><td colspan="4" class="empty">No documents yet.</td></tr>';
      return;
    }
    docList.innerHTML = docs.map((d) => `
      <tr>
        <td><span class="item-name">${esc(d.name)}</span><div class="doc-desc">${esc(d.description || '')}</div></td>
        <td style="min-width:200px"><input class="doc-no" id="docNo_${d.id}" value="${esc(d.docNo || '')}" placeholder="Enter number"><button class="btn sm" data-act="savedoc" data-id="${d.id}" style="margin-left:6px">Save</button></td>
        <td>
          <div class="doc-row-actions">
            <label class="btn sm" style="margin:0">${d.document ? 'Replace' : 'Upload PDF'}
              <input type="file" accept="application/pdf,.pdf" data-act="upload" data-id="${d.id}" style="display:none">
            </label>
            ${d.document ? `<a class="file-link" href="${storageFileUrl(d.document)}" target="_blank" title="${esc(d.documentName || '')}">View PDF</a>` : ''}
          </div>
        </td>
        ${isAdmin() ? `<td><button class="btn red sm" data-act="deldoc" data-id="${d.id}">Delete</button></td>` : ''}
      </tr>`).join('');
  }

  function loadDocs() {
    return fetchDocuments().then((rows) => { docs = rows; renderDocRows(); });
  }

  docList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act="savedoc"], [data-act="deldoc"]');
    if (!btn) return;
    const id = btn.dataset.id;
    const d = docs.find((x) => String(x.id) === id);
    if (!d) return;
    if (btn.dataset.act === 'savedoc') {
      const val = document.getElementById('docNo_' + id).value.trim();
      updateDocumentRecord(id, { docNo: val })
        .then(() => { toast('Document number saved'); d.docNo = val; })
        .catch((err) => toast(err.message, true));
    } else if (btn.dataset.act === 'deldoc') {
      if (!confirm('Delete document "' + d.name + '"?')) return;
      deleteDocumentRecord(id)
        .then(() => { toast('Document deleted'); loadDocs(); })
        .catch((err) => toast(err.message, true));
    }
  });

  docList.addEventListener('change', (e) => {
    const input = e.target;
    if (!input.matches('[data-act="upload"]')) return;
    const file = input.files[0];
    if (!file) return;
    if (file.size > 200 * 1024 || !/\.pdf$/i.test(file.name)) return toast('Choose a PDF no larger than 200 KB', true);
    const id = input.dataset.id;
    const path = 'docs/' + Date.now() + '_' + file.name;
    sb.storage.from('uploads').upload(path, file, { contentType: 'application/pdf', cacheControl: '3600', upsert: false })
      .then(async ({ error: upErr }) => {
        if (upErr) throw new Error('PDF upload failed: ' + upErr.message);
        const old = (docs.find((x) => String(x.id) === id) || {}).document;
        await updateDocumentRecord(id, { document: path, documentName: file.name });
        if (old) { try { await sb.storage.from('uploads').remove([old]); } catch (e) {} }
        toast('PDF uploaded');
        loadDocs();
      })
      .catch((err) => toast(err.message, true));
  });

  loadDocs().catch((err) => toast(err.message, true));
}

/* =========================================================================
   SCI forms page
   ========================================================================= */
function renderSCIFormsPage(user) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  const state = { forms: [], destinations: [] };
  let selectedCode = SCI_FORM_META[0].code;

  function badge(status) {
    if (status === 'approved') return '<span class="badge green">Approved</span>';
    if (status === 'rejected') return '<span class="badge red">Rejected</span>';
    return '<span class="badge amber">Pending</span>';
  }

  function documentLink(form) {
    return form.document
      ? `<a class="file-link" href="${storageFileUrl(form.document)}" target="_blank">${esc(form.documentName || 'View PDF')}</a>`
      : '—';
  }

  async function load() {
    [state.forms, state.destinations] = await Promise.all([fetchSCIForms(), fetchDestinations()]);
    render();
  }

  function render() {
    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>SCI Forms</h2>
          <p>Submit and manage SCI form submissions with document attachments.</p>
        </div>
        <span class="badge ${isAdmin() ? 'green' : 'navy'}" style="font-size:13px;padding:6px 14px">${esc(isAdmin() ? 'ADMIN REVIEW' : 'FORM SUBMISSION')}</span>
      </div>
      <div class="sci-form-grid" id="sciFormGrid">
        ${SCI_FORM_META.map((form) => `
          <div class="card sci-form-card${form.code === selectedCode ? ' card-found' : ''}" data-sci-code="${form.code}">
            <div class="sci-code">${form.code}</div>
            <h3>${esc(form.title)}</h3>
            <p>${esc(form.hint)}</p>
            <button class="btn primary sm" type="button">Open Form</button>
          </div>`).join('')}
      </div>
      <div class="sci-editor" id="sciEditor"></div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><h3 style="margin-bottom:2px">Recent Submissions</h3><span class="hint">Your submitted SCI forms${isAdmin() ? ' and forms awaiting review' : ''}.</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="sci_export_recent" type="button">Export Excel</button><a class="btn sm" href="#/log">Open Forms Log</a></div>
        </div>
        <div class="table-wrap" style="margin-top:14px;box-shadow:none" id="sciMyTable"></div>
      </div>
    `;
    content.querySelectorAll('[data-sci-code]').forEach((card) => card.addEventListener('click', () => {
      selectedCode = card.dataset.sciCode;
      render();
    }));
    document.getElementById('sci_export_recent').addEventListener('click', async (event) => {
      event.target.disabled = true;
      try { await downloadSCIForms(); toast('SCI forms exported to Excel'); }
      catch (err) { toast(err.message, true); }
      event.target.disabled = false;
    });
    renderEditor();
    renderSubmissions();
  }

  function renderEditor() {
    const form = SCI_FORM_META.find((item) => item.code === selectedCode) || SCI_FORM_META[0];
    const destinationOptions = state.destinations.map((centre) => `<option value="${esc(centre.id)}">${esc(centre.name)} (${esc(centre.type)})</option>`).join('');
    document.getElementById('sciEditor').innerHTML = `
      <div class="card">
        <div style="margin-bottom:14px"><div class="sci-code">${form.code}</div><h3>${esc(form.title)}</h3><p class="hint" style="margin:4px 0 0">${esc(form.hint)}</p></div>
        <form id="sciSubmitForm" class="form-row">
          <div class="field"><label>Sewadar Name</label><input id="sci_sewadar" type="text" maxlength="200" required placeholder="Full name"></div>
          <div class="field"><label>Sewadar Badge No.</label><input id="sci_badge" type="text" maxlength="12" minlength="12" pattern="[A-Za-z0-9]{12}" required placeholder="e.g. AB12CD34EF56" autocomplete="off"></div>
          ${form.code === 'SCI43' ? `<div class="field"><label>Destination Centre</label><select id="sci_destination" required><option value="">— select destination centre —</option>${destinationOptions}</select></div>` : ''}
          ${form.code === 'SCI34' ? '<div class="field"><label>Sale Proceeds Amount</label><input id="sci_amount" type="number" min="0" step="0.01" required placeholder="0.00"></div>' : ''}
          <div class="field"><label>Quantity</label><input id="sci_quantity" type="number" min="1" required placeholder="Number of items"></div>
          <div class="field full"><label>Items / Material Details</label><textarea id="sci_details" required placeholder="Describe the articles, items, material, or transaction details"></textarea></div>
          <div class="field full"><label>Remarks (optional)</label><textarea id="sci_remarks" placeholder="Additional information"></textarea></div>
          <div class="field full"><label>Upload ${form.code} PDF</label><input id="sci_document" type="file" accept="application/pdf,.pdf" required><span class="hint">PDF only, maximum 200 KB.</span></div>
          <div class="field full" style="flex-direction:row;gap:12px;align-items:center"><button type="submit" class="btn primary">Submit ${form.code}</button><span class="hint">The submission will be marked Pending for administrator review.</span></div>
        </form>
      </div>
    `;
    const badgeInput = document.getElementById('sci_badge');
    badgeInput.addEventListener('input', () => { badgeInput.value = badgeInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 12); });
    document.getElementById('sciSubmitForm').addEventListener('submit', submitForm);
  }

  async function submitForm(event) {
    event.preventDefault();
    const file = document.getElementById('sci_document').files[0];
    const badgeInput = document.getElementById('sci_badge').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{12}$/.test(badgeInput)) return toast('Badge number must contain exactly 12 letters and numbers', true);
    if (!file || file.size > 200 * 1024 || !/\.pdf$/i.test(file.name)) return toast('Choose a PDF no larger than 200 KB', true);
    const button = event.target.querySelector('button[type="submit"]');
    button.disabled = true;
    const formMeta = SCI_FORM_META.find((m) => m.code === selectedCode) || SCI_FORM_META[0];
    const me = getUser();
    const centreId = typeof me.id === 'number' ? me.id : null;
    const centreName = me.centreName || '';
    const destEl = document.getElementById('sci_destination');
    const destId = destEl && destEl.value ? Number(destEl.value) : null;
    const destName = destId ? (state.destinations.find((c) => Number(c.id) === destId) || {}).name || '' : '';
    const qty = document.getElementById('sci_quantity').value;
    if (!qty || Number(qty) < 1) return toast('Quantity is required and must be at least 1', true);
    const amt = document.getElementById('sci_amount');
    const storagePath = Date.now() + '_' + file.name;
    try {
      const { error: upErr } = await sb.storage.from('uploads').upload(storagePath, file, { contentType: 'application/pdf', cacheControl: '3600', upsert: false });
      if (upErr) throw new Error('PDF upload failed: ' + upErr.message);
      const { error: insErr } = await sb.from('sci_forms').insert({
        formType: selectedCode,
        formTitle: formMeta.title,
        centreId,
        centreName,
        sewadarName: document.getElementById('sci_sewadar').value.trim(),
        sewadarBadge: badgeInput,
        details: { description: document.getElementById('sci_details').value.trim() },
        remarks: document.getElementById('sci_remarks').value.trim(),
        quantity: qty ? Number(qty) : null,
        amount: amt && amt.value ? Number(amt.value) : null,
        destinationCentreId: destId,
        destinationCentreName: destName,
        document: storagePath,
        documentName: file.name,
        status: 'pending'
      });
      if (insErr) throw new Error('Submission failed: ' + insErr.message);
      toast(selectedCode + ' submitted for review');
      await load();
    } catch (err) { button.disabled = false; toast(err.message, true); }
  }

  function renderSubmissions() {
    const table = document.getElementById('sciMyTable');
    table.innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Form</th><th>Centre</th><th>Sewadar</th><th>Badge</th><th>PDF</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${state.forms.length ? state.forms.slice(0, 20).map((form) => `<tr title="Click to open the full form" data-form-id="${esc(form.id)}">
          <td>${esc((form.submittedAt || '').slice(0, 10))}</td>
          <td><b>${esc(form.formType)}</b><br><small>${esc(form.formTitle)}</small></td>
          <td>${esc(form.centreName)}</td>
          <td>${esc(form.sewadarName)}</td>
          <td class="mono">${esc(form.sewadarBadge)}</td>
          <td>${documentLink(form)}</td>
          <td>${badge(form.status)}</td>
          <td>${isAdmin() && form.status === 'pending' ? `<button class="btn green sm" data-form-action="approve" data-id="${esc(form.id)}">Approve</button> <button class="btn red sm" data-form-action="reject" data-id="${esc(form.id)}">Reject</button>` : '—'}</td>
        </tr>`).join('') : '<tr><td colspan="8" class="empty">No SCI forms submitted yet</td></tr>'}</tbody>
      </table>
      ${state.forms.length > 20 ? '<div class="hint" style="padding:10px 14px">Showing the 20 most recent submissions. Open Forms Log for the full list.</div>' : ''}
    `;
    table.onclick = (e) => {
      if (e.target.closest('[data-form-action], a, button')) return;
      const tr = e.target.closest('tr[data-form-id]');
      if (!tr) return;
      const form = state.forms.find((f) => String(f.id) === String(tr.dataset.formId));
      if (form) openSCIFormDetail(form, load);
    };
    table.querySelectorAll('[data-form-action]').forEach((button) => button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await updateFormStatus(button.dataset.id, button.dataset.formAction);
        toast(button.dataset.formAction === 'approve' ? 'SCI form approved' : 'SCI form rejected');
        load();
      } catch (err) { button.disabled = false; toast(err.message, true); }
    }));
  }

  load().catch((err) => toast(err.message, true));
}
</script>
</body>
</html>
