      if (findErr || !u) throw new Error('User not found');
      if (!SUPABASE_SECRET_KEY) throw new Error('Password reset is disabled in this build (no service key configured).');
      const { error: resetErr } = await sbAdmin.auth.admin.updateUserById(u.authId, { password: p1 });
      if (resetErr) throw new Error(resetErr.message || 'Reset failed');
      msg.textContent = 'Password reset for ' + u.name;
      msg.style.display = 'block';
      msg.style.color = 'var(--green)';
      msg.style.background = 'var(--green-bg)';
      document.getElementById('rp_pass').value = '';
      document.getElementById('rp_confirm').value = '';
    } catch (err) {
      msg.textContent = err.message;
      msg.style.display = 'block';
      msg.style.color = '';
      msg.style.background = '';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('err');
    errEl.style.display = 'none';
    try {
      const body = await login(
        document.getElementById('username').value.trim(),
        document.getElementById('password').value
      );
      setSession(body.token, body.user);
      document.body.classList.remove('login-page');
      location.hash = '/dashboard';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });
}

/* =========================================================================
   Dashboard page
   ========================================================================= */
function renderDashboardPage(user, routeParams) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  let centers = [];
  let allForms = [];
  let dashFilter = 'all';
  let kpi = null;

  function badge(status) {
    if (status === 'approved') return '<span class="badge green">Approved</span>';
    if (status === 'rejected') return '<span class="badge red">Rejected</span>';
    return '<span class="badge amber">Pending</span>';
  }

  function documentLink(form) {
    return form.document
      ? `<a class="file-link" href="${storageFileUrl(form.document)}" target="_blank">${esc(form.documentName || 'View File')}</a>`
      : 'â€”';
  }

  function scopedIds() {
    if (isAdmin() || isViewer()) return new Set(centers.map((c) => String(c.id)));
    const byP = {};
    centers.forEach((c) => { (byP[c.parentId || ''] = byP[c.parentId || ''] || []).push(c); });
    const me = centers.find((c) => String(c.id) === String(user.id));
    const out = [];
    const w = (n) => { out.push(n); (byP[n.id] || []).forEach(w); };
    if (me) w(me);
    return new Set(out.map((c) => String(c.id)));
  }

  let dashSort = { key: null, dir: 'asc' };

  function dashVal(f, k) {
    switch (k) {
      case 'date': return String(f.submittedAt || '');
      case 'form': return String(f.formType || '').toLowerCase();
      case 'centre': return String(f.centreName || '').toLowerCase();
      case 'sewadar': return String(f.sewadarName || '').toLowerCase();
      case 'badge': return String(f.sewadarBadge || '').toLowerCase();
      case 'approval': return String((f.details && f.details.approvalNo) || '').toLowerCase();
      case 'destination': return String(f.destinationCentreName || '').toLowerCase();
      case 'amount': return Number(String(f.amount || '').replace(/[^0-9.-]/g, '')) || 0;
      case 'status': return String(f.status || '');
      default: return '';
    }
  }

  function renderFormList() {
    const ids = scopedIds();
    let forms = allForms.filter((f) => ids.has(String(f.centreId)));
    if (dashFilter !== 'all') forms = forms.filter((f) => f.status === dashFilter);
    if (dashSort.key) {
      const dir = dashSort.dir === 'asc' ? 1 : -1;
      forms = forms.slice().sort((a, b) => {
        const va = dashVal(a, dashSort.key); const vb = dashVal(b, dashSort.key);
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
      });
    }
    const cnt = document.getElementById('dashCount');
    if (cnt) cnt.textContent = `${forms.length} form${forms.length === 1 ? '' : 's'}`;
    const table = document.getElementById('dashTable');
    const dcols = [
      ['date', 'Date'], ['form', 'Form'], ['centre', 'Centre'], ['sewadar', 'Sewadar'], ['badge', 'Badge No.'],
      ['approval', 'Approval No.'], ['destination', 'Destination'], ['amount', 'Amount'], ['file', 'File'], ['status', 'Status']
    ];
    const head = dcols.map(([k, label]) => {
      if (k === 'file') return '<th><span class="th-label">' + label + '</span></th>';
      const active = dashSort.key === k;
      const ic = active ? (dashSort.dir === 'asc' ? '&#9650;' : '&#9660;') : '&#8645;';
      return '<th><span class="th-label" data-sort="' + k + '">' + label + '<span class="sort-ic' + (active ? ' active' : '') + '">' + ic + '</span></span></th>';
    }).join('') + '<th class="col-sticky"><span class="th-label">Action</span></th>';
    table.innerHTML = `
      <table class="dt">
        <thead><tr>${head}</tr></thead>
        <tbody>${forms.length ? forms.map((f) => `
          <tr title="Click to open the full form" data-form-id="${esc(f.id)}">
            <td>${esc((f.submittedAt || '').slice(0, 10))}</td>
            <td><b>${esc(f.formType)}</b><br><small>${esc(f.formTitle || '')}</small></td>
            <td>${esc(f.centreName)}</td>
            <td>${esc(f.sewadarName)}</td>
            <td class="mono">${esc(f.sewadarBadge)}</td>
            <td>${esc((f.details && f.details.approvalNo) || '-')}</td>
            <td>${esc(f.destinationCentreName || '-')}</td>
            <td>${esc(f.amount || '-')}</td>
            <td>${documentLink(f)}</td>
            <td>${badge(f.status)}</td>
            <td class="col-sticky">${isAdmin() && f.status === 'pending' ? `<button class="btn green sm" data-form-action="approve" data-id="${esc(f.id)}">Approve</button> <button class="btn red sm" data-form-action="reject" data-id="${esc(f.id)}">Reject</button>` : '-'}</td>
          </tr>`).join('') : '<tr><td colspan="11" class="empty">No SCI forms found</td></tr>'}</tbody>
      </table>
      <div style="padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px"><b>${forms.length}</b> forms shown</div>`;
    table.querySelectorAll('[data-sort]').forEach((el) => el.addEventListener('click', () => {
      const k = el.dataset.sort;
      if (dashSort.key === k) dashSort.dir = dashSort.dir === 'asc' ? 'desc' : 'asc';
      else { dashSort.key = k; dashSort.dir = 'asc'; }
      renderFormList();
    }));
    table.onclick = (e) => {
      if (e.target.closest('[data-form-action], a, button')) return;
      const tr = e.target.closest('tr[data-form-id]');
      if (!tr) return;
      const form = allForms.find((f) => String(f.id) === String(tr.dataset.formId));
      if (form) openSCIFormDetail(form, renderFormList);
    };
    table.querySelectorAll('[data-form-action]').forEach((b) => b.addEventListener('click', async () => {
      b.disabled = true;
      try {
        await updateFormStatus(b.dataset.id, b.dataset.formAction);
        toast(b.dataset.formAction === 'approve' ? 'SCI form approved' : 'SCI form rejected');
        renderFormList();
      } catch (err) { b.disabled = false; toast(err.message, true); }
    }));
  }

  function render() {
    const title = isAdmin() ? 'Main ASO Admin Dashboard' : isViewer() ? 'ASO Viewer Dashboard' : ((user && user.name) || 'Dashboard');
    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>${esc(title)}</h2>
          <p>Recent SCI forms: pending, approved, or all submissions.</p>
        </div>
      </div>
      ${kpi ? `
      <div class="kpi-grid">
        <div class="kpi${dashFilter === 'pending' ? ' active' : ''}" data-dash-filter="pending"><p class="kpi-label">Pending Approval</p><p class="kpi-value">${kpi.pending}</p></div>
        <div class="kpi${dashFilter === 'approved' ? ' active' : ''}" data-dash-filter="approved"><p class="kpi-label">Approved</p><p class="kpi-value">${kpi.approved}</p></div>
        <div class="kpi${dashFilter === 'rejected' ? ' active' : ''}" data-dash-filter="rejected"><p class="kpi-label">Rejected</p><p class="kpi-value">${kpi.rejected}</p></div>
      </div>` : ''}
      <div class="card" style="margin-bottom:18px">
        <div class="dash-tabs">
          ${['all', 'pending', 'approved', 'rejected'].map((k) => `<button class="dash-tab${dashFilter === k ? ' active' : ''}" data-dash-filter="${k}">${k.charAt(0).toUpperCase() + k.slice(1)}</button>`).join('')}
          <span class="dash-tab-count" id="dashCount"></span>
        </div>
      </div>
      <div class="table-wrap"><div id="dashTable"></div></div>
    `;
    content.querySelectorAll('[data-dash-filter]').forEach((b) => b.addEventListener('click', () => {
      dashFilter = b.dataset.dashFilter;
      render();
    }));
    renderFormList();
  }

  async function load() {
    [centers, allForms] = await Promise.all([fetchCenters(), fetchSCIForms()]);
    const sold = isAdmin() || isViewer() ? null : scopedIds();
    const formsInScope = isAdmin() || isViewer() ? allForms : allForms.filter((f) => sold.has(String(f.centreId)));
    kpi = {
      pending: formsInScope.filter((f) => f.status === 'pending').length,
      approved: formsInScope.filter((f) => f.status === 'approved').length,
      rejected: formsInScope.filter((f) => f.status === 'rejected').length
    };
    render();
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Log page
   ========================================================================= */
function renderSCIFormsLogPage(user) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  let centers = [];
  let currentForms = [];
  let statusTab = '';
  let page = 0;
  let pageSize = 10;
  let sortState = { key: null, dir: 'asc' };
  const LOG_COLS_KEY = 'ims.cols.log';
  let hiddenCols = [];
  try { hiddenCols = JSON.parse(localStorage.getItem(LOG_COLS_KEY) || '[]'); } catch (e) { hiddenCols = []; }
  if (!Array.isArray(hiddenCols)) hiddenCols = [];

  const LOG_COLS = [
    { key: 'date',        label: 'Date',         sortable: true,  always: true },
    { key: 'form',        label: 'Form',         sortable: true,  always: true },
    { key: 'centre',      label: 'Centre',       sortable: true },
    { key: 'sewadar',     label: 'Sewadar',      sortable: true },
    { key: 'badge',       label: 'Badge No.',    sortable: true },
    { key: 'approval',    label: 'Approval No.', sortable: true },
    { key: 'details',     label: 'Details',      sortable: false },
    { key: 'destination', label: 'Destination',  sortable: true },
    { key: 'amount',      label: 'Amount',       sortable: true, align: 'right' },
    { key: 'file',        label: 'File',         sortable: false },
    { key: 'status',      label: 'Status',       sortable: true },
    { key: 'action',      label: 'Action',       sortable: false, cls: 'col-sticky', always: true },
  ];

  function visibleCols() { return LOG_COLS.filter((c) => c.always || hiddenCols.indexOf(c.key) === -1); }
  function isHidden(key) { const c = LOG_COLS.find((x) => x.key === key); return c && !c.always && hiddenCols.indexOf(key) !== -1; }
  function saveHidden() { try { localStorage.setItem(LOG_COLS_KEY, JSON.stringify(hiddenCols)); } catch (e) {} }
  function thClass(c) { return [c.cls || '', c.align === 'right' ? 'num' : ''].filter(Boolean).join(' '); }

  function badge(status) {
    if (status === 'approved') return '<span class="badge green">Approved</span>';
    if (status === 'rejected') return '<span class="badge red">Rejected</span>';
    return '<span class="badge amber">Pending</span>';
  }
  function documentLink(form) {
    return form.document
      ? `<a class="file-link" href="${storageFileUrl(form.document)}" target="_blank">${esc(form.documentName || 'View File')}</a>`
      : '-';
  }

  function tabList() { return currentForms.filter((f) => !statusTab || f.status === statusTab); }

  function sortVal(f, key) {
    switch (key) {
      case 'date': return String(f.submittedAt || '');
      case 'form': return String(f.formType || '').toLowerCase();
      case 'centre': return String(f.centreName || '').toLowerCase();
      case 'sewadar': return String(f.sewadarName || '').toLowerCase();
      case 'badge': return String(f.sewadarBadge || '').toLowerCase();
      case 'approval': return String((f.details && f.details.approvalNo) || '').toLowerCase();
      case 'destination': return String(f.destinationCentreName || '').toLowerCase();
      case 'amount': return Number(String(f.amount || '').replace(/[^0-9.-]/g, '')) || 0;
      case 'status': return String(f.status || '');
      default: return '';
    }
  }
  function sortRows(list) {
    if (!sortState.key) return list.slice();
    const k = sortState.key;
    const dir = sortState.dir === 'asc' ? 1 : -1;
    return list.slice().sort((a, b) => {
      const va = sortVal(a, k); const vb = sortVal(b, k);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  function theadFlat() {
    return '<tr>' + visibleCols().map((c) => {
      if (!c.sortable) return '<th class="' + thClass(c) + '"><span class="th-label">' + esc(c.label) + '</span></th>';
      const active = sortState.key === c.key;
      const ic = active ? (sortState.dir === 'asc' ? '&#9650;' : '&#9660;') : '&#8645;';
      return '<th class="' + thClass(c) + '"><span class="th-label" data-sort="' + c.key + '">' + esc(c.label) + '<span class="sort-ic' + (active ? ' active' : '') + '">' + ic + '</span></span></th>';
    }).join('') + '</tr>';
  }

  function rowHtml(f) {
    const detail = sciDetailsText(f);
    const act = isAdmin() && f.status === 'pending'
      ? `<button class="btn green sm" data-form-action="approve" data-id="${esc(f.id)}">Approve</button> <button class="btn red sm" data-form-action="reject" data-id="${esc(f.id)}">Reject</button>`
      : '-';
    const cell = {
      date: `<td>${esc((f.submittedAt || '').slice(0, 10))}</td>`,
      form: `<td class="wrap"><b>${esc(f.formType)}</b><br><small>${esc(f.formTitle || '')}</small></td>`,
      centre: `<td>${esc(f.centreName)}</td>`,
      sewadar: `<td>${esc(f.sewadarName)}</td>`,
      badge: `<td class="mono">${esc(f.sewadarBadge)}</td>`,
      approval: `<td>${esc((f.details && f.details.approvalNo) || '-')}</td>`,
      details: `<td class="wrap sci-detail">${esc(detail || '-')}</td>`,
      destination: `<td>${esc(f.destinationCentreName || '-')}</td>`,
      amount: `<td class="num">${esc(f.amount || '-')}</td>`,
      file: `<td>${documentLink(f)}</td>`,
      status: `<td>${badge(f.status)}</td>`,
      action: `<td class="col-sticky"><div class="row-actions">${act}</div></td>`
    };
    return `<tr data-form-id="${esc(f.id)}" title="Click to open the full form">${visibleCols().map((c) => cell[c.key]).join('')}</tr>`;
  }

  function renderTable() {
    const host = document.getElementById('sciLogTable');
    if (!host) return;
    const shown = sortRows(tabList());
    const totalPages = Math.max(1, Math.ceil(shown.length / pageSize));
    if (page >= totalPages) page = totalPages - 1;
    const rows = shown.slice(page * pageSize, (page + 1) * pageSize);
    const nCols = visibleCols().length;
    let pgHtml = '';
    if (shown.length) {
      pgHtml = `
        <div class="reg-pagination">
          <span class="pg-info">${page * pageSize + 1}-${Math.min(shown.length, (page + 1) * pageSize)} of ${shown.length}</span>
          <button class="pg-btn" data-pg="prev"${page === 0 ? ' disabled' : ''}>&#8249; Prev</button>
          <span class="pg-info" style="margin:0 4px">Page ${page + 1} / ${totalPages}</span>
          <button class="pg-btn" data-pg="next"${page >= totalPages - 1 ? ' disabled' : ''}>Next &#8250;</button>
        </div>`;
    }
    host.innerHTML = `
      <table class="dt">
        <thead>${theadFlat()}</thead>
        <tbody>${rows.length ? rows.map(rowHtml).join('') : `<tr><td class="empty" colspan="${nCols}">No SCI forms found</td></tr>`}</tbody>
      </table>
      ${pgHtml}`;
    const countEl = document.getElementById('formLogCount');
    if (countEl) countEl.textContent = shown.length;

    host.querySelectorAll('[data-sort]').forEach((el) => el.addEventListener('click', () => {
      const k = el.dataset.sort;
      if (sortState.key === k) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      else { sortState.key = k; sortState.dir = 'asc'; }
      page = 0; renderTable();
    }));
    host.querySelectorAll('.pg-btn').forEach((b) => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.pg === 'prev') page = Math.max(0, page - 1);
      else page = page + 1;
      renderTable();
    }));
    host.onclick = (e) => {
      if (e.target.closest('[data-form-action], a, button')) return;
      const tr = e.target.closest('tr[data-form-id]');
      if (!tr) return;
      const form = currentForms.find((f) => String(f.id) === String(tr.dataset.formId));
      if (form) openSCIFormDetail(form, applyFilter);
    };
    host.querySelectorAll('[data-form-action]').forEach((button) => button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await updateFormStatus(button.dataset.id, button.dataset.formAction);
        toast(button.dataset.formAction === 'approve' ? 'SCI form approved' : 'SCI form rejected');
        applyFilter();
      } catch (err) { button.disabled = false; toast(err.message, true); }
    }));
  }

  function currentParams() {
    const params = new URLSearchParams();
    const type = document.getElementById('sci_log_type').value;
    const q = document.getElementById('sci_log_q').value.trim();
    const center = document.getElementById('sci_log_center').value;
    if (type) params.set('formType', type);
    if (q) params.set('q', q);
    if (center) params.set('centreId', center);
    return params;
  }

  async function applyFilter() {
    const params = currentParams();
    let forms;
    try { forms = await fetchSCIForms(params.toString()); }
    catch (err) { toast(err.message, true); return; }
    currentForms = forms;
    page = 0;
    renderTable();
  }

  function exportCSV() {
    const rows = sortRows(tabList());
    const csvCell = (v) => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const header = ['Date', 'Form', 'Title', 'Centre', 'Sewadar', 'Badge No.', 'Approval No.', 'Details', 'Destination', 'Amount', 'Status'];
    const body = rows.map((f) => [
      (f.submittedAt || '').slice(0, 10), f.formType, f.formTitle || '', f.centreName, f.sewadarName, f.sewadarBadge,
      (f.details && f.details.approvalNo) || '', sciDetailsText(f) || '', f.destinationCentreName || '', f.amount || '', f.status
    ]);
    const csv = [header].concat(body).map((r) => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'sci-forms-log.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('Forms exported as CSV');
  }

  function printLog() {
    const host = document.getElementById('sciLogTable');
    if (host) {
      const shown = sortRows(tabList());
      host.innerHTML = '<table class="dt"><thead>' + theadFlat() + '</thead><tbody>' + (shown.length ? shown.map(rowHtml).join('') : '') + '</tbody></table>';
    }
    window.print();
    renderTable();
  }

  function render() {
    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>SCI Forms Log</h2>
          <p>Search, filter, and review all submitted SCI forms across centres.</p>
        </div>
        <div class="stat" style="min-width:150px">
          <b id="formLogCount">0</b>
          <span>Forms shown</span>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="dash-tabs" id="logTabs">
          ${['', 'pending', 'approved', 'rejected'].map((k) => `<button class="dash-tab${statusTab === k ? ' active' : ''}" data-log-tab="${k}">${k ? k.charAt(0).toUpperCase() + k.slice(1) : 'All'}</button>`).join('')}
        </div>
      </div>

      <div class="reg-toolbar">
        <div class="rt-row">
          <select id="sci_log_type" title="Filter by form"><option value="">All forms</option>${SCI_FORM_META.map((f) => `<option value="${f.code}">${f.code}</option>`).join('')}</select>
          <input type="text" id="sci_log_q" placeholder="Search sewadar / badge / centre">
          <select id="sci_log_center" title="Filter by centre"><option value="">All centres</option>${centers.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          <button class="btn primary" id="sci_log_go">Search Forms</button>
          <button class="btn" id="sci_log_reset">Reset</button>
          <div class="rt-right">
            <span class="rt-size"><span>Show</span><select id="pgSize"><option value="10" selected>10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><span>Entries</span></span>
            <div class="dropdown">
              <button class="btn sm icon" id="btnCols" title="Show or hide columns">&#9881;</button>
              <div class="dropdown-menu" id="colsMenu">
                <div class="chead">Columns</div>
                ${LOG_COLS.filter((c) => !c.always).map((c) => '<label><input type="checkbox" data-col="' + c.key + '"' + (isHidden(c.key) ? '' : ' checked') + '> ' + esc(c.label) + '</label>').join('')}
              </div>
            </div>
            <div class="dropdown">
              <button class="btn sm" id="btnExport">Export &#9662;</button>
              <div class="dropdown-menu" id="expMenu">
                <button type="button" id="expExcel">Export as Excel</button>
                <button type="button" id="expCsv">Export as CSV</button>
                <button type="button" id="expPrint">Print / PDF</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="table-wrap" id="sciLogTable"></div>
    `;

    document.getElementById('sci_log_go').addEventListener('click', applyFilter);
    document.getElementById('sci_log_q').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilter(); });
    document.getElementById('sci_log_reset').addEventListener('click', () => {
      document.getElementById('sci_log_type').value = '';
      document.getElementById('sci_log_q').value = '';
      document.getElementById('sci_log_center').value = '';
      statusTab = '';
      content.querySelectorAll('[data-log-tab]').forEach((b) => b.classList.toggle('active', b.dataset.logTab === ''));
      applyFilter();
    });
    document.getElementById('pgSize').addEventListener('change', (e) => { pageSize = Number(e.target.value) || 10; page = 0; renderTable(); });
    content.querySelectorAll('[data-log-tab]').forEach((b) => b.addEventListener('click', () => {
      statusTab = b.dataset.logTab;
      content.querySelectorAll('[data-log-tab]').forEach((x) => x.classList.toggle('active', x === b));
      page = 0;
      renderTable();
    }));

    const btCols = document.getElementById('btnCols');
    const colsMenu = document.getElementById('colsMenu');
    if (btCols && colsMenu) {
      btCols.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = colsMenu.classList.toggle('open');
        if (open) setTimeout(() => document.addEventListener('click', () => colsMenu.classList.remove('open'), { once: true }), 0);
      });
      colsMenu.addEventListener('click', (e) => e.stopPropagation());
      colsMenu.querySelectorAll('input[data-col]').forEach((cb) => cb.addEventListener('change', () => {
        const key = cb.dataset.col;
        if (cb.checked) hiddenCols = hiddenCols.filter((k) => k !== key);
        else if (hiddenCols.indexOf(key) === -1) hiddenCols.push(key);
        saveHidden();
        renderTable();
      }));
    }
    const btExp = document.getElementById('btnExport');
    const expMenu = document.getElementById('expMenu');
    if (btExp && expMenu) {
      btExp.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = expMenu.classList.toggle('open');
        if (open) setTimeout(() => document.addEventListener('click', () => expMenu.classList.remove('open'), { once: true }), 0);
      });
      expMenu.addEventListener('click', (e) => e.stopPropagation());
      document.getElementById('expExcel').addEventListener('click', async () => {
        expMenu.classList.remove('open');
        try { await downloadSCIForms(currentParams().toString()); toast('SCI forms exported to Excel'); }
        catch (err) { toast(err.message, true); }
      });
      document.getElementById('expCsv').addEventListener('click', () => { expMenu.classList.remove('open'); exportCSV(); });
      document.getElementById('expPrint').addEventListener('click', () => { expMenu.classList.remove('open'); printLog(); });
    }
  }

  async function load() {
    centers = await fetchCenters();
    render();
    applyFilter();
  }

  load().catch((err) => toast(err.message, true));
}

/* =========================================================================
   Stock register page
   ========================================================================= */
function renderStockPage(user, routeParams) {
  document.body.classList.remove('login-page');
  const content = document.getElementById('content');
  const state = { centers: [], items: [], stock: {}, units: {}, entries: [] };
  let anchorId = null;
  let selectedCenter = null;
  let diffFilter = 'clean';
  /* NOTE (2026-09-29): 98 'difference' entries (A != B) are dummy/test stock.
     Hidden by default: diffFilter starts as 'clean' so only the 2,336 clean
     entries show. Data is NOT deleted - the DB is intact. To bring the 98
     rows back into default view, change the line above to:
       let diffFilter = null;  */
  let skipCurrentCentre = null;
  let page = 0;
  let pageSize = 10;
  const canDeleteReg = function () { return isAdmin(); }();
  const SCROLL_KEY = 'stock-register-scroll';
  const paramC = routeParams.get('c');
  const fullScope = isAdmin() || isViewer();

  function scopeCenters() {
    if (fullScope) return state.centers;
    const me = state.centers.find((c) => String(c.id) === String(user.id));
    if (!me) return [];
    const byParent = {};
    state.centers.forEach((c) => { (byParent[c.parentId || ''] = byParent[c.parentId || ''] || []).push(c); });
    const out = [];
    const walk = (node) => { out.push(node); (byParent[node.id] || []).forEach(walk); };
    walk(me);
    return out;
  }

  function typeBadge(t) {
    if (t === 'CENTRE') return '<span class="badge navy">CENTRE</span>';
    if (t === 'SUB CENTRE') return '<span class="badge azure">SUB CENTRE</span>';
    if (t === 'POINT') return '<span class="badge sky">POINT</span>';
    return '<span class="badge green">ASO ADMIN</span>';
  }

  function conditionOf(stock, items) {
    const cells = items.map((it) => Number(stock[it] || 0));
    const total = cells.reduce((a, b) => a + b, 0);
    const filled = cells.filter((v) => v > 0).length;
    let label = 'No Stock', cls = 'red';
    if (total > 0) {
      const ratio = filled / items.length;
      if (ratio >= 0.9 && total > 150) { label = 'Good'; cls = 'green'; }
      else if (ratio >= 0.5) { label = 'Moderate'; cls = 'amber'; }
      else { label = 'Low'; cls = 'red'; }
    }
    return { label, cls, total };
  }

  const diffTxt = (d) => (d > 0 ? '+' : '') + d;
  const diffCls = (d) => d < 0 ? 'neg' : (d > 0 ? 'pos' : 'zero');
  /* ----- Data-table engine (Phase 2) ----- */
  const COLS = [
    { key: 'sno',          label: 'S. No.',                            group: null,                 sortable: false, cls: 'sno', always: true },
    { key: 'centre',       label: 'Satsang Place',                     group: 'Centre & Item',      sortable: true,  always: true },
    { key: 'item',         label: 'Name of Item',                      group: 'Centre & Item',      sortable: true },
    { key: 'approvalNo',   label: 'Approval Number',                   group: 'Approval',           sortable: true },
    { key: 'approvalDate', label: 'Approval Date',                     group: 'Approval',           sortable: true },
    { key: 'qtyA',         label: 'Quantity as per Stock Register (A)', group: 'Stock Verification', sortable: true, align: 'right' },
    { key: 'qtyB',         label: 'Physically Available Quantity (B)',  group: 'Stock Verification', sortable: true, align: 'right' },
    { key: 'difference',   label: 'Difference (if any) (A\u2212B)',     group: 'Stock Verification', sortable: true, align: 'right' },
    { key: 'reason',       label: 'Reason for Difference',             group: 'Notes',              sortable: false },
    { key: 'remarks',      label: 'Remarks',                           group: 'Notes',              sortable: false },
    { key: 'pageNo',       label: 'Stock Register Page No.',           group: 'Notes',              sortable: true },
    { key: 'actions',      label: 'Actions',                           group: null,                 sortable: false, cls: 'col-sticky', always: true },
  ];
  const COLS_KEY = 'ims.cols.stock';
  let hiddenCols = [];
  try { hiddenCols = JSON.parse(localStorage.getItem(COLS_KEY) || '[]'); } catch (e) { hiddenCols = []; }
  if (!Array.isArray(hiddenCols)) hiddenCols = [];
  let sortState = { key: null, dir: 'asc' };

  function visibleCols() { return COLS.filter((c) => c.always || hiddenCols.indexOf(c.key) === -1); }
  function isHidden(key) { const c = COLS.find((x) => x.key === key); return c && !c.always && hiddenCols.indexOf(key) !== -1; }
  function saveHidden() { try { localStorage.setItem(COLS_KEY, JSON.stringify(hiddenCols)); } catch (e) {} }

  function sortVal(en, key) {
    switch (key) {
      case 'centre': return String(centerName(en.centreId)).toLowerCase();
      case 'item': return String(en.item || '').toLowerCase();
      case 'approvalNo': return String(en.approvalNo || '').toLowerCase();
      case 'approvalDate': return en.approvalDate ? String(en.approvalDate) : '';
      case 'qtyA': return Number(en.qtyA) || 0;
      case 'qtyB': return Number(en.qtyB) || 0;
      case 'difference': return Number(en.difference) || 0;
      case 'reason': return String(en.reason || '').toLowerCase();
      case 'remarks': return String(en.remarks || '').toLowerCase();
      case 'pageNo': return String(en.pageNo || '').toLowerCase();
      default: return '';
    }
  }
  function sortRows(list) {
    if (!sortState.key) return list.slice().reverse();
    const k = sortState.key;
    const dir = sortState.dir === 'asc' ? 1 : -1;
    return list.slice().sort((a, b) => {
      const va = sortVal(a, k); const vb = sortVal(b, k);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  function thClass(c) { return [c.cls || '', c.align === 'right' ? 'num' : ''].filter(Boolean).join(' '); }
  function sortHead(c) {
    if (!c.sortable) return '<span class="th-label">' + esc(c.label) + '</span>';
    const active = sortState.key === c.key;
    const ic = active ? (sortState.dir === 'asc' ? '&#9650;' : '&#9660;') : '&#8645;';
    return '<span class="th-label" data-sort="' + c.key + '">' + esc(c.label) + '<span class="sort-ic' + (active ? ' active' : '') + '">' + ic + '</span></span>';
  }
  function groupSpans() {
    const v = visibleCols();
    const spans = [];
    let i = 0;
    while (i < v.length) {
      const g = v[i].group;
      if (g == null) { spans.push({ type: 'solo', col: v[i] }); i++; continue; }
      let j = i;
      while (j < v.length && v[j].group === g) j++;
      spans.push({ type: 'group', label: g, cols: v.slice(i, j) });
      i = j;
    }
    return spans;
  }
  function theadHtml() {
    const spans = groupSpans();
    const grp = spans.map((s) => s.type === 'solo'
      ? '<th rowspan="2" class="' + thClass(s.col) + '">' + sortHead(s.col) + '</th>'
      : '<th class="grp" colspan="' + s.cols.length + '">' + esc(s.label) + '</th>').join('');
    const sub = spans.map((s) => s.type === 'group'
      ? s.cols.map((c) => '<th class="' + thClass(c) + '">' + sortHead(c) + '</th>').join('')
      : '').join('');
    return '<tr class="grp-row">' + grp + '</tr><tr class="sub-row">' + sub + '</tr>';
  }
  function tbodyHtml(rows, pg) {
    if (!rows.length) return '<tr><td class="empty" colspan="' + visibleCols().length + '">No verification entries yet - click "New Verification Entry" to log the first physical count.</td></tr>';
    return rows.map((en, i) => renderRegRow(en, pg * pageSize + i + 1)).join('');
  }


  async function load() {
    const [centers, stockData, entries] = await Promise.all([fetchCenters(), fetchStock(), fetchStockRegister()]);
    state.centers = centers;
    state.items = stockData.items;
    state.stock = stockData.stock;
    state.units = stockData.unit;
    state.entries = entries;
    render();
  }

  function scopeIds() {
    if (fullScope) return new Set(state.centers.map((c) => String(c.id)));
    const byP = {};
    state.centers.forEach((c) => { (byP[c.parentId || ''] = byP[c.parentId || ''] || []).push(c); });
    const me = state.centers.find((c) => String(c.id) === String(user.id));
    const out = [];
    const w = (n) => { out.push(n); (byP[n.id] || []).forEach(w); };
    if (me) w(me);
    return new Set(out.map((c) => String(c.id)));
  }

  function summary(ids) {
    let totalQty = 0, noStock = 0;
    state.centers.forEach((c) => {
      if (!ids.has(String(c.id))) return;
      const s = state.stock[c.id] || {};
      const t = Object.keys(s).reduce((a, k) => a + (Number(s[k]) || 0), 0);
      totalQty += t;
      if (t === 0) noStock++;
    });
    const scoped = state.entries.filter((en) => ids.has(String(en.centreId)));
    return { items: state.items.length, qty: totalQty, noStock, entries: scoped.length, diff: scoped.filter((en) => Number(en.difference) !== 0).length };
  }

  function render() {
    const ids = scopeIds();
    const scopedEntries = state.entries.filter((en) => ids.has(String(en.centreId)));
    const centreScope = skipCurrentCentre ? scopedEntries.filter((en) => String(en.centreId) === String(skipCurrentCentre)) : scopedEntries;
    const diffMode = diffFilter === 'diff' ? true : (diffFilter === 'clean' ? false : null);
    const shown = diffMode == null ? centreScope : centreScope.filter((en) => diffMode ? Number(en.difference) !== 0 : Number(en.difference) === 0);
    const totalPages = Math.max(1, Math.ceil(shown.length / pageSize));
    if (page >= totalPages) page = totalPages - 1;
    const pageRows = sortRows(shown).slice(page * pageSize, (page + 1) * pageSize);
    const centreSel = skipCurrentCentre ? scopeCenters().find((x) => String(x.id) === String(skipCurrentCentre)) : null;

    function pgNumbers() {
      const win = [];
      for (let p = 0; p < totalPages; p++) {
        if (totalPages <= 7 || p === 0 || p === totalPages - 1 || Math.abs(p - page) <= 1) win.push(p);
        else if (win[win.length - 1] !== -1) win.push(-1);
      }
      return win;
    }
    const pgLinks = pgNumbers();
    let pgHtml = '';
    if (shown.length) {
      pgHtml = `
        <div class="reg-pagination">
          <span class="pg-info">${page * pageSize + 1}â€“${Math.min(shown.length, (page + 1) * pageSize)} of ${shown.length}</span>
          <button class="pg-btn" data-pg="prev"${page === 0 ? ' disabled' : ''}>â€¹ Prev</button>
          ${pgLinks.map((n) => n === -1 ? '<span class="pg-btn" style="border:none;background:none;cursor:default">â€¦</span>' : `<button class="pg-btn${n === page ? ' active' : ''}" data-pg="${n}">${n + 1}</button>`).join('')}
          <button class="pg-btn" data-pg="next"${page >= totalPages - 1 ? ' disabled' : ''}>Next â€º</button>
        </div>`;
    }

    content.innerHTML = `
      <div class="logo-banner">
        <div>
          <h2>Stock Register</h2>
          <p>${isAdmin() ? 'Physical-stock verification ledger for every centre â€” log each verified count, spot any difference from the book figure, and adjust stock when needed.' : 'Verification ledger for your centre + allocated sub centres & points â€” log each verified count and spot differences from the book figure.'}</p>
        </div>
        <div class="sr-actions">
          <button class="btn sm" id="btnManage" title="Add, edit or delete stock items">Manage Items</button>
          <button class="btn primary" id="btnNew" title="Enter a new physical verification entry">+ New Verification Entry</button>
        </div>
      </div>
      <div class="reg-toolbar">
        <div class="rt-row">
          <select id="regCentre" title="Filter the register to one centre"></select>
          <button class="btn sm" id="btnClear" title="Clear all filters">Clear All</button>
          <div class="rt-right">
            <span class="rt-size"><span>Show</span><select id="pgSize" title="Rows per page"><option value="5">5</option><option value="10" selected>10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><span>Entries</span></span>
            <span class="rt-count">${shown.length} records</span>
                        <div class="dropdown">
              <button class="btn sm icon" id="btnCols" title="Show or hide columns">&#9881;</button>
              <div class="dropdown-menu" id="colsMenu">
                <div class="chead">Columns</div>
                ${COLS.filter((c) => !c.always).map((c) => '<label><input type="checkbox" data-col="' + c.key + '"' + (isHidden(c.key) ? '' : ' checked') + '> ' + esc(c.label) + '</label>').join('')}
              </div>
            </div>
            <div class="dropdown">
              <button class="btn sm" id="btnExport" title="Export or print the register">Export &#9662;</button>
              <div class="dropdown-menu" id="expMenu">
                <button type="button" id="expCsv">Export as CSV</button>
                <button type="button" id="expPrint">Print / PDF</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      ${(centreSel) ? `<div class="reg-pills">
        ${`<span class="reg-pill">Centre : ${esc(centreSel.name)}<button data-clearf="centre" title="Remove filter">âœ•</button></span>`}
      </div>` : ''}
      <!-- DIFF PILL COMMENTED OUT: filter locked to "No difference" (see code note near diffFilter default). 
           ${diffFilter != null ? `<span class="reg-pill">Filter : No difference</span>` : ''} -->
      <div class="table-wrap">
                <table class="stock-table reg-table dt">
          <thead>${theadHtml()}</thead>
          <tbody>${tbodyHtml(pageRows, page)}</tbody>
        </table>
      </div>
      ${pgHtml}
      <p style="margin-top:12px;color:var(--muted);font-size:12px">${shown.length} of ${centreScope.length} entries in scope${skipCurrentCentre ? ' Â· filtered to one centre' : ''}${diffFilter ? ' Â· filtered by difference' : ''}. The Difference column is computed automatically as (A âˆ’ B); use <b>Apply</b> to write the physically counted quantity back into the book figure.</p>
    `;

    bindSearch();
    content.querySelector('#btnNew').addEventListener('click', () => openRegisterModal(null));
    const btnManage = content.querySelector('#btnManage');
    if (btnManage) btnManage.addEventListener('click', () => openItemsManager('list'));
        const btCols = content.querySelector('#btnCols');
    const colsMenu = content.querySelector('#colsMenu');
    if (btCols && colsMenu) {
      btCols.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = colsMenu.classList.toggle('open');
        if (open) setTimeout(() => document.addEventListener('click', () => colsMenu.classList.remove('open'), { once: true }), 0);
      });
      colsMenu.addEventListener('click', (e) => e.stopPropagation());
      colsMenu.querySelectorAll('input[data-col]').forEach((cb) => cb.addEventListener('change', () => {
        const key = cb.dataset.col;
        if (cb.checked) hiddenCols = hiddenCols.filter((k) => k !== key);
        else if (hiddenCols.indexOf(key) === -1) hiddenCols.push(key);
        saveHidden();
        render();
      }));
    }
    const btExp = content.querySelector('#btnExport');
    const expMenu = content.querySelector('#expMenu');
    if (btExp && expMenu) {
      btExp.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = expMenu.classList.toggle('open');
        if (open) setTimeout(() => document.addEventListener('click', () => expMenu.classList.remove('open'), { once: true }), 0);
      });
      expMenu.addEventListener('click', (e) => e.stopPropagation());
      content.querySelector('#expCsv').addEventListener('click', () => { expMenu.classList.remove('open'); exportStock(); });
      content.querySelector('#expPrint').addEventListener('click', () => { expMenu.classList.remove('open'); printStock(); });
    }
    content.querySelectorAll('[data-sort]').forEach((el) => el.addEventListener('click', () => {
      const k = el.dataset.sort;
      if (sortState.key === k) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      else { sortState.key = k; sortState.dir = 'asc'; }
      page = 0;
      render();
    }));
    content.querySelectorAll('.reg-filter').forEach((b) => b.addEventListener('click', () => {
      diffFilter = 'clean';
      page = 0;
      render();
    }));
    content.querySelectorAll('[data-clearf]').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.clearf === 'centre') skipCurrentCentre = null;
      page = 0;
      render();
    }));
    const btnClear = content.querySelector('#btnClear');
    if (btnClear) btnClear.addEventListener('click', () => { skipCurrentCentre = null; page = 0; render(); });
    const pgSize = content.querySelector('#pgSize');
    if (pgSize) pgSize.addEventListener('change', () => { pageSize = Number(pgSize.value) || 10; page = 0; render(); });
    content.querySelectorAll('.pg-btn').forEach((b) => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.pg === 'prev') page = Math.max(0, page - 1);
      else if (b.dataset.pg === 'next') page = Math.min(totalPages - 1, page + 1);
      else page = Number(b.dataset.pg);
      render();
    }));
    const wrap = content.querySelector('.table-wrap');
    const saved = sessionStorage.getItem(SCROLL_KEY);
    if (wrap && saved) {
      try { const p = JSON.parse(saved); wrap.scrollLeft = p.left || 0; wrap.scrollTop = p.top || 0; } catch (e) {}
    }
  }

  function bindSearch() {
    const sel = content.querySelector('#regCentre');
    if (!sel) return;
    const counts = {};
    state.entries.forEach((en) => { counts[String(en.centreId)] = (counts[String(en.centreId)] || 0) + 1; });
    const list = scopeCenters().slice();
    const byParent = {};
    list.forEach((c) => { (byParent[c.parentId || ''] = byParent[c.parentId || ''] || []).push(c); });
    byParent[''].sort((a,b)=>a.name.localeCompare(b.name));
    Object.values(byParent).forEach(arr => arr.sort((a,b)=>a.name.localeCompare(b.name)));
    const opts = ['<option value="">All Centres (all entries)</option>'];
    const walk = (node, depth=0) => {
      const prefix = depth>0 ? ' '.repeat(depth*2)+'- ' : '';
      const cnt = counts[String(node.id)]||0;
      opts.push(`<option value="${esc(node.id)}">${esc(prefix+node.name)}${cnt ? ` (${cnt})` : ''}</option>`);
      (byParent[node.id]||[]).forEach(n=>walk(n,depth+1));
    };
    (byParent['']||[]).forEach(n=>walk(n,0));
    sel.innerHTML = opts.join('');
    if (skipCurrentCentre) sel.value = String(skipCurrentCentre);
    sel.addEventListener('change', () => {
      skipCurrentCentre = sel.value ? sel.value : null;
      page = 0;
      render();
    });
  }

  content.addEventListener('scroll', () => {
    const wrap = content.querySelector('.table-wrap');
    if (!wrap) return;
    sessionStorage.setItem(SCROLL_KEY, JSON.stringify({ top: wrap.scrollTop, left: wrap.scrollLeft }));
  }, true);

  function unitOf(cid, item) {
    return (state.units[cid] && state.units[cid][item]) || '';
  }

  function renderRegRow(en, sno) {
    const d = Number(en.difference);
    const fmtDate = (s) => { if (!s) return '-'; const dt = new Date(s + (s.length === 10 ? 'T00:00:00' : '')); if (isNaN(dt)) return s; return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const centre = centerName(en.centreId);
    const unit = esc(en.unit || unitOf(en.centreId, en.item));
    const cell = {
      sno: `<td class="sno">${sno}</td>`,
      centre: `<td class="centre stick-1"><b>${esc(centre)}</b></td>`,
      item: `<td>${esc(en.item)}</td>`,
      approvalNo: `<td>${esc(en.approvalNo || '-')}</td>`,
      approvalDate: `<td>${fmtDate(en.approvalDate)}</td>`,
      qtyA: `<td class="num">${Number(en.qtyA)}${unit ? ' ' + unit : ''}</td>`,
      qtyB: `<td class="num">${Number(en.qtyB)}${unit ? ' ' + unit : ''}</td>`,
      difference: `<td class="diff num ${diffCls(d)}">${diffTxt(d)}</td>`,
      reason: `<td class="wrap">${esc(en.reason || '-')}</td>`,
      remarks: `<td class="wrap">${esc(en.remarks || '-')}</td>`,
      pageNo: `<td>${esc(en.pageNo || '-')}</td>`,
      actions: `<td class="col-sticky"><div class="row-actions">
          <button class="btn sm" data-reg="edit" data-id="${en.id}" title="Edit this entry">Edit</button>
          ${d !== 0 ? `<button class="btn sm" data-reg="apply" data-id="${en.id}" title="Write the physically counted quantity (B) into the book">Apply</button>` : ''}
          ${canDeleteReg ? `<button class="btn red sm" data-reg="del" data-id="${en.id}" title="Delete this entry">&times;</button>` : ''}
        </div></td>`
    };
    return `<tr data-id="${en.id}">${visibleCols().map((c) => cell[c.key]).join('')}</tr>`;
  }

  function centerName(id) {
    const c = state.centers.find((x) => x.id === id);
    return c ? c.name : id;
  }

  function openRegisterModal(entry) {
    const scoped = scopeCenters();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(680px,94vw);max-width:none">
        <div class="modal-head">
          <div>
            <h3>${entry ? 'Edit Verification Entry' : 'New Verification Entry'}</h3>
            <p class="hint">${entry ? 'Update this row of the paper-style verification register.' : 'Rows are appended to the paper-style register â€” enter the counted quantity as (B); the Difference is computed automatically.'}</p>
          </div>
          <button class="btn sm" id="rmCancel">Close</button>
        </div>
        <div class="modal-body">
          <div class="modal-sec">
            <div class="modal-sec-title">Entry</div>
            <div class="modal-grid">
              <div class="field">
                <label>Satsang Place (Centre) *</label>
                <select id="rm_centre">${scoped.map((c) => `<option value="${c.id}"${entry && Number(entry.centreId) === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
              </div>
              <div class="field">
                <label>Name of Item *</label>
                <select id="rm_item">${state.items.map((it) => `<option value="${esc(it)}"${entry && entry.item === it ? ' selected' : ''}>${esc(it)}</option>`).join('') || '<option value="">(no items yet)</option>'}</select>
              </div>
            </div>
          </div>
          <div class="modal-sec">
            <div class="modal-sec-title">Approval</div>
            <div class="modal-grid">
              <div class="field"><label>Approval Number</label><input id="rm_appr" placeholder="e.g. ARD/2026/001" value="${esc(entry ? entry.approvalNo || '' : '')}"></div>
              <div class="field"><label>Approval Date</label><input type="date" id="rm_adate" value="${esc(entry && entry.approvalDate ? entry.approvalDate.slice(0, 10) : new Date().toISOString().slice(0, 10))}"></div>
              <div class="field full"><label>Stock Register Page No.</label><input id="rm_page" placeholder="e.g. 12" value="${esc(entry ? entry.pageNo || '' : '')}"></div>
            </div>
          </div>
          <div class="modal-sec">
            <div class="modal-sec-title">Quantities</div>
            <div class="modal-grid">
              <div class="field"><label>Quantity as per Stock Register (A)</label><input type="number" id="rm_qtyA" min="0" value="${entry ? Number(entry.qtyA) : 0}" readonly></div>
              <div class="field"><label>Physically Available Quantity (B)</label><input type="number" id="rm_qtyB" min="0" value="${entry ? Number(entry.qtyB) : 0}"></div>
              <div class="field"><label>Unit</label><input id="rm_unit" placeholder="e.g. mtr, nos, KG" value="${esc(entry ? entry.unit || unitOf(entry.centreId, entry.item) : '')}"></div>
              <div class="field"><label>Difference (A âˆ’ B)</label><input type="text" id="rm_diff" readonly value="${entry ? diffTxt(Number(entry.difference)) : 0}"></div>
            </div>
          </div>
          <div class="modal-sec">
            <div class="modal-sec-title">Remarks</div>
            <div class="modal-grid">
              <div class="field full"><label>Reason for Difference</label><input id="rm_reason" placeholder="Only if there is any difference" value="${esc(entry ? entry.reason || '' : '')}"></div>
              <div class="field full"><label>Remarks</label><input id="rm_remarks" placeholder="Any remarks" value="${esc(entry ? entry.remarks || '' : '')}"></div>
            </div>
          </div>
        </div>
        <div class="m-actions">
          <button class="btn" id="rmCancel2">Cancel</button>
          <button class="btn primary" id="rmSave">${entry ? 'Save Changes' : 'Add Entry'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const n = (id) => overlay.querySelector('#' + id);
    const escTe = (id) => () => { try { return n(id).value.trim(); } catch (e) { return ''; } };
    const close = () => { document.body.removeChild(overlay); document.removeEventListener('keydown', escClose, true); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escClose, true);

    const syncA = () => {
      const cid = n('rm_centre').value; const it = n('rm_item').value;
      const cur = Number(state.stock[cid] ? state.stock[cid][it] || 0 : 0);
      n('rm_qtyA').value = entry ? Number(entry.qtyA) : cur;
      n('rm_unit').value = entry ? (entry.unit || unitOf(entry.centreId, entry.item)) : unitOf(cid, it);
      syncDiff();
    };
    const syncDiff = () => {
      const a = Number(n('rm_qtyA').value) || 0; const b = Number(n('rm_qtyB').value) || 0;
      n('rm_diff').value = diffTxt(a - b);
    };
    n('rm_centre').addEventListener('change', () => { if (!entry) syncA(); });
    n('rm_item').addEventListener('change', () => { if (!entry) syncA(); });
    n('rm_qtyB').addEventListener('input', syncDiff);

    const close2 = () => { const b = n('rmCancel2'); if (b) b.addEventListener('click', close); };
    n('rmCancel').addEventListener('click', close);
    n('rmCancel2').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
    void close2;

    n('rmSave').addEventListener('click', async () => {
      const cid = n('rm_centre').value;
      const it = n('rm_item').value;
      if (!cid || !it) return toast('Select a centre and an item', true);
      const qtyB = Math.max(0, Number(n('rm_qtyB').value) || 0);
      const qtyA = entry ? Number(entry.qtyA) : (Number(state.stock[cid] ? state.stock[cid][it] || 0 : 0));
      const fields = {
        centreId: cid,
        item: it,
        pageNo: escTe('rm_page')(),
        approvalNo: escTe('rm_appr')(),
        approvalDate: n('rm_adate').value || null,
        qtyA,
        qtyB,
        unit: escTe('rm_unit')(),
        reason: escTe('rm_reason')(),
        remarks: escTe('rm_remarks')()
      };
      n('rmSave').disabled = true;
      try {
        if (entry) await updateStockRegisterEntry(entry.id, fields);
        else await createStockRegisterEntry(fields);
        let applied = false;
        if (fields.approvalNo && fields.approvalDate) {
          try {
            await updateStock(cid, { [it]: qtyB }, { [it]: fields.unit });
            applied = true;
          } catch (err) { toast('Book figure update failed: ' + err.message, true); }
        }
        toast(applied ? 'Entry saved and centre book figure updated to ' + qtyB : (entry ? 'Entry updated' : 'Verification entry added'));
        close();
        load();
      } catch (err) { n('rmSave').disabled = false; toast(err.message, true); }
    });
    setTimeout(() => { try { (entry ? n('rm_qtyB') : n('rm_centre')).focus(); } catch (e) {} }, 80);
    syncA();
  }

  content.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-reg]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const en = state.entries.find((x) => Number(x.id) === id);
    if (!en) return;
    if (btn.dataset.reg === 'edit') { openRegisterModal(en); return; }
    if (btn.dataset.reg === 'del' && canDeleteReg) {
      if (!confirm('Delete this verification entry for ' + centerName(en.centreId) + ' â€” ' + en.item + '?')) return;
      deleteStockRegisterEntry(id).then(() => { toast('Entry deleted'); load(); }).catch((err) => toast(err.message, true));
      return;
    }
    if (btn.dataset.reg === 'apply') {
      if (!confirm('Set the book figure for ' + centerName(en.centreId) + ' â€” ' + en.item + ' to the physically counted quantity ' + en.qtyB + '?')) return;
      btn.disabled = true;
      updateStock(en.centreId, { [en.item]: Number(en.qtyB) }, { [en.item]: en.unit || unitOf(en.centreId, en.item) }).then(() => { toast('Book figure updated to ' + en.qtyB); load(); }).catch((err) => { btn.disabled = false; toast(err.message, true); });
    }
  });

  function exportStock() {
    try {
      const csvCell = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const ids = scopeIds();
      const rows = state.entries
        .filter((en) => ids.has(String(en.centreId)))
        .filter((en) => (skipCurrentCentre ? String(en.centreId) === String(skipCurrentCentre) : true))
        .filter((en) => (diffFilter === 'diff' ? Number(en.difference) !== 0 : (diffFilter === 'clean' ? Number(en.difference) === 0 : true)))
        .map((en) => {
          const fmtDate = (s) => { if (!s) return ''; const dt = new Date(s + (s.length === 10 ? 'T00:00:00' : '')); return isNaN(dt) ? s : dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
          return [centerName(en.centreId), en.item, en.approvalNo || '', fmtDate(en.approvalDate), Number(en.qtyA), Number(en.qtyB), en.unit || unitOf(en.centreId, en.item), Number(en.difference), en.reason || '', en.remarks || '', en.pageNo || ''];
        });
      const header = ['S.No', 'Satsang Place', 'Name of Item', 'Approval Number', 'Approval Date', 'Quantity as per Stock Register (A)', 'Physically Available Quantity (B)', 'Unit', 'Difference (if any) (Aâˆ’B)', 'Reason for Difference', 'Remarks', 'Stock Register Page No.'];
      const csv = [header.map((h) => csvCell(h)).join(',')].concat(rows.map((r, i) => [i + 1].concat(r).map(csvCell).join(','))).join('\r\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'stock-verification-register.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Register exported as CSV');
    } catch (err) {
      toast('Export failed: ' + (err.message || err), true);
    }
  }

  function printStock() {
    try {
      const ids = scopeIds();
      const allShown = state.entries
        .filter((en) => ids.has(String(en.centreId)))
        .filter((en) => (skipCurrentCentre ? String(en.centreId) === String(skipCurrentCentre) : true))
        .filter((en) => (diffFilter === 'diff' ? Number(en.difference) !== 0 : (diffFilter === 'clean' ? Number(en.difference) === 0 : true)));
      const tbody = content.querySelector('.reg-table tbody');
      if (tbody && allShown.length) {
        const rows = [...allShown].reverse().map((en, i) => renderRegRow(en, i + 1)).join('');
        tbody.innerHTML = rows;
      }
      window.print();
    } catch (err) {
      toast('Print failed: ' + (err.message || err), true);
    }
  }

  function openItemsManager(focus) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(720px,94vw);max-width:none">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">Manage Stock Items</h3>
          <button class="btn sm" id="imClose">Close</button>
        </div>
        <div class="items-add" style="margin-top:14px">
          <input id="im_name" placeholder="Item name" maxlength="200">
          <input id="im_desc" placeholder="Description (optional)">
          <input id="im_cat" placeholder="Category (optional)">
          <button class="btn primary sm" id="im_add">Add Item</button>
        </div>
        <p class="hint" style="margin:8px 0 4px">Renaming an item updates it in every centre's stock register; deleting removes its stock rows from all centres.</p>
        <div id="imList" style="margin-top:10px;max-height:52vh;overflow:auto"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    if (focus === 'add') setTimeout(() => { try { overlay.querySelector('#im_name').focus(); } catch (e) {} }, 80);

    let rows = [];
    const listEl = overlay.querySelector('#imList');
    const n = (id) => overlay.querySelector('#' + id);
    const close = () => { document.body.removeChild(overlay); document.removeEventListener('keydown', escClose, true); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escClose, true);
    n('imClose').addEventListener('click', close);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

    function render() {
      if (!rows.length) {
        listEl.innerHTML = '<div class="card hint" style="padding:16px;text-align:center">No items yet â€” add the first one above.</div>';
        return;
      }
      listEl.innerHTML = rows.map((r, i) => r.editing ? `
        <div class="item-row">
          <div class="item-edit">
            <input id="row_name_${r.id}" value="${esc(r.name)}" maxlength="200" placeholder="Item name">
            <input id="row_desc_${r.id}" value="${esc(r.description || '')}" placeholder="Description (optional)">
            <input id="row_cat_${r.id}" value="${esc(r.category || '')}" placeholder="Category (optional)">
          </div>
          <div class="item-actions">
            <button class="btn primary sm" data-act="save" data-id="${r.id}">Save</button>
            <button class="btn sm" data-act="cancel">Cancel</button>
          </div>
        </div>` : `
        <div class="item-row">
          <div style="flex:1">
            <b>${esc(r.name)}</b>
            <div class="meta">${esc(r.description || '')}${(r.category ? ' Â· ' + esc(r.category) : (r.description ? '' : 'No description'))}</div>
          </div>
          <div class="item-actions">
            <button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button>
            <button class="btn red sm" data-act="del" data-id="${r.id}" data-name="${esc(r.name)}">Delete</button>
          </div>
        </div>`).join('');
    }

    async function loadRows() {
      try {
        rows = await fetchItemsFull();
        render();
      } catch (err) { toast(err.message, true); }
    }

    n('im_add').addEventListener('click', async () => {
      const name = n('im_name').value.trim();
      if (!name) return toast('Item name is required', true);
      try {
        await createStockItem({ name, description: n('im_desc').value, category: n('im_cat').value });
        n('im_name').value = ''; n('im_desc').value = ''; n('im_cat').value = '';
        toast('Item added: ' + name);
        load();
        await loadRows();
      } catch (err) { toast(err.message, true); }
    });

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      const row = rows.find((r) => Number(r.id) === Number(btn.dataset.id));
    if (act === 'edit') {
        rows.forEach((r) => { r.editing = false; });
        if (row) row.editing = true;
        render();
      } else if (act === 'cancel') {
        rows.forEach((r) => { r.editing = false; });
        render();
      } else if (act === 'save' && row) {
        const nameEl = overlay.querySelector('#row_name_' + row.id);
        const name = (nameEl ? nameEl.value : '').trim();
        if (!name) return toast('Item name is required', true);
        btn.disabled = true;
        try {
          await updateItemRecord(row.id, {
            name,
            description: overlay.querySelector('#row_desc_' + row.id).value,
            category: overlay.querySelector('#row_cat_' + row.id).value
          }, row.name);
          toast('Item updated: ' + name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      } else if (act === 'del' && row) {
        if (!confirm('Delete item "' + row.name + '" and remove its stock from every centre? This cannot be undone.')) return;
        btn.disabled = true;
        try {
          await deleteStockItem(row.id, row.name);
          toast('Item deleted: ' + row.name);
          load();
          await loadRows();
        } catch (err) { btn.disabled = false; toast(err.message, true); }
      }
    });

    loadRows().catch((err) => toast(err.message, true));
  }

  load().catch((err) => toast(err.message, true));
}

  /* ----- Shared masters table helpers (Phase 4) ----- */
  function buildHead(headId, cols, state, onSort) {
    const el = document.getElementById(headId);
    if (!el) return;
    el.innerHTML = '<tr>' + cols.map((c) => {
      const label = esc(c.label);
      if (!c.sortable) return '<th class="' + (c.cls || '') + '"><span class="th-label">' + label + '</span></th>';
      const active = state.key === c.key;
      const ic = active ? (state.dir === 'asc' ? '&#9650;' : '&#9660;') : '&#8645;';
      return '<th class="' + (c.cls || '') + '"><span class="th-label" data-sort="' + c.key + '">' + label + '<span class="sort-ic' + (active ? ' active' : '') + '">' + ic + '</span></span></th>';
    }).join('') + '</tr>';
    el.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.sort;
      if (state.key === k) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
      else { state.key = k; state.dir = 'asc'; }
      onSort();
    }));
  }
  function sortList(list, state, getVal) {
    if (!state.key) return list;
    const dir = state.dir === 'asc' ? 1 : -1;
    return list.slice().sort((a, b) => {
      const va = String(getVal(a, state.key) == null ? '' : getVal(a, state.key)).toLowerCase();
      const vb = String(getVal(b, state.key) == null ? '' : getVal(b, state.key)).toLowerCase();
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  function renderItemPagination(totalPages, n) {
    const pg = q('maPagination');
    if (!pg) return;
    if (!n) { pg.innerHTML = ''; return; }
    const win = [];
    for (let p = 0; p < totalPages; p++) {
      if (totalPages <= 7 || p === 0 || p === totalPages - 1 || Math.abs(p - itemPage) <= 1) win.push(p);
      else if (win[win.length - 1] !== -1) win.push(-1);
    }
    pg.innerHTML = `
      <span class="pg-info">${itemPage * itemPageSize + 1}â€“${Math.min(n, (itemPage + 1) * itemPageSize)} of ${n}</span>
      <button class="pg-btn" data-mpg="prev"${itemPage === 0 ? ' disabled' : ''}>â€¹ Prev</button>
      ${win.map((p) => p === -1 ? '<span class="pg-btn" style="border:none;background:none;cursor:default">â€¦</span>' : `<button class="pg-btn${p === itemPage ? ' active' : ''}" data-mpg="${p}">${p + 1}</button>`).join('')}
      <button class="pg-btn" data-mpg="next"${itemPage >= totalPages - 1 ? ' disabled' : ''}>Next â€º</button>`;
    pg.querySelectorAll('.pg-btn').forEach((b) => b.addEventListener('click', () => {
      if (b.disabled) return;
      if (b.dataset.mpg === 'prev') itemPage = Math.max(0, itemPage - 1);
      else if (b.dataset.mpg === 'next') itemPage = Math.min(totalPages - 1, itemPage + 1);
      else itemPage = Number(b.dataset.mpg);
      renderItemRows();
    }));

  function renderItemRows() {

  function exportItems() {
    try {
      const csvCell = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const rows = filteredItems().map((r) => [r.code || 'ITM-###', r.name || '', r.standardName || '', r.description || '', r.category || '', r.subcategory || '', r.classification || 'unclassified', r.is_sensitive ? 'Yes' : 'No', r.asset_tag || '', r.serial_no || '', r.location || '', r.custodian || '', r.acquisition_value != null && r.acquisition_value !== '' ? String(r.acquisition_value) : '', r.condition || '', r.unit || '', r.brand || '', r.model || '', r.status || 'Active', r.createdAt ? String(r.createdAt).slice(0, 10) : '']);
      const header = ['Code', 'Item Name', 'Standard Name', 'Description', 'Category', 'Subcategory', 'Classification', 'Sensitive', 'Asset Tag', 'Serial No.', 'Location', 'Custodian', 'Acq. Value', 'Condition', 'Unit', 'Brand', 'Model', 'Status', 'Created Date'];
      const csv = [header.map(csvCell).join(',')].concat(rows.map((r) => r.map(csvCell).join(','))).join('\r\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'items-master.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Items exported as CSV');
    } catch (err) {
      toast('Export failed: ' + (err.message || err), true);
    }
  }

          <div class="doc-row-actions">

            </label>
            ${d.document ? `<a class="file-link" href="${storageFileUrl(d.document)}" target="_blank" title="${esc(d.documentName || '')}">View PDF</a>` : ''}
          </div>
        </td>
        ${isAdmin() ? `<td class="col-sticky"><button class="btn red sm" data-act="deldoc" data-id="${d.id}">Delete</button></td>` : ''}
      </tr>`).join('');
  }

  function loadDocs() {
    return fetchDocuments().then((rows) => { docs = rows; renderDocHead(); renderDocRows(); });
  }

  const maAddDoc = q('maAddDoc');
  if (maAddDoc) maAddDoc.addEventListener('click', () => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="width:min(440px,94vw);max-width:none">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h3 style="margin:0">Add Document</h3>
          <button class="btn sm" id="adClose">Close</button>
        </div>
        <div style="margin-top:14px;display:grid;gap:10px">
          <input id="adName" placeholder="Document name (e.g. SCI55)" maxlength="100" autocomplete="off">
          <input id="adDesc" placeholder="Description (optional)" maxlength="255" autocomplete="off">
          <button class="btn primary" id="adSave">+ Create Document</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('#adClose').addEventListener('click', close);
    overlay.querySelector('#adSave').addEventListener('click', () => {
      const name = overlay.querySelector('#adName').value.trim();
      if (!name) return toast('Document name is required', true);
      const btn = overlay.querySelector('#adSave');
      btn.disabled = true;
      createDocumentRecord({ name, description: overlay.querySelector('#adDesc').value })
        .then(() => { toast('Document added'); close(); loadDocs(); })
        .catch((err) => { btn.disabled = false; toast(err.message, true); });
    });
    setTimeout(() => { const el = overlay.querySelector('#adName'); if (el) el.focus(); }, 60);
  });

  docList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act="savedoc"], [data-act="deldoc"]');
    if (!btn) return;
    const id = btn.dataset.id;
    const d = docs.find((x) => String(x.id) === id);
    if (!d) return;
    if (btn.dataset.act === 'savedoc') {
      const val = document.getElementById('docNo_' + id).value.trim();
      updateDocumentRecord(id, { docNo: val })
        .then(() => { toast('Document number saved'); d.docNo = val; })
        .catch((err) => toast(err.message, true));
    } else if (btn.dataset.act === 'deldoc') {
      if (!confirm('Delete document "' + d.name + '"?')) return;
      deleteDocumentRecord(id)
        .then(() => { toast('Document deleted'); loadDocs(); })
        .catch((err) => toast(err.message, true));
    }
  });

  docList.addEventListener('change', (e) => {
    const input = e.target;
    if (!input.matches('[data-act="upload"]')) return;
    const file = input.files[0];
    if (!file) return;
    if (file.size > 200 * 1024 || !/\.pdf$/i.test(file.name)) return toast('Choose a PDF no larger than 200 KB', true);
    const id = input.dataset.id;
    const path = 'docs/' + Date.now() + '_' + file.name;
    sb.storage.from('uploads').upload(path, file, { contentType: 'application/pdf', cacheControl: '3600', upsert: false })
      .then(async ({ error: upErr }) => {
        if (upErr) throw new Error('PDF upload failed: ' + upErr.message);
        const old = (docs.find((x) => String(x.id) === id) || {}).document;
        await updateDocumentRecord(id, { document: path, documentName: file.name });
        if (old) { try { await sb.storage.from('uploads').remove([old]); } catch (e) {} }
        toast('PDF uploaded');
        loadDocs();
      })
      .catch((err) => toast(err.message, true));
  });

  loadDocs().catch((err) => toast(err.message, true));
}

function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => window.JSZip ? resolve(window.JSZip) : reject(new Error('Could not start the .docx reader'));
    s.onerror = () => reject(new Error('Could not load the .docx reader â€” check your internet connection'));
    document.head.appendChild(s);
  });
}

const SCI_DETECT = [
  ['SCI45', /condemn/i],
  ['SCI43', /transfer\s+of\s+surplus|surplus\s+items?\s+from/i],
  ['SCI34', /sale\s+proceeds|scrap/i],
  ['SCI15', /donation|offer\s+of\s+items?/i],
  ['SCI76', /issue\s+voucher|material\s+issue/i],
  ['SCI53', /from\s+beas|requirement\s+of\s+items?/i]
];

async function parseFilledDocx(file) {
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(file);
  const entry = zip.file('word/document.xml');
  if (!entry) throw new Error('This does not look like a Word (.docx) file');
  const xml = await entry.async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Could not read the Word document');
  const cellText = (tc) => Array.from(tc.getElementsByTagName('w:t')).map((t) => t.textContent || '').join('').trim();
  const rowCells = (tr) => Array.from(tr.getElementsByTagName('w:tc')).map(cellText);
  const tables = Array.from(doc.getElementsByTagName('w:tbl')).map((tbl) => Array.from(tbl.getElementsByTagName('w:tr')).map(rowCells));
  const paras = Array.from(doc.getElementsByTagName('w:p')).map((p) => Array.from(p.getElementsByTagName('w:t')).map((t) => t.textContent || '').join('').trim()).filter(Boolean);
  const text = paras.join('\n');

  let code = '';
  const hay = (file.name || '') + '\n' + text;
  for (const [c, re] of SCI_DETECT) { if (re.test(hay)) { code = c; break; } }

  const qtyHead = /^(total\s+)?(qty|quantity|nos?\.?|numbers?|units?)\b/i;
  const nameHead = /(description|particulars|name\s+of|item\s*name|article|material\s*desc)/i;
  const unitHead = /^unit/i;
  const items = [];
  for (const rows of tables) {
    let header = -1, ni = -1, qi = -1, ui = -1;
    for (let r = 0; r < rows.length; r++) {
      const cells = rows[r];
      const qi2 = cells.findIndex((c) => qtyHead.test(c));
      const ni2 = cells.findIndex((c) => nameHead.test(c));
      if (qi2 > -1 && ni2 > -1) { header = r; qi = qi2; ni = ni2; ui = cells.findIndex((c) => unitHead.test(c)); break; }
    }
    if (header < 0) continue;
    for (let r = header + 1; r < rows.length; r++) {
      const cells = rows[r];
      if (cells.length <= Math.max(ni, qi)) continue;
      const name = (cells[ni] || '').replace(/\s+/g, ' ').trim();
      if (!name || name.length > 140) continue;
      if (/^(total|sub\s*total|grand\s*total|sum)\b/i.test(name)) continue;
      if (qtyHead.test(name) || nameHead.test(name)) continue;
      const qm = (cells[qi] || '').match(/\d+/);
      const qty = qm ? Number(qm[0]) : 0;
      if (!qty) continue;
      const unit = ui > -1 && cells[ui] ? cells[ui].replace(/\s+/g, ' ').trim() : '';
      items.push({ name, qty, unit });
    }
  }

  let sewadar = '';
  const sm = text.match(/sewadar(?:'s)?\s*name\s*[:.\-]?\s*([^\n]{2,80})/i);
  if (sm) sewadar = sm[1].replace(/\s*[,;|].*$/, '').trim();
  let badge = '';
  const bm = text.match(/badge(?:\s*(?:no|number|#))?\s*[:.\-]?\s*([A-Za-z0-9]{12})\b/i);
  if (bm) badge = bm[1].toUpperCase();

  return { code, items, sewadar, badge };
}

          <button class="btn primary" id="suSave" type="button">Submit for Review</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let stockData = null;
  let centres = [];
  const n = (id) => overlay.querySelector('#' + id);

  document.addEventListener('keydown', escUp, true);
  n('suClose').addEventListener('click', close);
  n('suCancel').addEventListener('click', close);
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

  const centreIdNow = () => {
    if (isCentre) return me.centreId != null ? me.centreId : (typeof me.id === 'number' ? me.id : null);
    const v = n('suCentre') ? n('suCentre').value : '';
    return v ? Number(v) : null;
  };

  function stockCanon(centreId, name) {
    if (!centreId || !name || !stockData) return null;
    const bag = stockData.stock[centreId] || {};
    const t = normItemName(name);
    if (!t) return null;
    return Object.keys(bag).find((k) => normItemName(k) === t) || null;
  }

  function refreshDatalist() {
    const dl = n('suItemNames');
    if (!dl) return;
    const set = new Set(stockData ? stockData.items || [] : []);
    const bag = centreIdNow() && stockData ? stockData.stock[centreIdNow()] || {} : {};
    Object.keys(bag).forEach((k) => set.add(k));
    dl.innerHTML = Array.from(set).sort().map((v) => `<option value="${esc(v)}"></option>`).join('');

      <div class="cell">

  }

  function syncRowHint(row) {
    const nameEl = row.querySelector('.sci-item-name');
    const hint = row.querySelector('.su-hint');
    const unitEl = row.querySelector('.sci-item-unit');
    const cid = centreIdNow();
    const canon = stockCanon(cid, nameEl.value);
    if (canon && stockData) {
      const q = (stockData.stock[cid] || {})[canon];
      const u = (stockData.unit[cid] || {})[canon] || '';

      if (!unitEl.value && u) unitEl.value = u;

  itemsEl.addEventListener('change', (e) => {

  n('suAddRow').addEventListener('click', () => { const r = addRow(); r.querySelector('.sci-item-name').focus(); });

  const typeSel = n('suType');
  const syncType = () => {
    const t = typeSel.value;

  syncType();

  Promise.all([

    const type = n('suType');

    refreshDatalist();
  });

  await (async () => {
    let parsed = { code: '', items: [], sewadar: '', badge: '' };
    try { parsed = await parseFilledDocx(file); }
    catch (err) { toast(err.message, true); }
    const detected = parsed.code;

      typeSel.value = detected;
      syncType();
      const note = n('suClose').closest('.modal-head').querySelector('.hint');
      if (note) note.innerHTML = esc(note.textContent) + ` <b style="color:var(--amber,#b8860b)">Detected form type ${esc(detected)} â€” different from this page (${esc(expectedCode)}). Please verify.</b>`;
    }
    if (parsed.sewadar) n('suSewadar').value = parsed.sewadar.slice(0, 120);
    if (parsed.badge) n('suBadge').value = parsed.badge;

    if (parsed.items && parsed.items.length) {
