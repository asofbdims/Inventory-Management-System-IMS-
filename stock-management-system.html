<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Management System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F5D50'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4;
  --surface:#FFFFFF;
  --primary:#1F5D50;
  --primary-dark:#153F37;
  --primary-tint:#E7F0EC;
  --accent:#B4892F;
  --accent-tint:#FBF3E1;
  --line:#E1E6E3;
  --muted:#66756F;
  --text:#17211D;
  --green:#1E8E5A; --green-bg:#E6F4EC;
  --amber:#B7791F; --amber-bg:#FFF3DC;
  --red:#C0392B; --red-bg:#FDEAE8;
  --navy:#1F3A5F; --navy-bg:#E7ECF3;
  --azure:#2E6DA4; --azure-bg:#E7F0F8;
  --sky:#3F8FB0; --sky-bg:#E9F5F9;
  --radius:10px;
  --shadow:0 1px 2px rgba(23,33,29,.06), 0 6px 20px -8px rgba(23,33,29,.10);
  --sidebar-bg:#F8F8F8;
  --sidebar-border:#DDDFEB;
  --sidebar-text:#444444;
  --sidebar-muted:#858796;
  --sidebar-hover:#EAF2EF;
  --sidebar-active:#E7F0EC;
  --sidebar-active-text:#153F37;
  --brand-bar:#E8E8E8;
  --thead:#FFFFFF;
  --input-border:#D1D5DB;
  --chip-bg:#F7F8FC;
  --chip-border:#ECECEE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3{font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:600;margin:0;color:var(--primary-dark)}
a{color:var(--primary);text-decoration:none}
input,select,button{font-family:inherit;font-size:13.5px}
.mono{font-family:'JetBrains Mono',monospace}

/* ---------- App shell (sidebar) ---------- */
#app{min-height:100vh}
.shell{display:flex;min-height:100vh;background:var(--bg)}
.sidebar{
  width:262px;flex:0 0 auto;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--sidebar-border);transition:width .18s ease;
}
.side-brand{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:22px 16px 16px;background:var(--brand-bar);border-bottom:4px solid var(--primary)}
.side-brand .mark{width:46px;height:46px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:21px}
.side-brand b{display:block;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#111;letter-spacing:.06em;text-transform:uppercase}
.side-brand small{display:block;color:var(--sidebar-muted);font-size:11px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;margin-top:1px}
.side-brand .brand-period{margin-top:7px;color:var(--sidebar-text);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.side-toggle{position:absolute;right:-19px;top:50%;transform:translateY(-50%);z-index:60;width:38px;height:38px;border-radius:50%;background:#eee;border:1px solid var(--sidebar-border);color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.side-toggle:hover{background:var(--sidebar-hover)}
.side-toggle svg{width:19px;height:19px;transition:transform .18s}
.shell.mini .side-toggle svg{transform:rotate(180deg)}
.side-nav{flex:1;overflow:auto;padding:12px 12px 16px}
.nav-group{margin-bottom:14px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--sidebar-muted);text-transform:uppercase;padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;color:var(--sidebar-text);padding:10px 12px;border-radius:8px;font-size:14.5px;font-weight:500;margin-bottom:1px;transition:background .15s,color .15s}
.nav-item svg{width:20px;height:20px;flex:0 0 auto}
.nav-item:hover{background:var(--sidebar-hover);color:#111}
.nav-item.active{background:var(--sidebar-active);color:var(--sidebar-active-text);font-weight:600}
.nav-drop{margin-bottom:1px}
.nav-parent{display:flex;align-items:center;gap:11px;color:var(--sidebar-text);width:100%;background:none;border:none;padding:10px 12px;border-radius:8px;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s;font-family:inherit}
.nav-parent svg{width:20px;height:20px;flex:0 0 auto}
.nav-parent:hover{background:var(--sidebar-hover);color:#111}
.nav-parent.active{background:var(--sidebar-active);color:var(--sidebar-active-text);font-weight:600}
.nav-parent .nav-chev{margin-left:auto;width:15px;height:15px;color:var(--sidebar-muted);transition:transform .18s}
.nav-parent.open .nav-chev{transform:rotate(180deg)}
.nav-sub{max-height:0;overflow:hidden;transition:max-height .2s ease}
.nav-sub.open{max-height:360px}
.nav-sub-item{display:flex;align-items:center;gap:11px;color:var(--sidebar-text);padding:9px 12px 9px 30px;border-radius:8px;font-size:13.5px;font-weight:500;margin-bottom:1px;text-decoration:none;opacity:.85}
.nav-sub-item svg{width:17px;height:17px;flex:0 0 auto}
.nav-sub-item:hover{background:var(--sidebar-hover);color:#111;opacity:1}
.nav-sub-item.active{background:var(--sidebar-active);color:var(--sidebar-active-text);font-weight:600;opacity:1}
.nav-drop2{margin-bottom:1px}
.nav-drop2 .nav-parent{padding:9px 12px 9px 22px;font-size:13.5px}
.nav-drop2 .nav-parent .nav-chev{width:14px;height:14px}
.nav-drop2 .nav-sub-item{padding-left:42px;font-size:13px}
.nav-sub2{max-height:0;overflow:hidden;transition:max-height .2s ease}
.nav-sub2.open{max-height:280px}
.shell.mini .sidebar{width:78px}
.shell.mini .side-brand{padding:18px 6px 14px}
.shell.mini .side-brand > b,.shell.mini .side-brand small,.shell.mini .brand-period{display:none}
.shell.mini .nav-label{display:none}
.shell.mini .nav-item,.shell.mini .nav-parent{justify-content:center;padding:11px 0}
.shell.mini .nav-item span,.shell.mini .nav-parent span,.shell.mini .nav-sub-item span{display:none}
.shell.mini .nav-parent .nav-chev{display:none}
.shell.mini .nav-sub-item{justify-content:center;padding:10px 0}
.shell.mini .nav-sub.open,.shell.mini .nav-sub2.open{max-height:320px}
.shell .main{flex:1;min-width:0;display:flex;flex-direction:column}
.tophead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--sidebar-border);background:var(--surface);position:sticky;top:0;z-index:40}
.page-title{font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:600;margin:0;color:#111}
.tophead-right{display:flex;align-items:center;gap:12px}
.period-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:100px}
.period-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.user-menu{position:relative}
.user-btn{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--sidebar-text);cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;min-height:40px}
.user-btn:hover{background:var(--sidebar-hover)}
.user-btn .u-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
.user-btn .u-chev{width:16px;height:16px;color:var(--sidebar-muted)}
.user-drop{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:70;display:none}
.user-drop.open{display:block}
.user-drop .ud-head{padding:9px 12px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.user-drop .ud-head b{display:block;font-size:13.5px;color:var(--text)}
.user-drop .ud-head span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.user-drop .ud-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--text);text-align:left;font-family:inherit}
.user-drop .ud-item:hover{background:var(--bg)}
.user-drop .ud-item.red{color:var(--red)}
.user-drop .ud-item svg{width:16px;height:16px}
main#content{max-width:1340px;margin:0 auto;padding:24px 24px 60px;width:100%}
@media(max-width:980px){
  .sidebar{width:72px}
  .side-brand{justify-content:center;padding:16px 6px 12px}
  .side-brand > b,.side-brand small,.brand-period{display:none}
  .side-toggle{display:none}
  .nav-label{display:none}
  .nav-item{justify-content:center;padding:10px 0}
  .nav-item span,.nav-parent span,.nav-sub-item span{display:none}
  .nav-parent{padding:10px 0;justify-content:center}
  .nav-parent .nav-chev{display:none}
  .nav-sub.open{max-height:200px}
  .nav-sub-item{justify-content:center;padding:8px 0}
}
.item-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.item-row .meta{font-size:12px;color:var(--muted)}
.items-add{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px}
@media(max-width:640px){.items-add{grid-template-columns:1fr}}
.item-edit{flex:1;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}
@media(max-width:640px){.item-edit{grid-template-columns:1fr}}
.item-actions{display:flex;gap:6px}
.sr-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:auto}
@media(max-width:720px){.sr-actions{justify-content:flex-start}}
.sr-actions .btn{font-size:12.5px;padding:8px 14px;box-shadow:var(--shadow);white-space:nowrap}
.sr-actions .btn:hover{transform:translateY(-1px)}

/* ---------- Dashboard module cards (SRS style) ---------- */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:22px}
.mod-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s,border-color .12s}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(23,33,29,.28);border-color:var(--primary)}
.mod-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.mod-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mod-icon svg{width:22px;height:22px}
.mod-icon.a{background:var(--green-bg);color:var(--green)}
.mod-icon.b{background:var(--navy-bg);color:var(--navy)}
.mod-icon.c{background:var(--amber-bg);color:var(--amber)}
.mod-icon.d{background:var(--azure-bg);color:var(--azure)}
.mod-title{font-size:15px;font-weight:600;color:var(--text);margin:0}
.mod-desc{color:var(--muted);font-size:12px;margin:0 0 14px}
.mod-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.mod-stat{background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.mod-stat b{color:var(--primary-dark)}
.mod-stat.warn b{color:var(--red)}
.mod-go{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--primary)}
.dash-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dash-tab{padding:8px 18px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.dash-tab:hover{border-color:var(--primary);color:var(--primary)}
.dash-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.dash-tab-count{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.06);padding:16px 18px;min-width:0;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s}
.kpi:hover{border-color:var(--primary);box-shadow:0 4px 14px -6px rgba(23,93,80,.28)}
.kpi.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.kpi.active .kpi-label{color:var(--primary)}
.kpi-label{margin:0 0 6px;font-size:12.5px;font-weight:500;color:#6b7280}
.kpi-value{margin:0;font-size:26px;font-weight:700;line-height:1.2;color:#1f2937}
.kpi-value small{font-size:13px;font-weight:600;color:var(--muted)}

/* ---------- Login ---------- */
body.login-page{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%, rgba(180,137,47,.10), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(31,93,80,.14), transparent 45%),
    var(--bg);
  padding:20px;
}
.login-card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:34px 32px;width:100%;
}
.login-card .logo{
  width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;
  font-size:20px;font-weight:700;margin-bottom:14px;
}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.login-card label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin:12px 0 5px}
.login-card input,.login-card select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none;
  transition:border-color .15s;background:#fff;
}
.login-card input:focus,.login-card select:focus{border-color:var(--primary)}
.login-card button[type=submit]{
  margin-top:18px;width:100%;padding:11px;border:none;border-radius:8px;background:var(--primary);
  color:#fff;font-weight:600;cursor:pointer;transition:background .15s;
}
.login-card button[type=submit]:hover{background:var(--primary-dark)}
.login-err{display:none;margin-top:12px;background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:7px;font-size:12.5px}
.login-card .hint{color:var(--muted);font-size:11.5px;margin-top:16px;text-align:center;line-height:1.5}

/* ---------- Cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.big-num{font-family:'Inter',system-ui,sans-serif;font-size:32px;font-weight:700;color:var(--primary-dark)}
.grid{display:grid;gap:14px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.cols-3{grid-template-columns:1fr 1fr}.grid.cols-4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}}
.stat-link{display:block}
.stat{border-radius:var(--radius);padding:16px 18px}
.stat b{display:block;font-family:'Inter',sans-serif;font-size:26px;font-weight:700}

.logo-banner{
  background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.logo-banner h2{color:#111;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.logo-banner p{margin:4px 0 0;color:var(--muted);font-size:13px}
.logo-banner .stat{background:var(--primary-tint);color:var(--primary-dark);border-radius:12px;padding:12px 18px;text-align:center}
.logo-banner .stat b{color:var(--primary-dark);font-size:26px}
.logo-banner .stat span{color:var(--muted);font-size:12px}


/* ---------- Badges ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.badge.navy{background:var(--navy-bg);color:var(--navy)}
.badge.azure{background:var(--azure-bg);color:var(--azure)}
.badge.sky{background:var(--sky-bg);color:var(--sky)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}

/* ---------- Org tree cards (dashboard signature element) ---------- */
.card-link{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.card-link:hover{transform:translateY(-1px);box-shadow:0 4px 16px -6px rgba(23,33,29,.22);border-color:var(--primary)}
.card-compact{padding:12px 14px;margin-bottom:8px}
.center-name{font-weight:600;font-size:13.5px}
.mini-meta{color:var(--muted);font-size:11px}
.card.t-centre{border-left:3px solid var(--navy)}
.card.t-sub{border-left:3px solid var(--azure)}
.card.t-point{border-left:3px solid var(--sky)}
.card.t-admin{border-left:3px solid var(--accent)}
.card-found{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Search ---------- */
.center-search{margin-bottom:18px}
.cs-wrap{position:relative;max-width:340px}
.cs-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff}
.cs-input:focus{border-color:var(--primary)}
.cs-drop{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:30;display:none;
}
.cs-drop.open{display:block}
.cs-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.cs-item:hover{background:var(--primary-tint)}
.cs-empty{padding:10px 12px;color:var(--muted);font-size:12.5px}

/* ---------- Tables ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  position:sticky;top:0;background:var(--primary-tint);color:var(--primary-dark);text-align:left;
  padding:10px 12px;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:1px solid var(--line);white-space:nowrap;z-index:5;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.row-highlight td{background:var(--accent-tint)}
tr.row-flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:var(--accent-tint)}100%{background:transparent}}
td.empty,tr td.empty{color:var(--muted);text-align:center;padding:26px;white-space:normal}
.stock-table .stick-1{border-right:1px solid var(--line)}
.stock-table th.stick-1{background:var(--primary-tint)}
.stock-table .stick-2{border-right:1px solid var(--line)}
.stock-table th.stick-2{background:var(--primary-tint)}
.qty-cell{text-align:center}
.qty-btn{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--primary);font-weight:700;line-height:1;
}
.qty-btn:hover{background:var(--primary-tint)}
.qty-val{display:inline-block;min-width:34px;text-align:center;font-weight:600}
.file-link{font-size:12px;font-weight:600}

/* ---------- Dashboard tiles ---------- */
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
@media (max-width:820px){.tile-grid{grid-template-columns:1fr}}
.tile{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s,border-color .12s}
.tile:hover{transform:translateY(-1px);box-shadow:0 6px 20px -8px rgba(23,33,29,.28);border-color:var(--primary)}
.tile .t-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .t-icon svg{width:24px;height:24px}
.tile.stock .t-icon{background:var(--green-bg);color:var(--green)}
.tile.master .t-icon{background:var(--navy-bg);color:var(--navy)}
.tile .t-body{flex:1;min-width:0}
.tile .t-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .t-title h3{margin:0;font-size:15px;color:var(--text)}
.tile .t-go{color:var(--muted);font-size:14px}
.tile .t-desc{color:var(--muted);font-size:12px;margin-top:3px}
.tile .t-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.t-chip{background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.t-chip b{color:var(--primary-dark)}
.t-chip.alert b{color:var(--red)}

/* ---------- Stock register (verification ledger) ---------- */
.reg-toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;width:100%}
.reg-toolbar .rt-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;flex:1 1 100%}
.reg-toolbar .rt-right{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.reg-toolbar .chips{display:flex;gap:8px;flex-wrap:wrap}
.reg-toolbar select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;font-size:13px;min-width:230px;max-width:340px;outline:none;cursor:pointer;color:var(--text)}
.reg-filter{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:100px;background:#fff;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.reg-filter.active{background:var(--primary);border-color:var(--primary);color:#fff}
.rt-size{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.rt-size select{min-width:76px;max-width:96px;padding:6px 8px}
.rt-count{color:var(--muted);font-size:13px;white-space:nowrap}
.reg-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.reg-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:100px;background:var(--bg);font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap}
.reg-pill button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 2px;border-radius:50%}
.reg-pill button:hover{color:var(--red)}
.reg-pagination{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;margin-top:14px;font-size:13px;color:var(--muted)}
.reg-pagination .pg-info{margin-right:auto;white-space:nowrap}
.reg-pagination .pg-btn{min-width:32px;height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--primary-dark)}
.reg-pagination .pg-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.reg-pagination .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.reg-pagination .pg-btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:720px){.reg-toolbar .rt-right{margin-left:0}.reg-pagination{justify-content:flex-start}.reg-pagination .pg-info{margin-right:0;flex:1 1 100%}}
.reg-table th{white-space:nowrap}
.reg-table td{vertical-align:top;white-space:nowrap}
.reg-table td.wrap{white-space:normal;min-width:160px}
.reg-table .sno{color:var(--muted);font-weight:600}
.reg-table .centre{font-weight:700}
.reg-table .diff.zero{color:var(--green)}
.reg-table .diff.neg{color:var(--red);font-weight:700}
.reg-table .diff.pos{color:var(--amber);font-weight:700}
.row-actions{display:flex;gap:6px;flex-wrap:nowrap}
/* ---------- Data-table engine (Phase 2) ---------- */
.dt{font-size:13px}
.dt thead tr.grp-row th{text-align:center;letter-spacing:.05em;top:0;height:34px;box-sizing:border-box;z-index:7}
.dt thead tr.grp-row th.grp{border-left:1px solid var(--line)}
.dt thead tr.sub-row th{top:34px;height:34px;box-sizing:border-box;z-index:6;border-bottom:1px solid var(--line)}
.dt thead th span.th-label{display:inline-flex;align-items:center;gap:6px}
.dt thead th span.th-label[data-sort]{cursor:pointer;user-select:none}
.dt thead th span.th-label[data-sort]:hover{color:var(--primary)}
.dt .sort-ic{font-size:9px;opacity:.45;line-height:1}
.dt .sort-ic.active{opacity:1;color:var(--primary)}
.dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.dt tbody tr:hover td{background:#f6faf8}
.dt th.col-sticky,.dt td.col-sticky{position:sticky;right:0}
.dt th.col-sticky{z-index:11 !important;background:var(--primary-tint);box-shadow:-8px 0 8px -8px rgba(0,0,0,.18)}
.dt td.col-sticky{z-index:2;background:var(--surface);box-shadow:-8px 0 8px -8px rgba(0,0,0,.12)}
.dt tbody tr:hover td.col-sticky{background:#f6faf8}


/* ---------- Buttons ---------- */
.btn{
  padding:8px 15px;border-radius:8px;border:1px solid var(--input-border);background:#fff;color:var(--text);
  cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;line-height:1.3;
}
.btn:hover{background:var(--bg)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(31,93,80,.18)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.green{background:var(--green-bg);border-color:var(--green-bg);color:var(--green)}
.btn.green:hover{background:#d5eee1}
.btn.red{background:var(--red-bg);border-color:var(--red-bg);color:var(--red)}
.btn.red:hover{background:#fbdcd8}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.icon.sm{padding:6px;width:32px;height:32px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 auto}

/* ---------- Dropdown / popover ---------- */
.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:190px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:70;display:none}
.dropdown-menu.open{display:block}
.dropdown-menu .chead{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 11px 4px}
.dropdown-menu button,.dropdown-menu label{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--text);text-align:left;font-family:inherit;white-space:nowrap}
.dropdown-menu button:hover,.dropdown-menu label:hover{background:var(--bg)}
.dropdown-menu button svg{width:15px;height:15px;color:var(--muted)}
.dropdown-menu label input{margin:0;accent-color:var(--primary)}
.dropdown-menu .dsep{height:1px;background:var(--line);margin:5px 0}

/* ---------- Filter chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid var(--chip-border);border-radius:16px;background:var(--chip-bg);font-size:13px;color:#374151;white-space:nowrap;font-weight:500}
.chip b{font-weight:600;color:var(--text)}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 1px;border-radius:50%}
.chip button:hover{color:var(--red)}

/* ---------- Search bar (log page) ---------- */
.search-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{padding:8px 11px;border:1px solid var(--input-border);border-radius:8px;outline:none;background:#fff;height:36px}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,93,80,.12)}
.field.wide{min-width:170px}
.field.full{width:100%}
.form-row{display:flex;flex-wrap:wrap;gap:14px}
.form-row .field{flex:1 1 220px}
.hint{color:var(--muted);font-size:11.5px}
.sci-detail-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.sci-detail-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.sci-detail-tbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
.sci-detail-tbl td:last-child{border-bottom:none}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 1px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary-dark);border-bottom-color:var(--primary-dark);font-weight:600}
.tab .count{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:100px;padding:1px 7px}
.tab-panel{}

/* ---------- Request cards ---------- */
.req-card{margin-bottom:12px}
.req-card.pending{border-left:3px solid var(--amber)}
.req-card.in{border-left-color:var(--primary)}
.req-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.req-flow{font-weight:600;font-size:13.5px}
.req-flow .arrow{color:var(--accent);margin:0 4px}
.req-meta{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12.5px}
.req-meta div b{color:var(--text)}
.req-actions{display:flex;gap:8px;margin-top:12px}
.empty{color:var(--muted);font-style:italic;padding:18px;text-align:center}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(23,33,29,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px 22px 18px;width:100%;max-width:360px;box-shadow:0 20px 60px -10px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16.5px;color:var(--text)}
.modal-head .hint{margin:4px 0 0;max-width:480px}
.modal-body{padding-top:2px}
.modal-sec{padding:12px 0 2px}
.modal-sec + .modal-sec{border-top:1px dashed var(--line);margin-top:8px}
.modal-sec-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);margin-bottom:10px}
.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.modal-grid .full{grid-column:1/-1}
.modal-grid .field{min-width:0}
.modal-grid .field input,.modal-grid .field select{width:100%;min-width:0}
.modal-grid .field input[readonly]{background:var(--bg);color:var(--muted);cursor:default}
.modal-grid .field input::placeholder{color:#a9b0ac}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .m-sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.modal .m-cur{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}
.modal .m-cur b{font-family:'Inter',system-ui,sans-serif;font-size:18px;color:var(--primary-dark)}
.m-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none;font-size:16px;text-align:center}
.m-input:focus{border-color:var(--primary)}
.m-step{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.m-step button{padding:7px 0;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.m-step button:hover{background:var(--primary-tint);border-color:var(--primary)}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.m-actions .btn{flex:0 0 auto;min-width:120px;justify-content:center}

/* ---------- SCI form detail modal ---------- */
.fd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
.f-d{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.f-d span{color:var(--muted);text-transform:capitalize;font-size:11.5px}
.f-d b{font-weight:600;font-size:13px;word-break:break-word}
.fd-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fd-title{font-weight:700;font-size:12px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.fd-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.masters-grid{display:flex;flex-direction:column;gap:14px}
.reg-toolbar input[type=text]{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;font-size:13px;color:var(--text);flex:1;min-width:220px}
.reg-toolbar input[type=text]:focus{border-color:var(--primary)}
.reg-toolbar .ma-letter{min-width:110px;max-width:140px}
.ma-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.02em}
.ma-badge.item{background:var(--accent-tint);color:var(--accent)}
.ma-badge.doc{background:var(--green-bg);color:var(--green)}
.ma-sub{color:var(--muted);font-size:12px;margin:0 14px 0 2px}
.ma-tbl{width:100%;border-collapse:collapse;font-size:13px}
.ma-tbl th{position:sticky;top:0;background:var(--primary-tint);color:var(--primary-dark);text-align:left;padding:10px 12px;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}
.ma-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ma-tbl tr:last-child td{border-bottom:none}
.ma-tbl tr:hover td{background:var(--primary-tint)}
.ma-tbl .item-name{font-weight:600;color:var(--text);display:block;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma-tbl .item-code{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-tint);padding:2px 7px;border-radius:5px;display:inline-block}
.ma-tbl .empty{color:var(--muted);text-align:center;padding:28px 10px;font-style:italic}
.ma-tbl .item-sub{color:var(--muted);font-size:12px;line-height:1.35;max-width:260px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.ma-tbl .item-plain{display:block;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma-status{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;white-space:nowrap}
.ma-status.on{background:var(--green-bg);color:var(--green)}
.ma-status.off{background:var(--red-bg);color:var(--red)}
.ma-status.sub{background:var(--accent-tint);color:var(--accent)}
.sci-dl-card{max-width:560px;margin:0 auto;text-align:center;padding:30px 26px}
.sci-dl-chip{display:inline-block;background:var(--primary-tint);color:var(--primary-dark);font-weight:700;font-size:12px;letter-spacing:.08em;padding:4px 12px;border-radius:20px;margin-bottom:14px}
.sci-dl-card h3{margin:0 0 8px;font-size:19px;color:var(--text)}
.sci-dl-card p{color:var(--muted);font-size:13.5px;margin:0 auto 18px;max-width:420px}
.sci-dl-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;font-size:14px;text-decoration:none}
.sci-dl-card .hint{font-size:12px;margin:16px auto 0}
.ma-tbl tbody tr:nth-child(even) td{background:#fafbfc}
.ma-tbl tbody tr:hover td{background:var(--primary-tint)}
.ma-tbl td:last-child,.ma-tbl th:last-child{text-align:right}
.ma-tbl .doc-row-actions{justify-content:flex-end}
#maPanel-item .ma-tbl{table-layout:auto;min-width:1900px}
#maPanel-item .ma-tbl th{white-space:nowrap}
#maPanel-item .ma-tbl td{overflow:hidden}
#maPanel-item .ma-tbl .doc-row-actions{flex-wrap:nowrap}
#maPanel-item .ma-tbl td.col-sticky{min-width:130px}
.ma-created{color:var(--muted);font-size:12px;white-space:nowrap}
.im-sim{margin:2px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.im-sim-note{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.im-sim-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 4px;font-size:13px}
.im-sim-row + .im-sim-row{border-top:1px solid var(--line)}
.im-sim-row b{color:var(--ink)}
.im-sim-row .sim-meta{color:var(--muted);font-size:12px}
.im-sim-hi{margin:0 0 8px;font-size:12.5px;color:var(--amber-dark,var(--amber));background:var(--amber-bg);padding:8px 10px;border-radius:8px}
.im-selected{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-bg);padding:8px 10px;border-radius:8px}
.doc-no{width:130px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.doc-no:focus{border-color:var(--primary);outline:none}
.doc-row-actions{display:flex;gap:6px;align-items:center}
.doc-desc{font-size:11px;color:var(--muted);max-width:230px;line-height:1.35;margin-top:3px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
#sciLogTable tr[data-form-id],#sciMyTable tr[data-form-id],.logs table tr[data-form-id]{cursor:pointer}

/* ---------- Toast ---------- */
#toastHost{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--primary-dark);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.35);animation:toastIn .18s ease;max-width:320px;
}
.toast.err{background:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- SCI forms ---------- */
.sci-editor{margin-bottom:20px}
.sci-editor h3{font-family:'Inter',system-ui,sans-serif;color:var(--primary-dark);font-size:18px;text-transform:none;letter-spacing:0}
.sci-editor textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;width:100%;box-sizing:border-box;min-height:92px;resize:vertical}
.sci-editor textarea:focus{border-color:var(--primary)}
.sci-editor input[type=text],.sci-editor input[type=number],.sci-editor input[type=file],.sci-editor select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;font-size:13px;color:var(--text)}
.sci-editor input:focus,.sci-editor select:focus{border-color:var(--primary)}
.sci-meta-bar{margin-bottom:14px}
.sci-meta{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:13px}
.sci-meta b{color:var(--ink);font-weight:600}
.sci-section-head{padding:16px 18px;border-bottom:1px solid var(--line)}
.sci-section-head h3{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--primary-dark);font-size:17px;text-transform:none;letter-spacing:0}
.sci-section-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.sci-form-body{padding:0 18px 18px}
.sci-section{padding:16px 0;border-bottom:1px solid var(--line)}
.sci-section:last-child{border-bottom:none}
.sci-sec-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.sci-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

<script>
/* =========================================================================
   Supabase config (local dev)
   Keys are NOT committed. Provide them locally via config.local.js
   (see .gitignore); the file defines window.IMS_CONFIG.
   ========================================================================= */
const SUPABASE_URL = 'https://rfvevmckrjvcvlldtlaq.supabase.co';
const IMS_CFG = (typeof window !== 'undefined' && window.IMS_CONFIG) || {};
const SUPABASE_ANON_KEY = IMS_CFG.anonKey || '';
const SUPABASE_SECRET_KEY = IMS_CFG.secretKey || '';
const SM_EMAIL_DOMAIN = '@ims.local';

const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const sbAdmin = SUPABASE_SECRET_KEY ? createClient(SUPABASE_URL, SUPABASE_SECRET_KEY, { auth: { persistSession: false, autoRefreshToken: false } }) : null;

function buildUser(p) {
  if (p.role === 'SUPERADMIN') return { id: 'superadmin', username: p.username, name: p.name, role: 'admin', type: 'ASO ADMIN' };
  if (p.role === 'ASO_VIEWER') return { id: 'aso_viewer', username: p.username, name: p.name, role: 'viewer', type: 'ASO VIEWER' };
  return { id: p.centreId, username: p.username, name: p.name, role: 'centre', type: p.userType || 'CENTRE', centreId: p.centreId, centreName: p.centreName };
}

function storageFileUrl(p) {
  return SUPABASE_URL + '/storage/v1/object/public/uploads/' + String(p || '').split('/').map(encodeURIComponent).join('/');
}

async function login(username, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email: username.trim() + SM_EMAIL_DOMAIN, password });
  if (error) throw new Error(error.message === 'Invalid login credentials' ? 'Invalid credentials' : error.message);
  const { data: prof, error: perr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if (perr || !prof) throw new Error('Profile for this login was not found');
  const user = buildUser(prof);
  setSession(data.session.access_token, user);
  return { token: data.session.access_token, user };
}

/* =========================================================================
   Shared helpers â€” auth, api, ui utilities
   ========================================================================= */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function toast(msg, isError) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 250); }, 3200);
}

function getToken() { return localStorage.getItem('sms_token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('sms_user') || 'null'); } catch (e) { return null; } }
function setSession(token, user) {
  localStorage.setItem('sms_token', token);
  localStorage.setItem('sms_user', JSON.stringify(user));
}
function clearSession() {
  localStorage.removeItem('sms_token');
  localStorage.removeItem('sms_user');
}
function isAdmin() {
  const u = getUser();
  return !!u && (u.id === 'superadmin' || u.role === 'admin' || u.type === 'ASO ADMIN');
}
function isSuperAdmin() {
  const u = getUser();
  return !!u && u.id === 'superadmin';
}
function isViewer() {
  const u = getUser();
  return !!u && (u.role === 'viewer' || u.type === 'ASO VIEWER');
}

async function fetchCenters() {
  const { data, error } = await sb.from('centres').select('id, name, type, parentId').order('name', { ascending: true });
  if (error) throw new Error(error.message);
  return data || [];
}

async function fetchAllPages(builder) {
  const all = [];
  const PAGE = 1000;
  for (let start = 0; start < 100000; start += PAGE) {
    const { data, error } = await builder(start, start + PAGE - 1);
    if (error) throw new Error(error.message);
    if (!data || !data.length) break;
    all.push(...data);
    if (data.length < PAGE) break;
  }
  return all;
}

async function fetchStock() {
  const [itemsArr, stockArr] = await Promise.all([
    fetchAllPages((a, b) => sb.from('items').select('name').order('name', { ascending: true }).range(a, b)),
    fetchAllPages((a, b) => sb.from('stock_items').select('centreId, item, qty, unit').range(a, b))
  ]);
  const stock = {}, unit = {};
  stockArr.forEach((s) => {
    (stock[s.centreId] = stock[s.centreId] || {})[s.item] = Number(s.qty);
    (unit[s.centreId] = unit[s.centreId] || {})[s.item] = s.unit || '';
  });
  return { items: itemsArr.map((i) => i.name), stock, unit };
}

async function updateStock(centerId, updates, units = {}) {
  const rows = Object.keys(updates).map((item) => ({ centreId: Number(centerId), item, qty: Number(updates[item]), unit: units[item] != null ? String(units[item]) : '' }));
  if (!rows.length) return;
  const { error } = await sb.from('stock_items').upsert(rows, { onConflict: 'centreId,item' });
  if (error) throw new Error(error.message);
}

/*
  Duplicate / similar-item detection for the Item Master.
  Normalises a name (lowercase, "&" -> "and", any punctuation to a single
  space) then scores candidates: exact match, containment, or token overlap
  (where "80w" ~ "80", "w" ~ "watts" etc. via prefix matching).
*/
function normItemName(s) {
  return String(s || '').toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function itemTokenMatches(a, b) {
  if (a === b) return true;
  return a.length >= 2 && b.length >= 2 && (a.startsWith(b) || b.startsWith(a));
}

function findSimilarItems(all, name, omitId) {
  const n = normItemName(name);
  if (!n) return [];
  return all
    .filter((r) => r && r.name && String(r.id) !== String(omitId))
    .map((item) => {
      const rn = normItemName(item.name);
      let score;
      if (rn === n) score = 1;
      else if (rn.includes(n) || n.includes(rn)) score = 0.9;
      else {
        const ta = n.split(' ').filter(Boolean);
        const tb = rn.split(' ').filter(Boolean);
        const bset = new Set(tb);
        let shared = 0;
        ta.forEach((t) => { if ([...bset].some((b) => itemTokenMatches(t, b))) shared++; });
        score = ta.length && tb.length ? shared / Math.min(ta.length, tb.length) : 0;
      }
      return { item, score: Math.min(score, 1) };
    })
    .filter((m) => m.score >= 0.55)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
}

async function fetchSCIForms(qs) {
  let query = sb.from('sci_forms').select('*');
  const params = new URLSearchParams(qs || '');
  const type = params.get('formType');
  const status = params.get('status');
  const centreId = params.get('centreId');
  const q = params.get('q');
  if (type) query = query.eq('formType', type);
  if (status) query = query.eq('status', status);
  if (centreId) query = query.eq('centreId', Number(centreId));
  if (q) {
    const fq = String(q).replace(/[%,()'"\\]/g, '');
    query = query.or(`sewadarName.ilike.%${fq}%,sewadarBadge.ilike.%${fq}%,centreName.ilike.%${fq}%`);
  }
  query = query.order('submittedAt', { ascending: false });
  const { data, error } = await query;
  if (error) throw new Error(error.message);
  return data || [];
}

async function updateFormStatus(id, action) {
  const status = action === 'approve' ? 'approved' : action === 'reject' ? 'rejected' : action;
  if (action === 'approve') {
    const { data: form, error: fErr } = await sb.from('sci_forms').select('*').eq('id', id).maybeSingle();
    if (fErr) throw new Error(fErr.message);
    if (form && form.status !== 'approved') {
      const adjusted = await applyApprovalStock(form);
      if (adjusted) toast('Approved â€” stock auto-adjusted');
    }
  }
  const { error } = await sb.from('sci_forms').update({ status }).eq('id', id);
  if (error) throw new Error(error.message);
}

async function applyApprovalStock(form) {
  const effect = SCI_STOCK_EFFECT[form.formType];
  const items = form.details && Array.isArray(form.details.items) ? form.details.items : null;
  if (!effect || !items || !items.length) return false;

  const movements = [];
  const srcCentre = effect.src === 'destination' ? form.destinationCentreId : form.centreId;
  for (const it of items) {
    const qty = Number(it.qty) || 0;
    if (!it.name || qty <= 0) continue;
    const unit = String(it.unit || '').trim();
    if (srcCentre != null) movements.push({ centreId: Number(srcCentre), item: it.name, delta: (effect.delta || 0) * qty, unit });
    if (effect.dst === 'destination' && form.destinationCentreId != null && form.destinationCentreId !== srcCentre) {
      movements.push({ centreId: Number(form.destinationCentreId), item: it.name, delta: (effect.deltaDst || 0) * qty, unit });
    }
  }
  if (!movements.length) return false;

  const centres = [...new Set(movements.map((m) => m.centreId))];
  const { data: rows, error: rowsErr } = await sb.from('stock_items')
    .select('centreId, item, qty, unit')
    .in('centreId', centres);
  if (rowsErr) throw new Error(rowsErr.message);
  const current = new Map((rows || []).map((r) => [`${r.centreId}|${r.item}`, r]));

  const balance = (cid, item) => {
    const r = current.get(`${cid}|${item}`);
    return r ? Number(r.qty) || 0 : 0;
  };
  const check = new Map();
  movements.forEach((m) => {
    const key = `${m.centreId}|${m.item}`;
    check.set(key, (check.get(key) || 0) + m.delta);
  });
  for (const [key, delta] of check) {
    const [cid, item] = key.split('|');
    const b = balance(Number(cid), item);
    const after = b + delta;
    if (after < 0) throw new Error(`Insufficient stock for "${item}" at the source centre (${b} available, ${-delta} required). Fix the form or reject it.`);
  }

  const approvalNo = String((form.details && form.details.approvalNo) || '').trim() || `${form.formType} / form-${form.id}`;
  const approver = (getUser() && getUser().name) || '';
  const approvalDate = form.approvalDate || new Date().toISOString().slice(0, 10);

  const grouped = new Map();
  movements.forEach((m) => {
    const key = `${m.centreId}|${m.item}`;
    const g = grouped.get(key) || { centreId: m.centreId, item: m.item, delta: 0, unit: m.unit };
    g.delta += m.delta;
    if (m.unit) g.unit = m.unit;
    grouped.set(key, g);
  });

  const upsertRows = [];
  const ledgerRows = [];
  for (const g of grouped.values()) {
    const before = balance(g.centreId, g.item);
    const after = before + g.delta;
    upsertRows.push({ centreId: Number(g.centreId), item: g.item, qty: after, unit: g.unit || String((current.get(`${g.centreId}|${g.item}`) || {}).unit || '') });
    const centreName = g.centreId === form.destinationCentreId ? (form.destinationCentreName || '') : (form.centreName || '');
    ledgerRows.push({
      centreId: Number(g.centreId),
      item: g.item,
      unit: g.unit || '',
      pageNo: '',
      approvalNo,
      approvalDate: approvalDate || null,
      qtyA: before,
      qtyB: after,
      reason: `SCI ${form.formType} approved - stock auto-adjusted`,
      remarks: `Approved form ${form.id} Â· ${form.formType} â†’ ${centreName}`,
      verifiedBy: approver
    });
  }

  const { error: upErr } = await sb.from('stock_items').upsert(upsertRows, { onConflict: 'centreId,item' });
  if (upErr) throw new Error(upErr.message);
  if (ledgerRows.length) {
    const { error: ledErr } = await sb.from('stock_register').insert(ledgerRows);
    if (ledErr) throw new Error(ledErr.message);
  }
  return true;
}

  }).join(','))).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });

  link.remove();

function itemRowHtml(cols, hasRegister, itemOptions) {

    if (c.type === 'select') return cell('', `<select class="sci-sel" data-col="${c.key}"><option value="">â€” ${esc(c.label)} â€”</option>${c.options.map((opt) => `<option value="${esc(opt)}">${esc(opt)}</option>`).join('')}</select>`);
    if (c.type === 'calc') return cell('', `<input type="number" class="sci-calc" data-col="${c.key}" readonly placeholder="Auto" title="Auto-computed">`);

/* ---------- Center search combobox ---------- */
function createCenterSearch(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'cs-wrap';
  wrap.innerHTML = `
    <input class="cs-input" type="text" placeholder="${esc(opts.placeholder || 'Searchâ€¦')}" autocomplete="off">
    <div class="cs-drop"></div>`;
  const input = wrap.querySelector('.cs-input');
  const drop = wrap.querySelector('.cs-drop');
  let items = [];

  function renderList(q) {
    const query = (q || '').trim().toLowerCase();
    const matches = query ? items.filter((c) => c.name.toLowerCase().includes(query)).slice(0, 40) : [];
    if (!query) { drop.classList.remove('open'); drop.innerHTML = ''; return; }
    drop.innerHTML = matches.length
      ? matches.map((c) => `<div class="cs-item" data-id="${esc(c.id)}"><span>${esc(c.name)}</span><span class="badge ${badgeCls(c.type)}">${esc(c.type)}</span></div>`).join('')
      : '<div class="cs-empty">No matching centers</div>';
    drop.classList.add('open');
  }
  function badgeCls(t) { return t === 'CENTRE' ? 'navy' : t === 'SUB CENTRE' ? 'azure' : t === 'POINT' ? 'sky' : 'green'; }

  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('focus', () => { if (input.value.trim()) renderList(input.value); });
  drop.addEventListener('click', (e) => {
    const item = e.target.closest('.cs-item');
    if (!item || !item.dataset.id) return;
    const c = items.find((x) => x.id === item.dataset.id);
    input.value = c ? c.name : '';
    drop.classList.remove('open');
    opts.onSelect(c || null);
  });
  document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) drop.classList.remove('open'); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { drop.classList.remove('open'); }
    if (e.key === 'Backspace' && !input.value) opts.onSelect(null);
  });

  return {
    el: wrap,
    setItems(list) { items = list || []; },
    setValue(v) { input.value = v || ''; }
  };
}

function requireAuth() {
  const user = getUser();
  if (!getToken() || !user) { location.hash = '/login'; return null; }
  return user;
}

/* ---------- Hash router ---------- */
function parseHash() {
  const raw = location.hash.slice(1) || '/dashboard';
  const [path, qs] = raw.split('?');
  return { path: path || '/dashboard', params: new URLSearchParams(qs || '') };
}

function route() {
  const { path, params } = parseHash();
  const user = getUser();

  if (path === '/login') {
    if (getToken() && user) { location.hash = '/dashboard'; return; }
    renderLoginPage();
    return;
  }
  if (!getToken() || !user) { location.hash = '/login'; return; }

  if (path === '/dashboard') { renderShell(user, 'dashboard.html'); renderDashboardPage(user, params); }
  else if (path === '/stock') { renderShell(user, 'stock.html'); renderStockPage(user, params); }
  else if ((path === '/masters/item' || path === '/masters' || path === '/masters/doc' || path === '/masters/centre') && (isAdmin() || isViewer())) {
    if (path === '/masters/doc') { renderShell(user, 'masters-doc.html'); renderMastersPage(user, 'doc'); }
    else if (path === '/masters/centre') { renderShell(user, 'masters-centre.html'); renderMastersPage(user, 'centre'); }
    else { renderShell(user, 'masters-item.html'); renderMastersPage(user, 'item'); }
  }
  else if (path === '/masters/item' || path === '/masters' || path === '/masters/doc' || path === '/masters/centre' || path === '/log' || /^\/forms\/SCI\d+$/.test(path)) {
    location.hash = '/dashboard';
    return;
  }
  else if (path === '/forms' || /^\/forms\/SCI\d+$/.test(path)) {
    const code = /^\/forms\/(SCI\d+)$/.test(path) ? path.match(/^\/forms\/(SCI\d+)$/)[1] : 'SCI45';
    const ok = SCI_FORM_META.some((m) => m.code === code) ? code : 'SCI45';
    renderShell(user, 'sci' + ok.replace('SCI', '') + '.html');
    renderSCIFormsPage(user, ok);
  }
  else if (path === '/log') { renderShell(user, 'log.html'); renderSCIFormsLogPage(user); }
  else if (path === '/reset' && isSuperAdmin()) { renderShell(user, 'reset.html'); renderResetPage(user); }
  else { location.hash = '/dashboard'; }
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
